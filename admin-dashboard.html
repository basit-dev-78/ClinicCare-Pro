<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prominent Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2f3e55;
      --accent: #ffb347;
      --accent2: #6dd5ed;
      --bg: #f5f7fa;
      --text: #1f2937;
      --muted: #6b7280;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #dfe9f3, #ffffff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* floating blobs */
    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.5;
      animation: float 10s infinite ease-in-out;
    }

    .blob1 { width: 300px; height: 300px; background: #6dd5ed; top: -80px; left: -80px; }
    .blob2 { width: 250px; height: 250px; background: #ffb347; bottom: -60px; right: -60px; animation-delay: 3s; }

    @keyframes float {
      0%,100% { transform: translateY(0px);} 
      50% { transform: translateY(-30px);} 
    }

    .container {
      width: 95%;
      max-width: 1050px;
      min-height: 550px;
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,0.12);
      animation: fadeIn 1s ease;
      position: relative;
      z-index: 2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(40px);} 
      to { opacity: 1; transform: translateY(0);} 
    }

    .left {
      flex: 1;
      padding: 60px 45px;
    }

    .logo {
      font-weight: 700;
      font-size: 20px;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 30px;
      color: var(--text);
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      font-size: 12px;
      color: var(--muted);
    }

    .input-group input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      transition: 0.3s;
      background: #f9fafb;
    }

    .input-group input:focus {
      border-color: var(--accent2);
      background: #fff;
      outline: none;
      box-shadow: 0 0 0 3px rgba(109,213,237,0.2);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--primary), #1f2a3a);
      color: #fff;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.3s;
      box-shadow: 0 8px 20px rgba(47,62,85,0.3);
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 12px 25px rgba(47,62,85,0.4);
    }

    .links {
      margin-top: 20px;
      font-size: 12px;
      color: var(--muted);
    }

    .links a {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      text-decoration: none;
      transition: 0.2s;
    }

    .links a:hover {
      color: var(--primary);
      transform: translateX(3px);
    }

    .terms {
      margin-top: 25px;
      font-size: 10px;
      color: #9ca3af;
    }

    .right {
      flex: 1;
      background: linear-gradient(135deg, #f0f4f8, #ffffff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
    }

    .circle {
      width: 240px;
      height: 240px;
      background: linear-gradient(135deg, #e6eef3, #ffffff);
      border-radius: 50%;
      position: absolute;
      animation: float 6s ease-in-out infinite;
    }

    .illustration {
      width: 200px;
      z-index: 2;
      animation: pop 1s ease;
    }

    @keyframes pop {
      from { transform: scale(0.8); opacity: 0;} 
      to { transform: scale(1); opacity: 1;} 
    }

    .text {
      margin-top: 25px;
      text-align: center;
      font-size: 15px;
      color: var(--text);
      line-height: 1.6;
    }

    .text span {
      color: var(--accent);
      font-weight: 700;
    }

    .support {
      position: absolute;
      top: 20px;
      right: 25px;
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }

      .right {
        order: -1;
        height: 260px;
      }

      .circle {
        width: 160px;
        height: 160px;
      }
    }

  </style>
</head>
<body>

  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <div class="container">

    <div class="left">
      <div class="logo">Prominent</div>
      <h2>Login to your Prominent Account</h2>

      <div class="input-group">
        <label>Access Email</label>
        <input type="text" placeholder="Access email" />
      </div>

      <div class="input-group">
        <label>Access Key</label>
        <input type="password" placeholder="Access key" />
      </div>

      <button class="btn">Sign in</button>

      <div class="links">
        <p>Don't have an account? Register here</p>
        <a href="#">Forgot key?</a>
        <a href="#">Retrieve account</a>
      </div>

      <div class="terms">
        By logging into the Prominent application you are agreeing to the Terms & Conditions
      </div>
    </div>

    <div class="right">
      <div class="support">Support</div>
      <div class="circle"></div>
      <img class="illustration" src="https://cdn-icons-png.flaticon.com/512/4140/4140048.png" alt="illustration">
      <div class="text">
        We take care of your <span>Billing</span><br>
        You take care of <span>Patient</span>
      </div>
    </div>

  </div>

</body>
</html>
