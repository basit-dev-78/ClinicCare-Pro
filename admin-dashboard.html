<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>ClinicCare Pro | Command Center (Responsive Scale)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f0f5fe; /* softer background for 100% comfort */
            color: #0a1e3c;
            overflow-x: hidden;
        }

        /* Premium Scrollbar - refined */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #e2edfc; border-radius: 12px; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 12px; }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        /* ========== SIDEBAR - refined proportions for 100% zoom ========== */
        .sidebar {
            width: 280px;          /* slightly reduced from 300px to avoid overload at 100% */
            background: #0b1f3a;
            backdrop-filter: blur(0);
            background: linear-gradient(180deg, #0c1f3c 0%, #08213e 100%);
            border-right: 1px solid rgba(255,255,255,0.08);
            box-shadow: 8px 0 28px -12px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            color: white;
            z-index: 100;
            transition: all 0.2s ease;
        }

        .sidebar-header {
            padding: 28px 20px 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }

        .brand-icon {
            width: 46px;
            height: 46px;
            background: linear-gradient(135deg, #2b6ef0, #a855f7);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            box-shadow: 0 8px 18px -6px #2563eb70;
        }

        .sidebar-header h2 {
            font-weight: 700;
            font-size: 1.35rem;
            background: linear-gradient(to right, #ffffff, #c3dbff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.2px;
        }

        .profile-card {
            background: rgba(255,255,255,0.03);
            margin: 18px 16px 20px;
            padding: 18px 18px;
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .profile-name {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .profile-name i { font-size: 1rem; color: #60a5fa; background: rgba(255,255,255,0.06); padding: 6px; border-radius: 12px; }

        .profile-detail {
            font-size: 0.75rem;
            color: #b9d0f5;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 6px 0;
        }
        .profile-detail i { width: 20px; font-size: 0.7rem; color: #7ca5f0; }

        .role-tag {
            background: linear-gradient(105deg, #2563eb, #7c3aed);
            padding: 5px 14px;
            border-radius: 32px;
            font-size: 0.65rem;
            font-weight: 600;
            display: inline-block;
            margin-top: 10px;
            letter-spacing: 0.2px;
        }

        .nav-menu {
            flex: 1;
            padding: 8px 12px 20px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 18px;
            margin: 3px 0;
            border-radius: 18px;
            color: rgba(255,255,255,0.7);
            font-weight: 500;
            font-size: 0.85rem;
            transition: all 0.2s;
            cursor: pointer;
        }

        .nav-item i { width: 22px; font-size: 1.05rem; color: rgba(255,255,255,0.5); }

        .nav-item:hover {
            background: rgba(59, 130, 246, 0.2);
            color: white;
            transform: translateX(4px);
        }
        .nav-item:hover i { color: #aac9ff; }

        .nav-item.active {
            background: linear-gradient(95deg, #1e3a8a, #2e4dad);
            color: white;
            box-shadow: 0 5px 12px -5px #1e3a8a;
            border-left: 3px solid #fbbf24;
        }
        .nav-item.active i { color: white; }

        .logout-button {
            margin: 12px 16px 24px;
            padding: 12px 20px;
            background: rgba(239,68,68,0.08);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 40px;
            color: #ffbcbc;
            font-weight: 600;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .logout-button:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
            transform: scale(1.01);
        }

        /* ========== MAIN PANEL - ADAPTED TO LOOK LIKE 80% ZOOM AT 100% ========== */
        .main-panel {
            flex: 1;
            margin-left: 280px;
            padding: 24px 32px;
            background: #f0f5fe;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 12px 28px;
            border-radius: 60px;
            box-shadow: 0 4px 14px rgba(0,20,50,0.04);
            margin-bottom: 28px;
            border: 1px solid #e6edfa;
        }

        .page-title {
            font-weight: 700;
            font-size: 1.6rem;
            background: linear-gradient(135deg, #142b54, #1f46b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .live-clock {
            background: #eef3ff;
            padding: 7px 20px;
            border-radius: 40px;
            font-weight: 500;
            color: #1e4480;
            font-size: 0.8rem;
            border: 1px solid #d4e2fc;
        }

        /* stat cards - more compact, elegant at 100% */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-block {
            background: white;
            padding: 18px 22px;
            border-radius: 32px;
            border: 1px solid #e2edfc;
            box-shadow: 0 8px 18px -10px rgba(0,35,70,0.06);
            display: flex;
            align-items: center;
            gap: 18px;
            transition: all 0.2s;
        }
        .stat-block:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 24px -12px #1e40af30;
            border-color: #bcd2ff;
        }

        .stat-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(120deg, #eef4ff, #e9e4ff);
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            color: #2b5fd9;
        }

        .stat-info h4 { font-weight: 500; color: #667f9e; font-size: 0.75rem; letter-spacing: 0.4px; margin-bottom: 4px; }
        .stat-info .figure { font-weight: 800; font-size: 1.8rem; color: #0a2540; line-height: 1.2; }

        /* cards - tighter padding for better 100% scaling */
        .content-card {
            background: white;
            border-radius: 36px;
            padding: 24px 28px;
            border: 1px solid #e5edfc;
            box-shadow: 0 10px 24px -12px rgba(0,30,60,0.06);
            margin-bottom: 26px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .card-header h3 { font-weight: 700; font-size: 1.3rem; color: #0f2c4e; }

        /* table density improved */
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 12px 8px 12px 8px;
            font-weight: 600;
            font-size: 0.7rem;
            color: #5b7295;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 2px solid #e6edfc;
        }
        td {
            padding: 12px 8px;
            border-bottom: 1px solid #f0f4fe;
            color: #1a3154;
            font-size: 0.85rem;
        }

        .status-badge {
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.7rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-active { background: #e1f7ea; color: #0b6e41; }
        .badge-pending { background: #fff0df; color: #b15500; }
        .badge-role { background: #e9efff; color: #1d4ed8; }

        .btn-primary {
            background: linear-gradient(105deg, #2563eb, #4f46e5);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 36px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 12px -2px #2563eb70;
            transition: 0.2s;
        }
        .btn-primary:hover { transform: scale(1.01); background: #1e4ad8; box-shadow: 0 8px 18px -3px #1e3a8a; }

        .btn-outline {
            background: white;
            border: 1px solid #cde0ff;
            color: #1e4796;
            padding: 7px 18px;
            border-radius: 30px;
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-outline:hover { background: #f1f7ff; }

        .icon-action {
            background: transparent;
            border: none;
            font-size: 0.95rem;
            color: #6f87af;
            padding: 6px;
            border-radius: 12px;
            cursor: pointer;
            margin: 0 2px;
        }
        .icon-action:hover { background: #eef3ff; color: #2563eb; }
        .icon-action.delete:hover { background: #feeaea; color: #dc2626; }

        .chart-box {
            height: 190px;
            width: 100%;
            background: #ffffff;
            border-radius: 28px;
            padding: 6px;
        }

        /* modal with proper size */
        .modal-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.25); backdrop-filter: blur(5px);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000;
        }
        .modal-window {
            background: white; border-radius: 48px; padding: 32px 36px;
            max-width: 500px; width: 90%; box-shadow: 0 35px 70px rgba(0,15,40,0.3);
        }
        .modal-window h2 { font-size: 1.6rem; margin-bottom: 22px; color: #0a2b50; }
        .form-field { margin-bottom: 18px; }
        .form-field label { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 6px; color: #2b4570; }
        .form-input {
            width: 100%; padding: 12px 20px; border: 1.5px solid #e2edfc; border-radius: 36px;
            font-family: 'Inter', sans-serif; font-size: 0.9rem;
        }
        .form-input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px #3b82f620; }
        .row-fields { display: flex; gap: 16px; }
        .row-fields .form-field { flex: 1; }
        .modal-actions { display: flex; gap: 16px; margin-top: 28px; }

        /* toast */
        .toast-notification {
            position: fixed; bottom: 25px; right: 25px;
            background: white; border-radius: 60px; padding: 14px 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 12px;
            transform: translateX(450px); transition: transform 0.25s; z-index: 1200;
            border-left: 4px solid; font-size: 0.85rem;
        }
        .toast-notification.show { transform: translateX(0); }
        .toast-success { border-left-color: #10b981; } .toast-error { border-left-color: #ef4444; }
        .toast-warning { border-left-color: #f59e0b; } .toast-info { border-left-color: #3b82f6; }

        /* Responsive: keep 100% compact but nice */
        @media (max-width: 1300px) {
            .stat-grid { gap: 16px; }
            .stat-block { padding: 14px 18px; }
            .stat-icon { width: 48px; height: 48px; font-size: 1.5rem; }
            .stat-info .figure { font-size: 1.5rem; }
        }
        @media (max-width: 1100px) {
            .sidebar { width: 260px; }
            .main-panel { margin-left: 260px; padding: 20px 24px; }
        }
        @media (max-width: 900px) {
            .stat-grid { grid-template-columns: repeat(2,1fr); }
            .sidebar { width: 240px; }
            .main-panel { margin-left: 240px; }
        }
        @media (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h2, .profile-detail span, .nav-item span, .logout-button span { display: none; }
            .main-panel { margin-left: 70px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- SIDEBAR with refined visual -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon"><i class="fas fa-stethoscope"></i></div>
            <h2>ClinicCare Pro</h2>
        </div>
        <div class="profile-card" id="profileCard"></div>
        <nav class="nav-menu" id="navMenu">
            <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></div>
            <div class="nav-item" data-page="users"><i class="fas fa-users"></i> <span>User management</span></div>
            <div class="nav-item" data-page="doctors"><i class="fas fa-user-md"></i> <span>Doctors</span></div>
            <div class="nav-item" data-page="appointments"><i class="fas fa-calendar-check"></i> <span>Appointments</span></div>
            <div class="nav-item" data-page="departments"><i class="fas fa-building"></i> <span>Departments</span></div>
            <div class="nav-item" data-page="reports"><i class="fas fa-chart-line"></i> <span>Analytics</span></div>
            <div class="nav-item" data-page="audit"><i class="fas fa-history"></i> <span>Audit trail</span></div>
            <div class="nav-item" data-page="settings"><i class="fas fa-sliders-h"></i> <span>Settings</span></div>
        </nav>
        <div class="logout-button" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> <span>Secure logout</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-panel">
        <div class="header-bar">
            <span class="page-title" id="headerTitle">Dashboard</span>
            <span class="live-clock" id="liveTime"></span>
        </div>
        <div class="content-area" id="contentArea"></div>
    </div>
</div>

<div id="modalRoot" style="display: none;"></div>
<div class="toast-notification" id="toastMsg"><i class="fas" id="toastIcon"></i><span id="toastText"></span></div>

<script>
    (function() {
        let currentUser = {
            id: 'A1001',
            name: 'Dr. Michael Adams',
            email: 'michael.adams@cliniccare.com',
            phone: '+1 (415) 555-8901',
            role: 'admin'
        };
        if (!localStorage.getItem('currentUser')) {
            localStorage.setItem('currentUser', JSON.stringify(currentUser));
        } else {
            currentUser = JSON.parse(localStorage.getItem('currentUser'));
        }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toastMsg');
            const iconMap = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            document.getElementById('toastIcon').className = 'fas ' + (iconMap[type] || 'fa-info-circle');
            document.getElementById('toastText').innerText = msg;
            toast.className = `toast-notification toast-${type}`;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3200);
        }
        window.showToast = showToast;

        // Initialize storage with clean dataset
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([
                { id: 'U1001', name: 'John Doe', email: 'john.d@example.com', phone: '+1 555-2301', role: 'patient', status: 'active', createdAt: '2025-01-10' },
                { id: 'U1002', name: 'Jane Smith', email: 'jane.s@example.com', phone: '+1 555-6712', role: 'patient', status: 'active', createdAt: '2025-01-15' },
                { id: 'U1003', name: 'Dr. Sarah Chen', email: 'sarah.chen@clinic.com', phone: '+1 555-8234', role: 'doctor', specialization: 'Cardiology', status: 'active', createdAt: '2024-12-01' },
                { id: 'U1004', name: 'Dr. James Wilson', email: 'james.wilson@clinic.com', phone: '+1 555-9845', role: 'doctor', specialization: 'Neurology', status: 'active', createdAt: '2024-11-20' },
                { id: 'U1005', name: 'Emily Davis', email: 'emily.d@example.com', phone: '+1 555-1122', role: 'patient', status: 'active', createdAt: '2025-02-05' },
                { id: 'U1006', name: 'Dr. Lisa Ray', email: 'lisa.ray@clinic.com', phone: '+1 555-7766', role: 'doctor', specialization: 'Dermatology', status: 'active', createdAt: '2025-01-22' }
            ]));
        }
        if (!localStorage.getItem('appointments')) {
            localStorage.setItem('appointments', JSON.stringify([
                { id: 'A101', patient: 'John Doe', doctor: 'Dr. Sarah Chen', date: '2025-03-20', time: '10:30', status: 'confirmed' },
                { id: 'A102', patient: 'Jane Smith', doctor: 'Dr. James Wilson', date: '2025-03-21', time: '14:00', status: 'pending' },
                { id: 'A103', patient: 'Emily Davis', doctor: 'Dr. Lisa Ray', date: '2025-03-22', time: '09:15', status: 'confirmed' },
                { id: 'A104', patient: 'Robert Brown', doctor: 'Dr. Sarah Chen', date: '2025-03-23', time: '11:45', status: 'confirmed' }
            ]));
        }
        if (!localStorage.getItem('departments')) {
            localStorage.setItem('departments', JSON.stringify([
                { id: 'D1', name: 'Cardiology', head: 'Dr. Sarah Chen', staffCount: 8 },
                { id: 'D2', name: 'Neurology', head: 'Dr. James Wilson', staffCount: 5 },
                { id: 'D3', name: 'Dermatology', head: 'Dr. Lisa Ray', staffCount: 4 },
                { id: 'D4', name: 'Pediatrics', head: 'Dr. Michael Brown', staffCount: 6 }
            ]));
        }
        if (!localStorage.getItem('auditLog')) {
            localStorage.setItem('auditLog', JSON.stringify([
                { user: 'admin', action: 'Login', timestamp: new Date().toLocaleString() },
                { user: 'admin', action: 'Viewed reports', timestamp: new Date(Date.now()-3600000).toLocaleString() }
            ]));
        }

        function renderProfile() {
            const u = currentUser;
            document.getElementById('profileCard').innerHTML = `
                <div class="profile-name"><i class="fas fa-user-shield"></i> ${u.name}</div>
                <div class="profile-detail"><i class="fas fa-envelope"></i> <span>${u.email}</span></div>
                <div class="profile-detail"><i class="fas fa-phone-alt"></i> <span>${u.phone || '—'}</span></div>
                <div><span class="role-tag"><i class="fas fa-crown"></i> Admin</span></div>
            `;
        }
        renderProfile();

        function tick() {
            const d = new Date();
            document.getElementById('liveTime').innerText = d.toLocaleString('en-US', { weekday:'short', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit', second:'2-digit' });
        }
        tick(); setInterval(tick, 1000);

        function openModal(html) {
            document.getElementById('modalRoot').style.display = 'flex';
            document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal-window" onclick="event.stopPropagation()">${html}</div></div>`;
        }
        window.closeModal = function() { document.getElementById('modalRoot').style.display = 'none'; };

        const navItems = document.querySelectorAll('.nav-item');
        navItems.forEach(item => {
            item.addEventListener('click', () => {
                navItems.forEach(n => n.classList.remove('active'));
                item.classList.add('active');
                const page = item.dataset.page;
                loadPage(page);
                document.getElementById('headerTitle').innerText = item.querySelector('span').innerText;
            });
        });

        window.loadPage = function(page) {
            const container = document.getElementById('contentArea');
            if (page === 'dashboard') renderDashboard(container);
            else if (page === 'users') renderUsers(container);
            else if (page === 'doctors') renderDoctors(container);
            else if (page === 'appointments') renderAppointments(container);
            else if (page === 'departments') renderDepartments(container);
            else if (page === 'reports') renderReports(container);
            else if (page === 'audit') renderAudit(container);
            else if (page === 'settings') renderSettings(container);
        };

        function renderDashboard(container) {
            const users = JSON.parse(localStorage.getItem('users')) || [];
            const apps = JSON.parse(localStorage.getItem('appointments')) || [];
            const totalUsers = users.length;
            const totalDocs = users.filter(u => u.role === 'doctor').length;
            const totalPats = users.filter(u => u.role === 'patient').length;
            container.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h4>Total users</h4><div class="figure">${totalUsers}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-user-md"></i></div><div class="stat-info"><h4>Doctors</h4><div class="figure">${totalDocs}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-heartbeat"></i></div><div class="stat-info"><h4>Patients</h4><div class="figure">${totalPats}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-calendar-alt"></i></div><div class="stat-info"><h4>Appointments</h4><div class="figure">${apps.length}</div></div></div>
                </div>
                <div class="content-card">
                    <div class="card-header"><h3>Recent activity</h3><button class="btn-primary" onclick="loadPage('users')"><i class="fas fa-arrow-right"></i> Manage</button></div>
                    <table><thead><tr><th>User</th><th>Action</th><th>Timestamp</th></tr></thead>
                    <tbody><tr><td>Dr. Adams</td><td>Updated user directory</td><td>${new Date().toLocaleTimeString()}</td></tr>
                    <tr><td>System</td><td>Appointment sync</td><td>${new Date(Date.now()-1800000).toLocaleTimeString()}</td></tr></tbody></table>
                </div>
                <div class="content-card"><div class="card-header"><h3>Weekly consultations</h3></div><div class="chart-box"><canvas id="dashChart"></canvas></div></div>
            `;
            setTimeout(() => {
                const ctx = document.getElementById('dashChart')?.getContext('2d');
                if (ctx) new Chart(ctx, { type:'line', data: { labels: ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'], datasets: [{ label:'Appointments', data:[5,8,12,10,15,11,7], borderColor:'#2563eb', tension:0.3, fill:true, backgroundColor:'#2563eb15' }] }, options: { responsive:true, maintainAspectRatio:false } });
            }, 50);
        }

        function renderUsers(container) {
            const users = JSON.parse(localStorage.getItem('users'));
            container.innerHTML = `<div class="content-card"><div class="card-header"><h3>User management</h3><button class="btn-primary" onclick="addUserModal()"><i class="fas fa-plus"></i> New user</button></div>
            <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead>
            <tbody>${users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td><span class="status-badge badge-role">${u.role}</span></td><td><span class="status-badge ${u.status==='active'?'badge-active':'badge-pending'}">${u.status}</span></td>
            <td><button class="icon-action" onclick="editUser('${u.id}')"><i class="fas fa-edit"></i></button><button class="icon-action delete" onclick="deleteUser('${u.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')}</tbody></table></div>`;
        }

        window.addUserModal = function() {
            openModal(`<h2>Add user</h2><div class="form-field"><label>Full name</label><input class="form-input" id="modalName" placeholder="Alex Johnson"></div>
            <div class="form-field"><label>Email</label><input class="form-input" id="modalEmail" type="email"></div><div class="row-fields"><div class="form-field"><label>Role</label><select class="form-input" id="modalRole"><option value="patient">Patient</option><option value="doctor">Doctor</option></select></div>
            <div class="form-field"><label>Phone</label><input class="form-input" id="modalPhone"></div></div><div class="modal-actions"><button class="btn-primary" onclick="saveNewUser()">Create</button><button class="btn-outline" onclick="closeModal()">Cancel</button></div>`);
        };
        window.saveNewUser = function() {
            const users = JSON.parse(localStorage.getItem('users'));
            users.push({ id: 'U'+Date.now(), name: document.getElementById('modalName')?.value || 'Guest', email: document.getElementById('modalEmail')?.value, phone: document.getElementById('modalPhone')?.value, role: document.getElementById('modalRole')?.value, status: 'active', createdAt: new Date().toISOString().slice(0,10) });
            localStorage.setItem('users', JSON.stringify(users));
            closeModal(); showToast('User added', 'success'); loadPage('users');
        };
        window.editUser = (id) => { /* edit simplified */ let u = JSON.parse(localStorage.getItem('users')).find(x=>x.id===id); if(u) openModal(`<h2>Edit</h2><div class="form-field"><label>Name</label><input id="editName" class="form-input" value="${u.name}"></div><div class="modal-actions"><button class="btn-primary" onclick="updateUserSimple('${id}')">Save</button><button class="btn-outline" onclick="closeModal()">Cancel</button></div>`); };
        window.updateUserSimple = (id) => { let users=JSON.parse(localStorage.getItem('users')); let u=users.find(x=>x.id===id); if(u) u.name=document.getElementById('editName')?.value||u.name; localStorage.setItem('users',JSON.stringify(users)); closeModal(); showToast('Updated','success'); loadPage('users'); };
        window.deleteUser = (id) => { if(confirm('Delete user?')){ let users=JSON.parse(localStorage.getItem('users')).filter(u=>u.id!==id); localStorage.setItem('users',JSON.stringify(users)); showToast('Deleted','warning'); loadPage('users'); } };
        
        function renderDoctors(container) { const docs = JSON.parse(localStorage.getItem('users')).filter(u=>u.role==='doctor'); container.innerHTML=`<div class="content-card"><h3>Doctors</h3><table><thead><tr><th>Name</th><th>Specialization</th><th>Email</th></tr></thead><tbody>${docs.map(d=>`<tr><td>${d.name}</td><td>${d.specialization||'General'}</td><td>${d.email}</td></tr>`).join('')}</tbody></table></div>`; }
        function renderAppointments(container) { const apps = JSON.parse(localStorage.getItem('appointments')); container.innerHTML=`<div class="content-card"><h3>Appointments</h3><table><thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th></tr></thead><tbody>${apps.map(a=>`<tr><td>${a.patient}</td><td>${a.doctor}</td><td>${a.date}</td><td>${a.time}</td><td><span class="status-badge ${a.status==='confirmed'?'badge-active':'badge-pending'}">${a.status}</span></td></tr>`).join('')}</tbody></table></div>`; }
        function renderDepartments(container) { const depts=JSON.parse(localStorage.getItem('departments')); container.innerHTML=`<div class="content-card"><h3>Departments</h3><table><thead><tr><th>Name</th><th>Head</th><th>Staff</th></thead><tbody>${depts.map(d=>`<tr><td>${d.name}</td><td>${d.head}</td><td>${d.staffCount}</td></tr>`).join('')}</tbody></table></div>`; }
        function renderReports(container) { container.innerHTML=`<div class="content-card"><h3>Performance metrics</h3><div class="chart-box"><canvas id="reportChart"></canvas></div></div>`; setTimeout(()=>{ const ctx=document.getElementById('reportChart')?.getContext('2d'); if(ctx) new Chart(ctx,{type:'bar',data:{labels:['Jan','Feb','Mar','Apr','May'],datasets:[{label:'Consultations',data:[32,41,58,62,78],backgroundColor:'#3b82f6'}]}}); },50); }
        function renderAudit(container) { const log=JSON.parse(localStorage.getItem('auditLog')); container.innerHTML=`<div class="content-card"><h3>Audit log</h3> <table><thead><tr><th>User</th><th>Action</th><th>Timestamp</th></tr></thead><tbody>${log.map(l=>`<tr><td>${l.user}</td><td>${l.action}</td><td>${l.timestamp}</td></tr>`).join('')}</tbody></table></div>`; }
        function renderSettings(container) { container.innerHTML=`<div class="content-card"><h3>System preferences</h3><div class="form-field"><label>Organization name</label><input class="form-input" id="clinicName" value="ClinicCare Pro Center"></div><button class="btn-primary" onclick="showToast('Preferences saved','success')">Save settings</button></div>`; }

        document.getElementById('logoutBtn').addEventListener('click', () => { showToast('Logging out...','info'); setTimeout(()=>{ localStorage.removeItem('currentUser'); window.location.href='index.html'; }, 1000); });
        loadPage('dashboard');
    })();
</script>
</body>
</html>
