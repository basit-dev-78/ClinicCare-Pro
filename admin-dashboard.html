<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicCare Pro | Admin Dashboard (fully enabled)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #f2f7fc; color: #1b2f44; }
        .dashboard { display: flex; min-height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 290px; background: white; box-shadow: 6px 0 24px rgba(26,54,93,0.04);
            display: flex; flex-direction: column; position: fixed; height: 100vh;
            border-right: 1px solid #dde9f5;
        }
        .sidebar-header { padding: 28px 24px 20px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #dde9f5; }
        .sidebar-header i { font-size: 2.2rem; color: #2563eb; background: #e1ebff; padding: 8px; border-radius: 18px; }
        .sidebar-header h3 { font-weight: 700; font-size: 1.4rem; letter-spacing: -0.4px; color: #0f2b42; }
        .user-info { padding: 22px 24px; background: #f6fbff; border-bottom: 1px solid #dde9f5; }
        .user-info h4 { font-weight: 600; font-size: 1.1rem; color: #0f2b42; margin-bottom: 6px; }
        .user-info p { font-size: 0.9rem; color: #3a627f; display: flex; align-items: center; gap: 8px; margin: 5px 0; }
        .user-info i { width: 20px; color: #5a85a5; }
        .user-role-badge { display: inline-block; padding: 4px 16px; background: #2563eb; color: white; border-radius: 40px; font-size: 0.7rem; font-weight: 600; margin-top: 8px; }

        .sidebar-nav { flex: 1; padding: 28px 0 12px; overflow-y: auto; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav li { padding: 12px 24px; margin: 4px 12px; border-radius: 14px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 16px; color: #2b4b68; font-weight: 500; font-size: 0.95rem; }
        .sidebar-nav li i { width: 22px; font-size: 1.2rem; color: #5a85a5; }
        .sidebar-nav li:hover { background: #ecf3fd; color: #0f2b42; }
        .sidebar-nav li.active { background: #2563eb; color: white; }
        .sidebar-nav li.active i { color: white; }
        .btn-logout { margin: 16px 20px 28px; padding: 14px; background: #f1f7fd; color: #2b4b68; border: 1px solid #cde0f0; border-radius: 18px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .btn-logout:hover { background: #fee7e7; color: #b91c1c; border-color: #fbc5c5; }

        /* ===== MAIN ===== */
        .main-content { flex: 1; margin-left: 290px; padding: 30px 38px; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; background: white; padding: 18px 32px; border-radius: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.02); border: 1px solid #dde9f5; }
        .dashboard-header h2 { font-weight: 700; font-size: 1.8rem; color: #0f2b42; letter-spacing: -0.4px; }
        .header-actions span { background: #ebf3fe; padding: 8px 22px; border-radius: 40px; font-size: 0.9rem; color: #2563eb; font-weight: 500; }

        .dashboard-content { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .stat-card, .table-container, .chart-card, .settings-card {
            grid-column: span 4; background: white; border-radius: 32px; padding: 26px 32px; border: 1px solid #dde9f5; box-shadow: 0 10px 28px rgba(0,0,0,0.02);
        }
        .stats-grid { grid-column: span 4; display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
        .stat-item { background: white; border-radius: 28px; padding: 24px; display: flex; align-items: center; gap: 18px; border: 1px solid #dde9f5; }
        .stat-icon { width: 56px; height: 56px; background: #e1ebff; border-radius: 20px; display: flex; align-items: center; justify-content: center; color: #2563eb; font-size: 1.8rem; }
        .stat-info h4 { font-weight: 500; color: #5a85a5; font-size: 0.9rem; margin-bottom: 6px; }
        .stat-info p { font-weight: 700; font-size: 2rem; color: #0f2b42; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 16px 8px; font-weight: 600; font-size: 0.8rem; color: #5a85a5; text-transform: uppercase; border-bottom: 1px solid #dde9f5; }
        td { padding: 16px 8px; border-bottom: 1px solid #edf5fd; color: #1f3b54; }
        .badge { padding: 6px 16px; border-radius: 40px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .badge-success { background: #dcfce7; color: #166534; }
        .badge-warning { background: #fef9c3; color: #854d0e; }
        .badge-info { background: #dbeafe; color: #1e40af; }
        .badge-primary { background: #e0f2fe; color: #0369a1; }

        .action-btn { background: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 40px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(37,99,235,0.2); }
        .action-btn:hover { background: #1d4ed8; }
        .action-outline { background: white; color: #2563eb; border: 1px solid #b8d1f5; box-shadow: none; }
        .action-outline:hover { background: #eef4ff; }
        .action-icon { background: none; border: none; color: #5a85a5; cursor: pointer; font-size: 1.1rem; margin: 0 6px; }
        .action-icon:hover { color: #2563eb; }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal-card { background: white; border-radius: 40px; padding: 32px; max-width: 600px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .modal-card h3 { margin-bottom: 24px; color: #0f2b42; }
        .form-group { margin-bottom: 20px; }
        .form-group label { font-weight: 600; display: block; margin-bottom: 6px; color: #2b4b68; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px 18px; border-radius: 30px; border: 1px solid #cde0f0; font-family: 'Inter', sans-serif; }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        .form-actions { display: flex; gap: 16px; justify-content: flex-end; margin-top: 28px; }

        .settings-group { margin-bottom: 32px; }
        .settings-group h4 { font-size: 1.1rem; color: #0f2b42; margin-bottom: 16px; border-bottom: 1px solid #e2edf9; padding-bottom: 8px; }
        .toggle-switch { display: inline-block; width: 44px; height: 24px; background: #cbd5e1; border-radius: 40px; position: relative; cursor: pointer; }
        .toggle-switch.active { background: #2563eb; }
        .toggle-switch::after { content: ''; width: 20px; height: 20px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.1s; }
        .toggle-switch.active::after { left: 22px; }
    </style>
</head>
<body>
<div class="dashboard">
    <div class="sidebar">
        <div class="sidebar-header"><i class="fas fa-clinic-medical"></i><h3>ClinicCare Pro</h3></div>
        <div class="user-info" id="userInfo"></div>
        <nav class="sidebar-nav"><ul id="sidebarNavList">
            <li id="nav-dashboard" class="active" onclick="loadContent('dashboard')"><i class="fas fa-chart-line"></i><span>Dashboard</span></li>
            <li id="nav-users" onclick="loadContent('users')"><i class="fas fa-users"></i><span>Manage Users</span></li>
            <li id="nav-doctors" onclick="loadContent('doctors')"><i class="fas fa-user-md"></i><span>Manage Doctors</span></li>
            <li id="nav-appointments" onclick="loadContent('appointments')"><i class="fas fa-calendar-alt"></i><span>Appointments</span></li>
            <li id="nav-reports" onclick="loadContent('reports')"><i class="fas fa-chart-pie"></i><span>Reports</span></li>
            <li id="nav-settings" onclick="loadContent('settings')"><i class="fas fa-cog"></i><span>Settings</span></li>
            <li id="nav-audit" onclick="loadContent('audit')"><i class="fas fa-history"></i><span>Audit Log</span></li>
            <li id="nav-departments" onclick="loadContent('departments')"><i class="fas fa-building"></i><span>Departments</span></li>
        </ul></nav>
        <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
    </div>

    <div class="main-content">
        <div class="dashboard-header">
            <h2 id="dashboardTitle">Admin Dashboard</h2>
            <div class="header-actions"><span id="currentDate"></span></div>
        </div>
        <div class="dashboard-content" id="dashboardContent"></div>
    </div>
</div>

<!-- Modal container -->
<div id="modalContainer" style="display:none;"></div>

<script>
    (function() {
        // ---------- AUTH & INIT ----------
        const defaultAdmin = {
            id: 'A1001',
            name: 'Dr. Michael Adams',
            email: 'michael.adams@cliniccare.com',
            phone: '+1 (415) 555-8901',
            role: 'admin',
            department: 'Administration'
        };
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser || currentUser.role !== 'admin') {
            localStorage.setItem('currentUser', JSON.stringify(defaultAdmin));
            currentUser = defaultAdmin;
        }

        // ---------- INITIAL DATA (if not exists) ----------
        if (!localStorage.getItem('users')) {
            const initialUsers = [
                { id: 'U1001', name: 'John Doe', email: 'john.d@example.com', phone: '+1 555-2301', role: 'patient', status: 'active', createdAt: '2025-01-10' },
                { id: 'U1002', name: 'Jane Smith', email: 'jane.s@example.com', phone: '+1 555-6712', role: 'patient', status: 'active', createdAt: '2025-01-15' },
                { id: 'U1003', name: 'Dr. Sarah Chen', email: 'sarah.chen@clinic.com', phone: '+1 555-8234', role: 'doctor', specialization: 'Cardiology', status: 'active', createdAt: '2024-12-01' },
                { id: 'U1004', name: 'Dr. James Wilson', email: 'james.wilson@clinic.com', phone: '+1 555-9845', role: 'doctor', specialization: 'Neurology', status: 'active', createdAt: '2024-11-20' },
                { id: 'U1005', name: 'Emily Davis', email: 'emily.d@example.com', phone: '+1 555-1122', role: 'patient', status: 'active', createdAt: '2025-02-05' },
                { id: 'U1006', name: 'Dr. Lisa Ray', email: 'lisa.ray@clinic.com', phone: '+1 555-7766', role: 'doctor', specialization: 'Dermatology', status: 'active', createdAt: '2025-01-22' }
            ];
            localStorage.setItem('users', JSON.stringify(initialUsers));
        }

        if (!localStorage.getItem('appointments')) {
            const initialApps = [
                { id: 'A101', patient: 'John Doe', doctor: 'Dr. Sarah Chen', date: '2025-03-20', time: '10:30', status: 'confirmed' },
                { id: 'A102', patient: 'Jane Smith', doctor: 'Dr. James Wilson', date: '2025-03-21', time: '14:00', status: 'pending' },
                { id: 'A103', patient: 'Emily Davis', doctor: 'Dr. Lisa Ray', date: '2025-03-22', time: '09:15', status: 'confirmed' }
            ];
            localStorage.setItem('appointments', JSON.stringify(initialApps));
        }

        if (!localStorage.getItem('departments')) {
            localStorage.setItem('departments', JSON.stringify([
                { id: 'D1', name: 'Cardiology', head: 'Dr. Sarah Chen', staffCount: 8 },
                { id: 'D2', name: 'Neurology', head: 'Dr. James Wilson', staffCount: 5 },
                { id: 'D3', name: 'Dermatology', head: 'Dr. Lisa Ray', staffCount: 4 },
                { id: 'D4', name: 'Pediatrics', head: 'Dr. Michael Brown', staffCount: 6 }
            ]));
        }

        if (!localStorage.getItem('auditLog')) {
            localStorage.setItem('auditLog', JSON.stringify([
                { user: 'admin', action: 'Login', timestamp: '2025-03-19 08:23' },
                { user: 'admin', action: 'Updated user U1003', timestamp: '2025-03-18 14:12' }
            ]));
        }

        // ---------- RENDER USER INFO ----------
        function renderUserInfo() {
            const u = currentUser;
            document.getElementById('userInfo').innerHTML = `
                <h4>${u.name}</h4>
                <p><i class="fas fa-envelope"></i> ${u.email}</p>
                <p><i class="fas fa-phone-alt"></i> ${u.phone || '—'}</p>
                <p><span class="user-role-badge">Admin</span> <span style="margin-left:6px;background:#e2eaf1;padding:3px 10px;border-radius:40px;font-size:0.7rem;">ID: ${u.id}</span></p>
            `;
        }
        renderUserInfo();

        function updateDate() { const d = new Date(); document.getElementById('currentDate').innerHTML = d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }); }
        updateDate();

        // ---------- MODAL SYSTEM ----------
        function showModal(contentHtml) {
            const modal = document.getElementById('modalContainer');
            modal.style.display = 'flex';
            modal.innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal-card" onclick="event.stopPropagation()">${contentHtml}</div></div>`;
        }
        window.closeModal = function() { document.getElementById('modalContainer').style.display = 'none'; };

        // ---------- CRUD OPERATIONS ----------
        window.addUser = function() {
            showModal(`
                <h3>Add New User</h3>
                <div class="form-group"><label>Name</label><input id="userName" placeholder="Full name"></div>
                <div class="form-group"><label>Email</label><input id="userEmail" type="email" placeholder="email@example.com"></div>
                <div class="form-group"><label>Phone</label><input id="userPhone" placeholder="+1 555-..."></div>
                <div class="form-group"><label>Role</label><select id="userRole"><option value="patient">Patient</option><option value="doctor">Doctor</option><option value="admin">Admin</option></select></div>
                <div class="form-group"><label>Specialization (if doctor)</label><input id="userSpec" placeholder="e.g. Cardiology"></div>
                <div class="form-actions">
                    <button class="action-btn" onclick="saveNewUser()">Create</button>
                    <button class="action-outline action-btn" onclick="closeModal()">Cancel</button>
                </div>
            `);
        };
        window.saveNewUser = function() {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            const newUser = {
                id: 'U' + Math.floor(Math.random()*9000 + 1000),
                name: document.getElementById('userName')?.value || 'New User',
                email: document.getElementById('userEmail')?.value || 'noemail@example.com',
                phone: document.getElementById('userPhone')?.value || '',
                role: document.getElementById('userRole')?.value || 'patient',
                specialization: document.getElementById('userSpec')?.value || '',
                status: 'active',
                createdAt: new Date().toISOString().slice(0,10)
            };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            closeModal();
            loadContent('users');
        };

        window.editUser = function(userId) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            let user = users.find(u => u.id === userId);
            if (!user) return;
            showModal(`
                <h3>Edit User</h3>
                <div class="form-group"><label>Name</label><input id="editName" value="${user.name}"></div>
                <div class="form-group"><label>Email</label><input id="editEmail" value="${user.email}"></div>
                <div class="form-group"><label>Phone</label><input id="editPhone" value="${user.phone || ''}"></div>
                <div class="form-group"><label>Role</label><select id="editRole"><option value="patient" ${user.role==='patient'?'selected':''}>Patient</option><option value="doctor" ${user.role==='doctor'?'selected':''}>Doctor</option><option value="admin" ${user.role==='admin'?'selected':''}>Admin</option></select></div>
                <div class="form-group"><label>Specialization</label><input id="editSpec" value="${user.specialization || ''}"></div>
                <div class="form-group"><label>Status</label><select id="editStatus"><option value="active" ${user.status==='active'?'selected':''}>Active</option><option value="inactive" ${user.status==='inactive'?'selected':''}>Inactive</option></select></div>
                <div class="form-actions">
                    <button class="action-btn" onclick="updateUser('${userId}')">Update</button>
                    <button class="action-outline action-btn" onclick="closeModal()">Cancel</button>
                </div>
            `);
        };
        window.updateUser = function(userId) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            let user = users.find(u => u.id === userId);
            if (user) {
                user.name = document.getElementById('editName')?.value || user.name;
                user.email = document.getElementById('editEmail')?.value || user.email;
                user.phone = document.getElementById('editPhone')?.value || user.phone;
                user.role = document.getElementById('editRole')?.value || user.role;
                user.specialization = document.getElementById('editSpec')?.value;
                user.status = document.getElementById('editStatus')?.value || 'active';
            }
            localStorage.setItem('users', JSON.stringify(users));
            closeModal();
            loadContent('users');
        };

        window.deleteUser = function(userId) {
            if (confirm('Permanently delete this user?')) {
                let users = JSON.parse(localStorage.getItem('users')) || [];
                users = users.filter(u => u.id !== userId);
                localStorage.setItem('users', JSON.stringify(users));
                loadContent('users');
            }
        };

        window.viewAppointment = function(appId) {
            let apps = JSON.parse(localStorage.getItem('appointments')) || [];
            let app = apps.find(a => a.id === appId);
            if (!app) return;
            showModal(`
                <h3>Appointment details</h3>
                <div class="form-group"><label>Patient</label><input value="${app.patient}" readonly></div>
                <div class="form-group"><label>Doctor</label><input value="${app.doctor}" readonly></div>
                <div class="form-group"><label>Date/Time</label><input value="${app.date} ${app.time}" readonly></div>
                <div class="form-group"><label>Status</label><input value="${app.status}" readonly></div>
                <div class="form-actions"><button class="action-btn" onclick="closeModal()">Close</button></div>
            `);
        };

        // ---------- RENDER FUNCTIONS ----------
        window.loadContent = function(section, event) {
            if (event) { document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active')); event.currentTarget.classList.add('active'); }
            else { let activeId = 'nav-' + section; document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active')); let el = document.getElementById(activeId); if (el) el.classList.add('active'); }
            const title = document.getElementById('dashboardTitle');
            const container = document.getElementById('dashboardContent');
            if (section === 'dashboard') { title.innerText = 'Dashboard'; renderDashboard(container); }
            else if (section === 'users') { title.innerText = 'Manage Users'; renderUsers(container); }
            else if (section === 'doctors') { title.innerText = 'Manage Doctors'; renderDoctors(container); }
            else if (section === 'appointments') { title.innerText = 'All Appointments'; renderAppointments(container); }
            else if (section === 'reports') { title.innerText = 'Reports & Analytics'; renderReports(container); }
            else if (section === 'settings') { title.innerText = 'System Settings'; renderSettings(container); }
            else if (section === 'audit') { title.innerText = 'Audit Log'; renderAudit(container); }
            else if (section === 'departments') { title.innerText = 'Departments'; renderDepartments(container); }
        };

        function renderDashboard(c) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            let apps = JSON.parse(localStorage.getItem('appointments')) || [];
            let totalUsers = users.length;
            let totalDoctors = users.filter(u => u.role === 'doctor').length;
            let totalPatients = users.filter(u => u.role === 'patient').length;
            let totalApps = apps.length;
            let revenue = 45250; // mock
            c.innerHTML = `
                <div class="stats-grid">
                    <div class="stat-item"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h4>Total Users</h4><p>${totalUsers}</p></div></div>
                    <div class="stat-item"><div class="stat-icon"><i class="fas fa-user-md"></i></div><div class="stat-info"><h4>Doctors</h4><p>${totalDoctors}</p></div></div>
                    <div class="stat-item"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-info"><h4>Appointments</h4><p>${totalApps}</p></div></div>
                    <div class="stat-item"><div class="stat-icon"><i class="fas fa-dollar-sign"></i></div><div class="stat-info"><h4>Revenue</h4><p>$${revenue}</p></div></div>
                </div>
                <div class="table-container">
                    <h3>Recent Users</h3>
                    <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>
                        ${users.slice(0,5).map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td><span class="badge badge-primary">${u.role}</span></td><td><span class="badge badge-success">${u.status}</span></td></tr>`).join('')}
                    </tbody></table>
                </div>
            `;
        }

        function renderUsers(c) {
            let users = JSON.parse(localStorage.getItem('users')) || [];
            c.innerHTML = `
                <div class="table-container">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h3>All Users</h3>
                        <button class="action-btn" onclick="addUser()"><i class="fas fa-plus"></i> Add User</button>
                    </div>
                    <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>
                        ${users.map(u => `<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone || '—'}</td><td><span class="badge badge-primary">${u.role}</span></td><td><span class="badge ${u.status==='active'?'badge-success':'badge-warning'}">${u.status}</span></td><td><button class="action-icon" onclick="editUser('${u.id}')"><i class="fas fa-edit"></i></button> <button class="action-icon" onclick="deleteUser('${u.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('')}
                    </tbody></table>
                </div>
            `;
        }

        function renderDoctors(c) {
            let doctors = JSON.parse(localStorage.getItem('users'))?.filter(u => u.role === 'doctor') || [];
            c.innerHTML = `
                <div class="table-container">
                    <h3>Doctors</h3>
                    <table><thead><tr><th>Name</th><th>Specialization</th><th>Email</th><th>Phone</th><th>Status</th><th></th></tr></thead><tbody>
                        ${doctors.map(d => `<tr><td>${d.name}</td><td>${d.specialization || '—'}</td><td>${d.email}</td><td>${d.phone}</td><td><span class="badge badge-success">${d.status}</span></td><td><button class="action-btn action-small" onclick="editUser('${d.id}')">edit</button></td></tr>`).join('')}
                    </tbody></table>
                </div>
            `;
        }

        function renderAppointments(c) {
            let apps = JSON.parse(localStorage.getItem('appointments')) || [];
            c.innerHTML = `
                <div class="table-container">
                    <h3>All Appointments</h3>
                    <table><thead><tr><th>Patient</th><th>Doctor</th><th>Date</th><th>Time</th><th>Status</th><th></th></tr></thead><tbody>
                        ${apps.map(a => `<tr><td>${a.patient}</td><td>${a.doctor}</td><td>${a.date}</td><td>${a.time}</td><td><span class="badge ${a.status==='confirmed'?'badge-success':'badge-warning'}">${a.status}</span></td><td><button class="action-btn action-small" onclick="viewAppointment('${a.id}')">view</button></td></tr>`).join('')}
                    </tbody></table>
                </div>
            `;
        }

        function renderReports(c) {
            c.innerHTML = `
                <div class="chart-card">
                    <h3>Monthly revenue & appointments</h3>
                    <div style="height:200px; background:#f1f9ff; border-radius:40px; display:flex; align-items:center; justify-content:center; color:#2563eb;">📊 Chart: revenue + appointments (demo)</div>
                    <div style="display:flex; gap:40px; margin-top:30px;">
                        <div><strong>Total appointments</strong> 342</div>
                        <div><strong>New patients</strong> 78</div>
                        <div><strong>Avg. wait time</strong> 4.2 days</div>
                    </div>
                </div>
            `;
        }

        function renderSettings(c) {
            c.innerHTML = `
                <div class="settings-card">
                    <h3>System Preferences</h3>
                    <div class="settings-group">
                        <h4>General</h4>
                        <div class="form-row"><div class="form-group"><label>Clinic name</label><input value="ClinicCare Pro Medical Center"></div><div class="form-group"><label>Timezone</label><select><option>America/Los_Angeles</option></select></div></div>
                    </div>
                    <div class="settings-group">
                        <h4>Notifications</h4>
                        <div><span>Email alerts for new users </span><span class="toggle-switch active" onclick="this.classList.toggle('active')"></span></div>
                    </div>
                    <button class="action-btn">Save settings</button>
                </div>
            `;
        }

        function renderAudit(c) {
            let log = JSON.parse(localStorage.getItem('auditLog')) || [];
            c.innerHTML = `<div class="table-container"><h3>Audit log</h3><table><thead><tr><th>User</th><th>Action</th><th>Timestamp</th></tr></thead><tbody>${
                log.map(l => `<tr><td>${l.user}</td><td>${l.action}</td><td>${l.timestamp}</td></tr>`).join('')
            }</tbody></table></div>`;
        }

        function renderDepartments(c) {
            let depts = JSON.parse(localStorage.getItem('departments')) || [];
            c.innerHTML = `<div class="table-container"><h3>Departments</h3><table><thead><tr><th>Name</th><th>Head</th><th>Staff count</th></tr></thead><tbody>${
                depts.map(d => `<tr><td>${d.name}</td><td>${d.head}</td><td>${d.staffCount}</td></tr>`).join('')
            }</tbody></table></div>`;
        }

        window.logout = function() { localStorage.removeItem('currentUser'); alert('Logged out.'); window.location.reload(); };
        window.loadContent('dashboard');
    })();
</script>
</body>
</html>
