<script>
    (function () {
        // Mobile Sidebar Controls
        const menuToggle = document.getElementById('menuToggleBtn');
        const mobileSidebar = document.getElementById('mobileSidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        function openSidebar() {
            if (mobileSidebar && sidebarOverlay) {
                mobileSidebar.classList.add('active');
                sidebarOverlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }
        }

        function closeSidebar() {
            if (mobileSidebar && sidebarOverlay) {
                mobileSidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        if (menuToggle) {
            menuToggle.addEventListener('click', function (e) {
                e.stopPropagation();
                openSidebar();
            });
        }
        if (closeSidebarBtn) {
            closeSidebarBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closeSidebar();
            });
        }
        if (sidebarOverlay) {
            sidebarOverlay.addEventListener('click', function (e) {
                e.stopPropagation();
                closeSidebar();
            });
        }

        // Close sidebar and smooth scroll when clicking sidebar nav links
        document.querySelectorAll('.sidebar-link, .mobile-sidebar .logo').forEach(link => {
            link.addEventListener('click', function (e) {
                const targetId = this.getAttribute('href');
                if (targetId && targetId.startsWith('#')) {
                    e.preventDefault();
                    const targetElement = document.querySelector(targetId);
                    closeSidebar();
                    if (targetElement) {
                        setTimeout(() => {
                            targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        }, 250);
                    }
                }
            });
        });

        // Desktop nav smooth scroll
        document.querySelectorAll('.nav-links-desktop a, .navbar .logo').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const hash = this.getAttribute('href');
                if (hash && hash.startsWith('#')) {
                    e.preventDefault();
                    const target = document.querySelector(hash);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            });
        });
    })();
</script>
