<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicCare Pro - Header Component</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body
    style="font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; padding: 0; background: #ffffff; min-height: 100vh;">
    <style>
        /* Navigation - Desktop & Mobile */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 80px;
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }

        .navbar.scrolled {
            padding: 0.75rem 5%;
            background: rgba(255, 255, 255, 0.98);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.3rem;
            font-weight: 800;
            color: #1a1f2b;
            text-decoration: none;
            flex-shrink: 0;
        }

        @media (min-width: 768px) {
            .logo {
                font-size: 1.5rem;
            }
        }

        .logo-img {
            height: 60px;
            width: auto;
            object-fit: contain;
        }



        /* Desktop Navigation Links - Centered with flex and margin auto */
        .nav-links-desktop {
            display: flex;
            gap: 2rem;
            align-items: center;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }

        .nav-links-desktop a {
            text-decoration: none;
            color: #1a1f2b;
            font-weight: 600;
            position: relative;
            padding: 0.5rem 0;
            transition: color 0.3s;
            font-size: 0.95rem;
            white-space: nowrap;
        }

        .nav-links-desktop a::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, #4158D0, #C850C0);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .nav-links-desktop a:hover {
            color: #4158D0;
        }

        .nav-links-desktop a:hover::before {
            transform: scaleX(1);
        }

        /* Desktop Auth Buttons - positioned on the right */
        .nav-buttons {
            display: flex;
            gap: 0.8rem;
            flex-shrink: 0;
            margin-left: auto;
        }

        .btn-login,
        .btn-signup {
            padding: 0.6rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            white-space: nowrap;
        }

        .btn-login {
            border: 2px solid #e2e8f0;
            background: transparent;
            color: #1a1f2b;
        }

        .btn-login:hover {
            background: linear-gradient(90deg, #4158D0, #C850C0);
            color: white;
            border-color: transparent;
        }

        .btn-signup {
            border: none;
            background: linear-gradient(90deg, #4158D0, #C850C0);
            color: white;
        }

        .btn-signup:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(65, 88, 208, 0.3);
        }

        /* Mobile Toggle Button - visible only on mobile */
        .menu-toggle {
            display: none;
            background: linear-gradient(135deg, #4158D0, #C850C0);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            z-index: 1002;
        }

        .menu-toggle:active {
            transform: scale(0.95);
        }

        /* Mobile Sidebar - slides from left - IMPROVED: Auth buttons at TOP immediately visible */
        .mobile-sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            width: 85%;
            max-width: 320px;
            height: 100vh;
            background: linear-gradient(180deg, #ffffff 0%, #fef9ff 100%);
            box-shadow: 5px 0 30px rgba(0, 0, 0, 0.2);
            z-index: 1003;
            transition: left 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .mobile-sidebar.active {
            left: 0;
        }

        /* Sidebar Header - keep compact but clean */
        .sidebar-header {
            padding: 1.5rem 1.5rem 0.8rem 1.5rem;
            border-bottom: 1px solid #eef2ff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #1a1f2b;
        }

        .sidebar-logo-img {
            height: 32px;
            width: auto;
            object-fit: contain;
        }

        .close-sidebar {
            background: #f1f5f9;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1rem;
            color: #1a1f2b;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-sidebar:active {
            background: #e2e8f0;
            transform: scale(0.95);
        }

        /* SIDEBAR AUTH BUTTONS - PLACED AT TOP (immediately below header) to avoid scrolling */
        .sidebar-auth-top {
            padding: 1.2rem 1.5rem 0.8rem 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            border-bottom: 1px solid #eef2ff;
            background: white;
        }

        .btn-login-sidebar-top,
        .btn-signup-sidebar-top {
            width: 100%;
            padding: 0.9rem 1rem;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .btn-login-sidebar-top {
            border: 2px solid #4158D0;
            background: transparent;
            color: #4158D0;
        }

        .btn-signup-sidebar-top {
            border: none;
            background: linear-gradient(90deg, #4158D0, #C850C0);
            color: white;
        }

        .btn-login-sidebar-top:active,
        .btn-signup-sidebar-top:active {
            transform: scale(0.97);
        }

        /* Sidebar Navigation Links - appears after auth buttons */
        .sidebar-nav {
            flex: 1;
            padding: 1rem 0 1rem 0;
        }

        .sidebar-nav a {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.5rem;
            text-decoration: none;
            color: #1a1f2b;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.25s;
            border-left: 3px solid transparent;
        }

        .sidebar-nav a i {
            width: 24px;
            color: #4158D0;
            font-size: 1.1rem;
        }

        .sidebar-nav a:active {
            background: linear-gradient(90deg, rgba(65, 88, 208, 0.08), transparent);
            border-left-color: #4158D0;
            color: #4158D0;
        }

        /* Remove old bottom auth section since we moved auth to top */
        .sidebar-auth {
            display: none;
        }

        /* Sidebar Overlay */
        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1002;
            display: none;
            transition: opacity 0.3s;
        }

        .sidebar-overlay.active {
            display: block;
        }

        /* Mobile specific styles */
        @media (max-width: 768px) {
            .nav-links-desktop {
                display: none;
            }

            /* Hide auth buttons on mobile header */
            .nav-buttons {
                display: none;
            }

            .menu-toggle {
                display: flex;
                margin-left: auto;
            }

            .navbar {
                padding: 0.9rem 5%;
                justify-content: space-between;
            }

            .logo {
                margin-right: auto;
            }
        }

        /* Desktop specific - ensure proper positioning */
        @media (min-width: 769px) {
            .nav-links-desktop a::before {
                content: '';
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                height: 2px;
                background: linear-gradient(90deg, #4158D0, #C850C0);
                transform: scaleX(0);
                transition: transform 0.3s ease;
            }
        }
    </style>

    <!-- Navigation: Desktop - logo left, nav links centered, auth buttons right -->
    <nav class="navbar" id="navbar">
        <div class="logo">
            <img src="assets/logo.png" alt="ClinicCare Pro Logo" class="logo-img">
        </div>
        <div class="nav-links-desktop">
            <a href="#home">Home</a>
            <a href="#features">Features</a>
            <a href="#doctors">Doctors</a>
            <a href="#solutions">Solutions</a>
            <a href="#pricing">Pricing</a>
            <a href="#contact">Contact</a>
        </div>
        <div class="nav-buttons">
            <button class="btn-login" onclick="openAuth('signin')">Sign In</button>
            <button class="btn-signup" onclick="openAuth('signup')">Sign Up</button>
        </div>
        <!-- Mobile toggle button -->
        <button class="menu-toggle" id="menuToggleBtn">
            <i class="fas fa-bars"></i>
        </button>
    </nav>

    <!-- Mobile Sidebar (slides from left) - AUTH BUTTONS AT TOP (immediately visible without scroll) -->
    <div class="mobile-sidebar" id="mobileSidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="assets/logo.png" alt="ClinicCare Pro Logo" class="sidebar-logo-img">
                <span>ClinicCare Pro</span>
            </div>
            <button class="close-sidebar" id="closeSidebarBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <!-- AUTH BUTTONS RIGHT AT THE TOP, NO SCROLL NEEDED -->
        <div class="sidebar-auth-top">
            <button class="btn-login-sidebar-top" onclick="openAuth('signin')">Sign In</button>
            <button class="btn-signup-sidebar-top" onclick="openAuth('signup')">Sign Up</button>
        </div>
        <div class="sidebar-nav">
            <a href="#home"><i class="fas fa-home"></i> Home</a>
            <a href="#features"><i class="fas fa-star"></i> Features</a>
            <a href="#doctors"><i class="fas fa-user-md"></i> Doctors</a>
            <a href="#solutions"><i class="fas fa-chalkboard-user"></i> Solutions</a>
            <a href="#pricing"><i class="fas fa-tag"></i> Pricing</a>
            <a href="#contact"><i class="fas fa-envelope"></i> Contact</a>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <script>
        // Mobile Sidebar Controls
        const menuToggle = document.getElementById('menuToggleBtn');
        const mobileSidebar = document.getElementById('mobileSidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');
        const closeSidebarBtn = document.getElementById('closeSidebarBtn');

        function openSidebar() {
            mobileSidebar.classList.add('active');
            sidebarOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            mobileSidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        if (menuToggle) menuToggle.addEventListener('click', openSidebar);
        if (closeSidebarBtn) closeSidebarBtn.addEventListener('click', closeSidebar);
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', closeSidebar);

        // Close sidebar when clicking on any sidebar nav link and scroll to section
        document.querySelectorAll('.sidebar-nav a').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    closeSidebar();
                    setTimeout(() => {
                        targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 150);
                }
            });
        });

        // Desktop nav smooth scroll
        document.querySelectorAll('.nav-links-desktop a, .logo').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                const hash = this.getAttribute('href');
                if (hash && hash.startsWith('#')) {
                    e.preventDefault();
                    const target = document.querySelector(hash);
                    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    else {
                        // If section doesn't exist, just close sidebar
                        closeSidebar();
                    }
                }
            });
        });

        // Navbar scroll effect
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('navbar');
            const backToTop = document.querySelector('.back-to-top');
            if (window.scrollY > 50) navbar.classList.add('scrolled');
            else navbar.classList.remove('scrolled');
            if (window.scrollY > 300) {
                if (backToTop) backToTop.classList.add('show');
            } else {
                if (backToTop) backToTop.classList.remove('show');
            }
        });

        // Mock functions for standalone viewing
        window.openAuth = function (tab) {
            alert('This would redirect to ' + tab + ' page in the full application.');
        };
    </script>
</body>

</html>
