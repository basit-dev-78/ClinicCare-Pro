            .sidebar-header {

            /* --- SUBMENU STYLING --- */

            .submenu-item {
                display: flex;

                color: #a5c3dd;
                font-weight: 500;
                font-size: 0.8rem;

            .submenu-item.active {

        const config = configs[role];
        if (!config) {
            return;
        }

        dashboard.style.setProperty('--sidebar-expanded-width', `${config.expandedWidth || 230}px`);
        dashboard.style.setProperty('--sidebar-collapsed-width', '88px');

        const navHtml = config.items.map((item, index) => {
            if (item.subItems) {
                const subItemsHtml = item.subItems.map(sub => `
                    <div class="submenu-item" data-page="${sub.page}">
                        <i class="fas fa-circle-notch" style="font-size:0.5rem; width:12px; color:rgba(255,255,255,0.4);"></i>
                        <span>${sub.label}</span>
                    </div>
                `).join('');

                return `
                    <div class="nav-item-wrapper">
                        <div class="nav-item nav-parent" data-group="${item.page}">
                            <i class="${item.icon}"></i> <span>${item.label}</span>
                            <i class="fas fa-chevron-down chevron-icon"></i>
                        </div>
                        <div class="sidebar-submenu" id="submenu-${item.page}">
                            ${subItemsHtml}
                        </div>
                    </div>
                `;
            }

            return `
                <div class="nav-item${index === 0 ? ' active' : ''}" data-page="${item.page}">
                    <i class="${item.icon}"></i> <span>${item.label}</span>
                </div>
            `;
        }).join('');

        dashboard.insertAdjacentHTML('afterbegin', `
            <div class="sidebar-overlay" id="sidebarOverlay"></div>
            <div class="sidebar" id="sidebar">
                <div class="sidebar-header">
                    <div class="brand-icon"><img src="./assets/logo.png" alt="ClinicCare Pro" style="height: 50px; width: auto;"></div>
                </div>
                <nav class="nav-menu">${navHtml}</nav>
                <div class="logout-button" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>${config.logoutLabel}</span></div>
                <div id="sidebarUserMeta" style="display:flex; align-items:center; gap:12px; margin:0 16px 20px; font-size:0.72rem; line-height:1.3; color:rgba(255,255,255,0.72); padding-top:16px; border-top:1px solid rgba(255,255,255,0.08);">
                    <img id="sidebarUserPic" src="" style="width:34px; height:34px; border-radius:50%; object-fit:cover; border:1.5px solid rgba(255,255,255,0.2);">
                    <div style="min-width:0; flex:1;">
                        <div id="sidebarUserName" style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; color:#fff;"></div>
                        <div id="sidebarUserRole" style="color:#9ec5ff; font-size:0.65rem;"></div>
                    </div>
                </div>
            </div>
        `);

        function renderSidebarProfile() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
            const nameEl = document.getElementById('sidebarUserName');
            const roleEl = document.getElementById('sidebarUserRole');
            if (!currentUser || !nameEl || !roleEl) {
                return;
            }

            const roleLabel = typeof config.userRoleLabel === 'function'
                ? config.userRoleLabel(currentUser)
                : (config.userRoleLabel || currentUser.role || '');

            nameEl.textContent = currentUser.name || '';
            roleEl.textContent = roleLabel;

            const picEl = document.getElementById('sidebarUserPic');
            if (picEl) {
                picEl.src = currentUser.profilePic || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name || 'User')}&background=2c7da0&color=fff`;
            }
        }

        function syncTitles(page) {
            let label = page;
            const subSpan = document.querySelector(`.submenu-item[data-page="${page}"] span`);
            const navSpan = document.querySelector(`.nav-item[data-page="${page}"] span`);
            
            if (subSpan) label = subSpan.innerText;
            else if (navSpan) label = navSpan.innerText;
            
            const headerTitle = document.getElementById('headerTitle');
            const mobileTitle = document.getElementById('mobileTitle');
            const desktopTitle = document.getElementById('desktopTitle');

            if (headerTitle) headerTitle.innerText = label;
            if (mobileTitle) mobileTitle.innerText = label;
            if (desktopTitle) desktopTitle.innerText = label;
        }

        function setActive(page) {
            document.querySelectorAll('.nav-item').forEach((item) => {
                item.classList.remove('active');
            });
            document.querySelectorAll('.submenu-item').forEach((item) => {
                item.classList.remove('active');
            });

            const matchingNavItem = document.querySelector(`.nav-item[data-page="${page}"]`);
            if (matchingNavItem) {
                matchingNavItem.classList.add('active');
                document.querySelectorAll('.sidebar-submenu').forEach(sub => {
                    sub.classList.remove('open');
                });
                document.querySelectorAll('.nav-parent').forEach(nav => {
                    nav.classList.remove('expanded');
                });
            } else {
                const matchingSubItem = document.querySelector(`.submenu-item[data-page="${page}"]`);
                if (matchingSubItem) {
                    matchingSubItem.classList.add('active');
                    const submenu = matchingSubItem.closest('.sidebar-submenu');
                    if (submenu) {
                        submenu.classList.add('open');
                        const parentNav = submenu.previousElementSibling;
                        if (parentNav) {
                            parentNav.classList.add('active');
                            parentNav.classList.add('expanded');
                        }
                    }
                }
            }
            syncTitles(page);
        }

        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) {
                sidebar.classList.remove('open');
                sidebar.classList.remove('mobile-open');
            }
            if (overlay) {
                overlay.classList.remove('active');
            }
            document.body.style.overflow = '';
        }

        function isHoverCollapseDesktop() {
            return window.matchMedia('(min-width: 1024px)').matches;
        }

        function setDesktopSidebarState(expanded) {
            if (!isHoverCollapseDesktop()) {
                dashboard.classList.remove('sidebar-compact');
                dashboard.classList.remove('sidebar-expanded');
                return;
            }
            dashboard.classList.toggle('sidebar-expanded', expanded);
            dashboard.classList.toggle('sidebar-compact', !expanded);
        }

        function openSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            if (sidebar) {
                if (role === 'admin') {
                    sidebar.classList.add('mobile-open');
                } else {
                    sidebar.classList.add('open');
                }
            }
            if (overlay) {
                overlay.classList.add('active');
            }
            document.body.style.overflow = 'hidden';
        }

        const menuToggle = document.querySelector('.menu-toggle-btn, .menu-toggle');
        if (menuToggle) {
            menuToggle.addEventListener('click', function (event) {
                event.stopPropagation();
                const sidebar = document.getElementById('sidebar');
                if (!sidebar) {
                    return;
                }
                const isOpen = role === 'admin'
                    ? sidebar.classList.contains('mobile-open')
                    : sidebar.classList.contains('open');

                if (isOpen) {
                    closeSidebar();
                } else {
                    openSidebar();
                }
            });
        }

        const overlay = document.getElementById('sidebarOverlay');
        if (overlay) {
            overlay.addEventListener('click', closeSidebar);
        }

        window.addEventListener('resize', function () {
            if (isHoverCollapseDesktop()) {
                setDesktopSidebarState(true);
            }
        });

        document.querySelectorAll('.nav-item').forEach((item) => {
            item.addEventListener('click', function () {
                if (this.classList.contains('nav-parent')) {
                    const group = this.dataset.group;
                    const submenu = document.getElementById(`submenu-${group}`);
                    const isExpanded = this.classList.contains('expanded');

                    document.querySelectorAll('.sidebar-submenu').forEach(sub => {
                        if (sub !== submenu) sub.classList.remove('open');
                    });
                    document.querySelectorAll('.nav-parent').forEach(nav => {
                        if (nav !== this) nav.classList.remove('expanded');
                    });

                    this.classList.toggle('expanded', !isExpanded);
                    if (submenu) {
                        submenu.classList.toggle('open', !isExpanded);
                        
                        const firstSub = submenu.querySelector('.submenu-item');
                        if (firstSub && !isExpanded) {
                            firstSub.click();
                        }
                    }
                    return;
                }

                const page = this.dataset.page;
                setActive(page);
                window.currentDashboardPage = page;
                if (window.loadPage) {
                    window.loadPage(page);
                }
                if (window.innerWidth < 1024) {
                    closeSidebar();
                }
            });
        });

        document.querySelectorAll('.submenu-item').forEach((item) => {
            item.addEventListener('click', function (e) {
                e.stopPropagation();
                const page = this.dataset.page;
                setActive(page);
                window.currentDashboardPage = page;
                if (window.loadPage) {
                    window.loadPage(page);
                }
                if (window.innerWidth < 1024) {
                    closeSidebar();
                }
            });
        });

        const logoutBtn = document.getElementById('logoutBtn');
        if (logoutBtn) {
            logoutBtn.addEventListener('click', function () {
                config.logout();
            });
        }

        window.renderSidebarProfile = renderSidebarProfile;
        window.updateSharedSidebarState = function (page) {
            setActive(page);
        };

        setDesktopSidebarState(true);
        renderSidebarProfile();
        setActive(window.currentDashboardPage || 'dashboard');
    })();
</script>
