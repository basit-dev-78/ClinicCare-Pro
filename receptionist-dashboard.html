<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ClinicCare · Receptionist Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c9b8f; --primary-dark: #1f7a6e; --bg: #f5f9ff; --text: #0a2540; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .dashboard { display: flex; min-height: 100vh; }
        .main-panel { flex: 1; padding: 24px; transition: margin-left 0.3s; }
        @media (max-width: 1024px) { .main-panel { margin-left: 0 !important; padding: 16px; } }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 28px; border-radius: 60px; box-shadow: 0 4px 14px rgba(0,20,50,0.04); margin-bottom: 28px; border: 1px solid #e6edfa; }
        .page-title { font-weight: 700; font-size: 1.6rem; background: linear-gradient(135deg, #1f7a6e, #2c9b8f); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .live-clock { background: #eaf8f7; padding: 7px 20px; border-radius: 40px; font-weight: 500; color: #1f7a6e; font-size: 0.8rem; }
        .menu-toggle { display: none; background: #2c9b8f; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        @media (max-width: 1024px) { .menu-toggle { display: flex; align-items: center; justify-content: center; } .page-title { font-size: 1.2rem; } }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        @media (max-width: 768px) { .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        .stat-block { background: white; padding: 18px 22px; border-radius: 32px; border: 1px solid #e2edfc; box-shadow: 0 8px 18px -10px rgba(0,35,70,0.06); display: flex; align-items: center; gap: 18px; }
        .stat-icon { width: 56px; height: 56px; background: linear-gradient(120deg, #eaf8f7, #e1f2f0); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #1f7a6e; }
        .stat-info h4 { font-weight: 500; color: #5a6e8c; font-size: 0.65rem; letter-spacing: 0.4px; margin-bottom: 4px; text-transform: uppercase; }
        .stat-info .figure { font-weight: 800; font-size: 1.8rem; color: #0a2b44; line-height: 1.2; }

        .content-card { background: white; border-radius: 36px; padding: 24px 28px; border: 1px solid #e5edfc; box-shadow: 0 10px 24px -12px rgba(0,30,60,0.06); margin-bottom: 26px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .card-header h3 { font-weight: 700; font-size: 1.3rem; color: #1e3a5f; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px 8px; font-weight: 600; font-size: 0.7rem; color: #5b7295; text-transform: uppercase; border-bottom: 2px solid #e6edfc; }
        td { padding: 12px 8px; border-bottom: 1px solid #f0f4fe; color: #1a3154; font-size: 0.85rem; }
        
        .status-badge { padding: 5px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-active { background: #e1f7ea; color: #10b981; }
        .badge-pending { background: #fff0db; color: #f59e0b; }
        .badge-checkedin { background: #d9effa; color: #1a6d8f; }

        .btn-primary { background: linear-gradient(135deg, #2c9b8f, #1f7a6e); color: white; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary { background: #f0f8f7; color: #1f7a6e; border: none; padding: 8px 18px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-outline { background: transparent; border: 1.5px solid #e2e8f0; padding: 8px 18px; border-radius: 40px; cursor: pointer; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-window { background: white; border-radius: 40px; padding: 32px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2); }
        .form-field { margin-bottom: 18px; }
        .form-field label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; color: #4b5563; }
        .form-input { width: 100%; padding: 12px 20px; border: 1.5px solid #e5e7eb; border-radius: 16px; font-family: inherit; font-size: 0.9rem; }

        /* Toast */
        .toast-notification { position: fixed; bottom: 30px; right: 30px; background: #1f2937; color: white; padding: 16px 28px; border-radius: 20px; display: flex; align-items: center; gap: 12px; transform: translateY(150%); transition: 0.4s cubic-bezier(0.17, 0.84, 0.44, 1); z-index: 3000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .toast-notification.show { transform: translateY(0); }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error { border-left: 4px solid #ef4444; }
    </style>
</head>

<body data-sidebar-role="receptionist">
    <div class="dashboard">
        <!-- SIDEBAR WILL BE INJECTED HERE -->

        <div class="main-panel">
            <div class="header-bar">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="page-title" id="headerTitle">Reception Dashboard</div>
                <div class="live-clock" id="desktopClock">--:--</div>
            </div>
            <div id="contentArea"></div>
        </div>
    </div>

    <div id="modalRoot" style="display:none;"></div>
    <div class="toast-notification" id="toastMsg"><i class="fas" id="toastIcon"></i><span id="toastText"></span></div>

    <script src="Frontend/assets/js/api.js"></script>
    <script>
        const app = {
            currentUser: null,
            data: { appointments: [], patients: [], doctors: [] },

            init: async () => {
                app.currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const token = localStorage.getItem('authToken');
                if (!app.currentUser || !token || app.currentUser.role !== 'receptionist') {
                    window.location.href = 'auth.html';
                    return;
                }
                app.setupSidebar();
                app.startClock();
                await app.loadPage('dashboard');
            },

            setupSidebar: () => {
                fetch('Frontend/components/sidebar.html')
                    .then(r => r.text())
                    .then(html => {
                        const div = document.createElement('div');
                        div.innerHTML = html;
                        const script = div.querySelector('script');
                        if (script) {
                            const newScript = document.createElement('script');
                            newScript.textContent = script.textContent;
                            document.body.appendChild(newScript);
                        }
                    });
            },

            startClock: () => {
                const update = () => {
                    const clock = document.getElementById('desktopClock');
                    if (clock) clock.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                };
                update(); setInterval(update, 60000);
            },

            showToast: (msg, type = 'success') => {
                const toast = document.getElementById('toastMsg');
                document.getElementById('toastIcon').className = 'fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle');
                document.getElementById('toastText').innerText = msg;
                toast.className = `toast-notification toast-${type} show`;
                setTimeout(() => toast.classList.remove('show'), 3000);
            },

            loadData: async () => {
                try {
                    const [apps, usersData, bills] = await Promise.all([
                        API.get('appointments'),
                        API.get('users'),
                        API.get('billing')
                    ]);
                    app.data.appointments = apps || [];
                    app.data.patients = (usersData && usersData.users) ? usersData.users.filter(u => u.role === 'patient') : [];
                    app.data.doctors = (usersData && usersData.users) ? usersData.users.filter(u => u.role === 'doctor') : [];
                    app.data.billing = bills || [];
                } catch (e) { 
                    console.error('Receptionist Load Error:', e);
                    app.showToast('Data load failed', 'error'); 
                }
            },

            loadPage: async (page) => {
                await app.loadData();
                const container = document.getElementById('contentArea');
                const title = document.getElementById('headerTitle');
                window.currentDashboardPage = page;
                if (window.updateSharedSidebarState) window.updateSharedSidebarState(page);

                if (page === 'dashboard') app.renderDashboard(container, title);
                else if (page === 'appointments') app.renderAppointments(container, title);
                else if (page === 'appointments-add') app.renderBookAppointment(container, title);
                else if (page === 'patients') app.renderPatients(container, title);
                else if (page === 'patients-add') app.renderAddPatient(container, title);
                else if (page === 'doctors') app.renderDoctors(container, title);
                else if (page === 'schedule') app.renderSchedule(container, title);
                else if (page === 'checkin') app.renderCheckin(container, title);
                else if (page === 'billing') app.renderBilling(container, title);
            },

            renderDashboard: (con, title) => {
                title.innerText = 'Reception Dashboard';
                const today = new Date().toISOString().slice(0, 10);
                const todayApps = app.data.appointments.filter(a => a.date === today).length;
                const checkedIn = app.data.appointments.filter(a => a.date === today && a.status === 'checked-in').length;
                const pending = app.data.appointments.filter(a => a.date === today && a.status === 'pending').length;
                const totalPatients = app.data.patients.length;

                con.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-calendar-day"></i></div><div class="stat-info"><h4>Today's Apps</h4><div class="figure">${todayApps}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-user-check"></i></div><div class="stat-info"><h4>Checked In</h4><div class="figure">${checkedIn}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-hourglass-half"></i></div><div class="stat-info"><h4>Pending</h4><div class="figure">${pending}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h4>Total Patients</h4><div class="figure">${totalPatients}</div></div></div>
                </div>
                <div class="content-card">
                    <div class="card-header"><h3>Current Queue</h3><button class="btn-primary" onclick="app.loadPage('appointments')">Manage All</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${app.data.appointments.filter(a => a.date === today && a.status !== 'completed').map(a => `<tr><td>${a.time}</td><td>${a.patient}</td><td>${a.doctor}</td><td><span class="status-badge ${a.status === 'checked-in' ? 'badge-checkedin' : 'badge-pending'}">${a.status}</span></td><td>${a.status !== 'checked-in' ? `<button class="btn-secondary" onclick="app.checkIn('${a.id}')">Check-in</button>` : '<i class="fas fa-check-circle" style="color:#2c9b8f"></i>'}</td></tr>`).join('') || '<tr><td colspan="5">No active appointments today</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            checkIn: async (id) => {
                try {
                    await API.put(`appointments/${id}`, { status: 'checked-in' });
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Checked-in patient for appointment ID ${id}` });
                    app.showToast('Patient checked-in');
                    await app.loadPage('dashboard');
                } catch (e) { app.showToast('Update failed', 'error'); }
            },

            renderAppointments: (con, title) => {
                title.innerText = 'Appointment Manager';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>All Appointments</h3><button class="btn-primary" onclick="app.loadPage('appointments-add')">New Appointment</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${app.data.appointments.map(a => `<tr><td>${a.date}</td><td>${a.time}</td><td>${a.patient}</td><td>${a.doctor}</td><td><span class="status-badge ${a.status === 'checked-in' ? 'badge-checkedin' : 'badge-pending'}">${a.status}</span></td><td><button class="btn-secondary" onclick="app.deleteAppt('${a.id}')">Cancel</button></td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderBookAppointment: (container, title) => {
                title.innerText = 'Book Appointment';
                container.innerHTML = `
                    <div class="content-card" style="width: 100%; padding: 32px; border-radius: 24px; box-shadow: var(--shadow);">
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 1.4rem; font-weight: 700; color: #0a2540;">📅 Book Appointment</h3>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Schedule an appointment slot for a registered patient.</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-field">
                                <label>Patient</label>
                                <select id="aPat" class="form-input">
                                    ${app.data.patients.map(p => `<option value="${p.id}|${p.name}">${p.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-field">
                                <label>Doctor</label>
                                <select id="aDoc" class="form-input">
                                    ${app.data.doctors.map(d => `<option value="${d.id}|${d.name}">${d.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="row-fields" style="display: flex; gap: 16px;">
                                <div class="form-field" style="flex:1;">
                                    <label>Date</label>
                                    <input id="aDate" type="date" class="form-input" value="${new Date().toISOString().slice(0,10)}">
                                </div>
                                <div class="form-field" style="flex:1;">
                                    <label>Time</label>
                                    <input id="aTime" type="time" class="form-input" value="10:00">
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="content-card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: 24px; position: sticky; bottom: 0; background: white; z-index: 100;">
                        <button class="btn-outline" onclick="app.loadPage('appointments')">Cancel</button>
                        <button class="btn-primary" onclick="app.saveAppt()">Schedule</button>
                    </div>`;
            },

            saveAppt: async () => {
                const [pId, pName] = document.getElementById('aPat').value.split('|');
                const [dId, dName] = document.getElementById('aDoc').value.split('|');
                const data = { 
                    patientId: pId, 
                    patient: pName, 
                    doctorId: dId, 
                    doctor: dName, 
                    date: document.getElementById('aDate').value, 
                    time: document.getElementById('aTime').value, 
                    status: 'pending' 
                };
                try { 
                    await API.post('appointments', data); 
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Booked appointment for ${pName} with Dr. ${dName}` });
                    closeModal(); app.showToast('Appointment scheduled'); await app.loadPage('appointments'); 
                }
                catch (e) { app.showToast('Scheduling failed', 'error'); }
            },

            deleteAppt: async (id) => {
                if(!confirm('Cancel this appointment?')) return;
                try { await API.delete(`appointments/${id}`); app.showToast('Appointment cancelled'); await app.loadPage('appointments'); }
                catch (e) { app.showToast('Cancellation failed', 'error'); }
            },

            renderPatients: (con, title) => {
                title.innerText = 'Patient Registry';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>Registered Patients</h3><button class="btn-primary" onclick="app.loadPage('patients-add')">Register New</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Name</th><th>Email</th><th>Contact</th></tr></thead>
                        <tbody>${app.data.patients.map(p => `<tr><td>${p.name}</td><td>${p.email}</td><td>${p.phone || '—'}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderAddPatient: (container, title) => {
                title.innerText = 'Add Patient';
                container.innerHTML = `
                    <div class="content-card" style="width: 100%; padding: 32px; border-radius: 24px; box-shadow: var(--shadow);">
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 1.4rem; font-weight: 700; color: #0a2540;">➕ Register New Patient</h3>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Fill in the profile details to add a patient to the directory.</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-field">
                                <label>Full Name</label>
                                <input id="pName" class="form-input" placeholder="e.g. John Doe">
                            </div>
                            <div class="form-field">
                                <label>Email Address</label>
                                <input id="pEmail" type="email" class="form-input" placeholder="e.g. john@example.com">
                            </div>
                            <div class="form-field">
                                <label>Phone Number</label>
                                <input id="pPhone" class="form-input" placeholder="e.g. +91 9876543210">
                            </div>
                        </div>
                    </div>
                    <div class="content-card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: 24px; position: sticky; bottom: 0; background: white; z-index: 100;">
                        <button class="btn-outline" onclick="app.loadPage('patients')">Cancel</button>
                        <button class="btn-primary" onclick="app.savePatient()">Register</button>
                    </div>`;
            },

            savePatient: async () => {
                const data = { name: document.getElementById('pName').value, email: document.getElementById('pEmail').value, phone: document.getElementById('pPhone').value, role: 'patient', password: 'password123' };
                try { 
                    await API.post('signup', data); 
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Registered new patient: ${data.name}` });
                    closeModal(); app.showToast('Patient registered'); await app.loadPage('patients'); 
                }
                catch (e) { app.showToast('Registration failed', 'error'); }
            },

            renderDoctors: (con, title) => {
                title.innerText = 'Medical Staff';
                con.innerHTML = `
                    <div class="content-card">
                        <div class="card-header">
                            <h3>Active Physicians</h3>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Contact</th>
                                        <th>Specialization</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${app.data.doctors.map(d => `
                                        <tr>
                                            <td style="font-weight: 600;">Dr. ${d.name}</td>
                                            <td>${d.email}</td>
                                            <td>${d.phone || '—'}</td>
                                            <td><span class="status-badge badge-checkedin">${d.specialization || 'General Practice'}</span></td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="4" style="text-align: center; color: #6b7280;">No active physicians found</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderSchedule: (con, title) => {
                title.innerText = "Today's Schedule";
                const today = new Date().toISOString().slice(0, 10);
                const todayApps = app.data.appointments.filter(a => a.date === today);
                con.innerHTML = `
                    <div class="content-card">
                        <div class="card-header">
                            <h3>Appointment Queue for ${today}</h3>
                            <button class="btn-primary" onclick="app.loadPage('appointments-add')">Book Appointment</button>
                        </div>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Patient</th>
                                        <th>Doctor</th>
                                        <th>Reason</th>
                                        <th>Status</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${todayApps.sort((a,b) => (a.time || '').localeCompare(b.time || '')).map(a => `
                                        <tr>
                                            <td style="font-weight: 600; color: #1f7a6e;">${a.time || '—'}</td>
                                            <td>${a.patient}</td>
                                            <td>${a.doctor}</td>
                                            <td>${a.reason || 'Routine Checkup'}</td>
                                            <td>
                                                <span class="status-badge ${a.status === 'confirmed' || a.status === 'checked-in' ? 'badge-active' : a.status === 'pending' ? 'badge-pending' : 'badge-checkedin'}">
                                                    ${a.status}
                                                </span>
                                            </td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="5" style="text-align: center; color: #6b7280;">No appointments scheduled for today</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderCheckin: (con, title) => {
                title.innerText = 'Patient Check-in';
                const today = new Date().toISOString().slice(0, 10);
                const checkinQueue = app.data.appointments.filter(a => a.date === today);
                con.innerHTML = `
                    <div class="content-card">
                        <div class="card-header">
                            <h3>Today's Arrival Station</h3>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Easily verify patient arrivals and check them into the physician queue.</p>
                        </div>
                        <div class="table-wrapper" style="margin-top: 16px;">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Time</th>
                                        <th>Patient</th>
                                        <th>Assigned Physician</th>
                                        <th>Status</th>
                                        <th style="text-align: right;">Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${checkinQueue.map(a => `
                                        <tr>
                                            <td style="font-weight: 600;">${a.time || '—'}</td>
                                            <td style="font-weight: 500;">${a.patient}</td>
                                            <td>${a.doctor}</td>
                                            <td>
                                                <span class="status-badge ${a.status === 'checked-in' ? 'badge-active' : 'badge-pending'}">
                                                    ${a.status}
                                                </span>
                                            </td>
                                            <td style="text-align: right;">
                                                ${a.status === 'pending' || a.status === 'confirmed' ? `
                                                    <button class="btn-primary" style="padding: 6px 16px; font-size: 0.75rem;" onclick="app.processCheckin('${a.id || a._id}')">
                                                        <i class="fas fa-check-double" style="margin-right: 4px;"></i> Check-in
                                                    </button>
                                                ` : `
                                                    <span style="color: #10b981; font-weight: 600; font-size: 0.8rem;">
                                                        <i class="fas fa-circle-check"></i> Checked-in
                                                    </span>
                                                `}
                                            </td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="5" style="text-align: center; color: #6b7280;">No appointments found for today</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            processCheckin: async (id) => {
                try {
                    const appt = app.data.appointments.find(a => (a.id || a._id) === id);
                    const patientName = appt ? appt.patient : 'Patient';
                    await API.put(`appointments/${id}`, { status: 'checked-in' });
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Checked in patient ${patientName} for today's appointment` });
                    app.showToast(`Checked in ${patientName} successfully!`);
                    await app.loadPage('checkin');
                } catch (e) {
                    console.error('Checkin Error:', e);
                    app.showToast('Checkin failed', 'error');
                }
            },

            renderBilling: (con, title) => {
                title.innerText = 'Billing & Invoices';
                con.innerHTML = `
                    <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 24px; align-items: start;">
                        <!-- Create Invoice Panel -->
                        <div class="content-card">
                            <h3 style="margin-bottom: 20px; font-size: 1.2rem; font-weight: 700; color: #0a2540;">💰 Record Invoice</h3>
                            <div style="display: flex; flex-direction: column; gap: 16px;">
                                <div class="form-field">
                                    <label>Select Patient</label>
                                    <select id="billPat" class="form-input">
                                        ${app.data.patients.map(p => `<option value="${p.id || p._id}|${p.name}">${p.name}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-field">
                                    <label>Description</label>
                                    <input id="billDesc" class="form-input" placeholder="e.g. Consultant fee, lab reports">
                                </div>
                                <div class="form-field">
                                    <label>Amount (₹)</label>
                                    <input id="billAmount" type="number" class="form-input" placeholder="e.g. 500">
                                </div>
                                <button class="btn-primary" style="width: 100%; margin-top: 10px;" onclick="app.processBilling()">
                                    <i class="fas fa-file-invoice-dollar" style="margin-right: 6px;"></i> Issue Invoice
                                </button>
                            </div>
                        </div>

                        <!-- Invoice History -->
                        <div class="content-card">
                            <h3 style="margin-bottom: 20px; font-size: 1.2rem; font-weight: 700; color: #0a2540;">📋 Invoice Records</h3>
                            <div class="table-wrapper">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Patient</th>
                                            <th>Description</th>
                                            <th>Amount</th>
                                            <th>Status</th>
                                            <th style="text-align: right;">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        ${app.data.billing.map(b => `
                                            <tr>
                                                <td>${b.date || new Date().toISOString().slice(0, 10)}</td>
                                                <td style="font-weight: 600;">${b.patient}</td>
                                                <td>${b.description || 'Medical Consultation'}</td>
                                                <td style="font-weight: 600; color: #1e3a5f;">₹${b.amount}</td>
                                                <td>
                                                    <span class="status-badge ${b.status === 'paid' ? 'badge-active' : 'badge-pending'}">
                                                        ${b.status}
                                                    </span>
                                                </td>
                                                <td style="text-align: right;">
                                                    ${b.status === 'pending' ? `
                                                        <button class="btn-secondary" style="padding: 6px 12px; font-size: 0.75rem;" onclick="app.recordPayment('${b.id || b._id}')">
                                                            Collect
                                                        </button>
                                                    ` : `
                                                        <span style="color: #10b981; font-weight: 600; font-size: 0.8rem;">
                                                            <i class="fas fa-circle-check"></i> Paid
                                                        </span>
                                                    `}
                                                </td>
                                            </tr>
                                        `).join('') || '<tr><td colspan="6" style="text-align: center; color: #6b7280;">No billing history found</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                `;
            },

            processBilling: async () => {
                const selectVal = document.getElementById('billPat').value;
                if (!selectVal) {
                    app.showToast('Please select a patient', 'error');
                    return;
                }
                const [patientId, patientName] = selectVal.split('|');
                const desc = document.getElementById('billDesc').value;
                const amt = parseFloat(document.getElementById('billAmount').value);

                if (!desc || isNaN(amt) || amt <= 0) {
                    app.showToast('Please input valid description and amount', 'error');
                    return;
                }

                const data = {
                    patientId,
                    patient: patientName,
                    description: desc,
                    amount: amt,
                    status: 'pending',
                    date: new Date().toISOString().slice(0, 10)
                };

                try {
                    await API.post('billing', data);
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Issued invoice of ₹${amt} for patient ${patientName}` });
                    app.showToast('Invoice generated!');
                    await app.loadPage('billing');
                } catch (e) {
                    console.error('Invoice Error:', e);
                    app.showToast('Failed to create invoice', 'error');
                }
            },

            recordPayment: async (id) => {
                try {
                    const bill = app.data.billing.find(b => (b.id || b._id) === id);
                    const patientName = bill ? bill.patient : 'Patient';
                    const amount = bill ? bill.amount : 0;
                    await API.put(`billing/${id}`, { status: 'paid' });
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Collected payment of ₹${amount} from patient ${patientName}` });
                    app.showToast(`Collected ₹${amount} successfully!`);
                    await app.loadPage('billing');
                } catch (e) {
                    console.error('Payment Error:', e);
                    app.showToast('Payment recording failed', 'error');
                }
            },

            openModal: (html) => {
                const root = document.getElementById('modalRoot');
                root.innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal-window" onclick="event.stopPropagation()">${html}</div></div>`;
                root.style.display = 'flex';
            }
        };

        window.loadPage = app.loadPage;
        window.closeModal = () => document.getElementById('modalRoot').style.display = 'none';
        window.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
