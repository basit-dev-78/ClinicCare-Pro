<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ClinicCare · Pharmacy Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root { --primary: #059669; --primary-dark: #047857; --bg: #f5f9ff; --text: #0a2540; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .dashboard { display: flex; min-height: 100vh; }
        .main-panel { flex: 1; padding: 24px; transition: margin-left 0.3s; }
        @media (max-width: 1024px) { .main-panel { margin-left: 0 !important; padding: 16px; } }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 28px; border-radius: 60px; box-shadow: 0 4px 14px rgba(0,20,50,0.04); margin-bottom: 28px; border: 1px solid #e6edfa; }
        .page-title { font-weight: 700; font-size: 1.6rem; background: linear-gradient(135deg, #064e3b, #059669); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .live-clock { background: #ecfdf5; padding: 7px 20px; border-radius: 40px; font-weight: 500; color: #065f46; font-size: 0.8rem; }
        .menu-toggle { display: none; background: #059669; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        @media (max-width: 1024px) { .menu-toggle { display: flex; align-items: center; justify-content: center; } .page-title { font-size: 1.2rem; } }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        @media (max-width: 768px) { .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        .stat-block { background: white; padding: 18px 22px; border-radius: 32px; border: 1px solid #e2edfc; box-shadow: 0 8px 18px -10px rgba(0,35,70,0.06); display: flex; align-items: center; gap: 18px; }
        .stat-icon { width: 56px; height: 56px; background: linear-gradient(120deg, #ecfdf5, #d1fae5); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #059669; }
        .stat-info h4 { font-weight: 500; color: #64748b; font-size: 0.65rem; letter-spacing: 0.4px; margin-bottom: 4px; text-transform: uppercase; }
        .stat-info .figure { font-weight: 800; font-size: 1.8rem; color: #0f172a; line-height: 1.2; }

        .content-card { background: white; border-radius: 36px; padding: 24px 28px; border: 1px solid #e5edfc; box-shadow: 0 10px 24px -12px rgba(0,30,60,0.06); margin-bottom: 26px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .card-header h3 { font-weight: 700; font-size: 1.3rem; color: #0f172a; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px 8px; font-weight: 600; font-size: 0.7rem; color: #64748b; text-transform: uppercase; border-bottom: 2px solid #e6edfc; }
        td { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; color: #1a3154; font-size: 0.85rem; }
        
        .status-badge { padding: 5px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-low { background: #fef2f2; color: #991b1b; }
        .badge-good { background: #f0fdf4; color: #166534; }

        .btn-primary { background: linear-gradient(135deg, #059669, #047857); color: white; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary { background: #f0fdf4; color: #065f46; border: none; padding: 8px 18px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-outline { background: transparent; border: 1.5px solid #e2e8f0; padding: 8px 18px; border-radius: 40px; cursor: pointer; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-window { background: white; border-radius: 40px; padding: 32px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2); }
        .form-field { margin-bottom: 18px; }
        .form-field label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; color: #4b5563; }
        .form-input { width: 100%; padding: 12px 20px; border: 1.5px solid #e5e7eb; border-radius: 16px; font-family: inherit; font-size: 0.9rem; }

        /* Toast */
        .toast-notification { position: fixed; bottom: 30px; right: 30px; background: #1f2937; color: white; padding: 16px 28px; border-radius: 20px; display: flex; align-items: center; gap: 12px; transform: translateY(150%); transition: 0.4s cubic-bezier(0.17, 0.84, 0.44, 1); z-index: 3000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .toast-notification.show { transform: translateY(0); }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error { border-left: 4px solid #ef4444; }
    </style>
</head>

<body data-sidebar-role="pharma">
    <div class="dashboard">
        <!-- SIDEBAR WILL BE INJECTED HERE -->

        <div class="main-panel">
            <div class="header-bar">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="page-title" id="headerTitle">Pharmacy Manager</div>
                <div class="live-clock" id="desktopClock">--:--</div>
            </div>
            <div id="contentArea"></div>
        </div>
    </div>

    <div id="modalRoot" style="display:none;"></div>
    <div class="toast-notification" id="toastMsg"><i class="fas" id="toastIcon"></i><span id="toastText"></span></div>

    <script src="Frontend/assets/js/api.js"></script>
    <script>
        const app = {
            currentUser: null,
            data: { inventory: [], sales: [], suppliers: [] },

            init: async () => {
                app.currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const token = localStorage.getItem('authToken');
                if (!app.currentUser || !token || app.currentUser.role !== 'pharma') {
                    window.location.href = 'auth.html';
                    return;
                }
                app.setupSidebar();
                app.startClock();
                await app.loadPage('dashboard');
            },

            setupSidebar: () => {
                fetch('Frontend/components/sidebar.html')
                    .then(r => r.text())
                    .then(html => {
                        const div = document.createElement('div');
                        div.innerHTML = html;
                        const script = div.querySelector('script');
                        if (script) {
                            const newScript = document.createElement('script');
                            newScript.textContent = script.textContent;
                            document.body.appendChild(newScript);
                        }
                    });
            },

            startClock: () => {
                const update = () => {
                    const clock = document.getElementById('desktopClock');
                    if (clock) clock.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                };
                update(); setInterval(update, 60000);
            },

            showToast: (msg, type = 'success') => {
                const toast = document.getElementById('toastMsg');
                document.getElementById('toastIcon').className = 'fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle');
                document.getElementById('toastText').innerText = msg;
                toast.className = `toast-notification toast-${type} show`;
                setTimeout(() => toast.classList.remove('show'), 3000);
            },

            loadData: async () => {
                try {
                    const [inv, sales, sups] = await Promise.all([
                        API.get('inventory'),
                        API.get('billing'),
                        API.get('suppliers')
                    ]);
                    app.data.inventory = inv;
                    app.data.sales = sales;
                    app.data.suppliers = sups;
                } catch (e) {
                    // Fallback for missing endpoints during dev
                    app.data.inventory = app.data.inventory || [];
                    app.showToast('Using local state', 'info');
                }
            },

            loadPage: async (page) => {
                await app.loadData();
                const container = document.getElementById('contentArea');
                const title = document.getElementById('headerTitle');
                window.currentDashboardPage = page;
                if (window.updateSharedSidebarState) window.updateSharedSidebarState(page);

                if (page === 'dashboard') app.renderDashboard(container, title);
                else if (page === 'inventory') app.renderInventory(container, title);
                else if (page === 'inventory-add') app.renderAddMedicine(container, title);
                else if (page === 'billing') app.renderBilling(container, title);
                else if (page === 'suppliers') app.renderSuppliers(container, title);
                else if (page === 'purchase') app.renderPurchase(container, title);
                else if (page === 'expiry') app.renderExpiry(container, title);
                else if (page === 'reports') app.renderReports(container, title);
                else if (page === 'settings') app.renderSettings(container, title);
            },

            renderDashboard: (con, title) => {
                title.innerText = 'Pharmacy Overview';
                const totalItems = app.data.inventory.length;
                const lowStock = app.data.inventory.filter(i => i.qty < 20).length;
                const todaySales = app.data.sales.length;
                const totalSuppliers = app.data.suppliers.length;

                con.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-pills"></i></div><div class="stat-info"><h4>Total Stock</h4><div class="figure">${totalItems}</div></div></div>
                    <div class="stat-block"><div class="stat-icon" style="color:#ef4444;"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><h4>Low Stock</h4><div class="figure">${lowStock}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-file-invoice-dollar"></i></div><div class="stat-info"><h4>Today's Sales</h4><div class="figure">${todaySales}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-truck-loading"></i></div><div class="stat-info"><h4>Suppliers</h4><div class="figure">${totalSuppliers}</div></div></div>
                </div>
                <div class="content-card">
                    <div class="card-header"><h3>Recent Invoices</h3><button class="btn-primary" onclick="app.loadPage('billing')">New Bill</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Invoice #</th><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
                        <tbody>${app.data.sales.slice(0, 5).map(s => `<tr><td>${s.id || 'INV-'+Math.floor(Math.random()*1000)}</td><td>${s.date}</td><td>₹${s.amount}</td><td><span class="status-badge badge-good">Paid</span></td></tr>`).join('') || '<tr><td colspan="4">No recent sales</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderInventory: (con, title) => {
                title.innerText = 'Inventory Control';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>Medicine Stock</h3><button class="btn-primary" onclick="app.loadPage('inventory-add')">Add Medicine</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Name</th><th>Batch</th><th>Qty</th><th>Price</th><th>Expiry</th><th>Status</th></tr></thead>
                        <tbody>${app.data.inventory.map(m => `<tr><td>${m.name}</td><td>${m.batch}</td><td>${m.qty}</td><td>₹${m.price}</td><td>${m.expiry}</td><td><span class="status-badge ${m.qty < 20 ? 'badge-low' : 'badge-good'}">${m.qty < 20 ? 'Low' : 'Good'}</span></td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderAddMedicine: (container, title) => {
                title.innerText = 'Add Medicine';
                container.innerHTML = `
                    <div class="content-card" style="width: 100%; padding: 32px; border-radius: 24px; box-shadow: var(--shadow);">
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 1.4rem; font-weight: 700; color: #0a2540;">➕ Add New Medicine</h3>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Log new medicine items to populate the inventory list.</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-field">
                                <label>Medicine Name</label>
                                <input id="mName" class="form-input" placeholder="e.g. Paracetamol 650mg">
                            </div>
                            <div class="form-field">
                                <label>Batch #</label>
                                <input id="mBatch" class="form-input" placeholder="e.g. B-998">
                            </div>
                            <div class="form-field">
                                <label>Quantity</label>
                                <input id="mQty" type="number" class="form-input" placeholder="e.g. 100">
                            </div>
                            <div class="form-field">
                                <label>Unit Price (₹)</label>
                                <input id="mPrice" type="number" class="form-input" placeholder="e.g. 15.5">
                            </div>
                            <div class="form-field">
                                <label>Expiry Date</label>
                                <input id="mExpiry" type="date" class="form-input" value="${new Date(Date.now() + 365*24*60*60*1000).toISOString().slice(0, 10)}">
                            </div>
                        </div>
                    </div>
                    <div class="content-card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: 24px; position: sticky; bottom: 0; background: white; z-index: 100;">
                        <button class="btn-outline" onclick="app.loadPage('inventory')">Cancel</button>
                        <button class="btn-primary" onclick="app.saveStock()">Save Item</button>
                    </div>`;
            },

            saveStock: async () => {
                const data = { name: document.getElementById('mName').value, batch: document.getElementById('mBatch').value, qty: parseInt(document.getElementById('mQty').value), price: parseFloat(document.getElementById('mPrice').value), expiry: document.getElementById('mExpiry').value };
                try { await API.post('inventory', data); closeModal(); app.showToast('Stock updated'); await app.loadPage('inventory'); }
                catch (e) { app.showToast('Failed to update stock', 'error'); }
            },

            renderPurchase: (con, title) => {
                title.innerText = 'Purchase Orders';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>📦 Supplier Purchase Orders</h3>
                        <div class="table-wrapper">
                            <table><thead><tr><th>PO Number</th><th>Supplier</th><th>Item</th><th>Qty</th><th>Status</th></tr></thead>
                            <tbody>
                                <tr><td>PO-3301</td><td>Sun Pharma India</td><td>Amoxicillin 500mg</td><td>500 tabs</td><td><span class="status-badge badge-good">Delivered</span></td></tr>
                                <tr><td>PO-3302</td><td>AstraZeneca India</td><td>Lipitor 10mg</td><td>200 tabs</td><td><span class="status-badge badge-low">Pending</span></td></tr>
                            </tbody></table>
                        </div>
                    </div>`;
            },

            renderExpiry: (con, title) => {
                title.innerText = 'Expiry Alerts';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>⚠️ Expiring Batches</h3>
                        <div class="table-wrapper">
                            <table><thead><tr><th>Medicine</th><th>Batch #</th><th>Expiry Date</th><th>Action</th></tr></thead>
                            <tbody>
                                <tr><td>Crocin 650mg</td><td>CR-882</td><td>2026-06-15</td><td><span class="status-badge badge-low" style="background:#fef2f2; color:#b91c1c;">Expiring Soon</span></td></tr>
                            </tbody></table>
                        </div>
                    </div>`;
            },

            renderReports: (con, title) => {
                title.innerText = 'Pharmacy Reports';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>📊 Sales & Inventory Reports</h3>
                        <div style="height: 300px; margin-top: 24px; display: flex; align-items: center; justify-content: center; background: #fafafa; border-radius: 16px; border: 1px dashed #d1fae5; color: #047857;">
                            <i class="fas fa-chart-pie" style="font-size: 2rem; margin-right: 12px;"></i> Visual Analytics and sales volume charts will display here.
                        </div>
                    </div>`;
            },

            renderSettings: (con, title) => {
                title.innerText = 'Pharmacy Preferences';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>⚙️ Pharmacy Settings</h3>
                        <div class="form-field" style="margin-top: 16px;"><label>Currency</label><input class="form-input" value="Indian Rupee (₹)" readonly></div>
                        <div class="form-field"><label>Low Stock Warning Threshold</label><input class="form-input" type="number" value="20"></div>
                        <button class="btn-primary" onclick="app.showToast('Settings saved!', 'success')">Save Changes</button>
                    </div>`;
            },

             renderBilling: (con, title) => {
                title.innerText = 'New Billing';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>Generate Invoice</h3></div>
                    <div class="form-field"><label>Select Medicine</label><select id="bMed" class="form-input">${app.data.inventory.map(m => `<option value="${m.id}|${m.price}">${m.name} (₹${m.price})</option>`).join('')}</select></div>
                    <div class="form-field"><label>Quantity</label><input id="bQty" type="number" value="1" class="form-input"></div>
                    <button class="btn-primary" onclick="app.processBill()">Generate Bill</button>
                </div>`;
            },

            processBill: async () => {
                const [mId, price] = document.getElementById('bMed').value.split('|');
                const qty = parseInt(document.getElementById('bQty').value);
                const data = { items: [{ medicineId: mId, quantity: qty }], amount: price * qty, date: new Date().toISOString().slice(0,10) };
                try { await API.post('billing', data); app.showToast('Invoice generated'); await app.loadPage('dashboard'); }
                catch (e) { app.showToast('Billing failed', 'error'); }
            },

            renderSuppliers: (con, title) => {
                title.innerText = 'Suppliers';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>Active Suppliers</h3></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Name</th><th>Contact</th><th>Email</th></tr></thead>
                        <tbody>${app.data.suppliers.map(s => `<tr><td>${s.name}</td><td>${s.phone}</td><td>${s.email}</td></tr>`).join('')}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            openModal: (html) => {
                const root = document.getElementById('modalRoot');
                root.innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal-window" onclick="event.stopPropagation()">${html}</div></div>`;
                root.style.display = 'flex';
            }
        };

        window.loadPage = app.loadPage;
        window.closeModal = () => document.getElementById('modalRoot').style.display = 'none';
        window.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
