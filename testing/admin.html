<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicCare Pro · Admin UI (like attached)</title>
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f4f7fc;
            color: #1e293b;
            overflow-x: hidden;
        }

        /* custom scroll (like image but refined) */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #eef2f6;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(145deg, #2a4cd0, #b13e9e);
            border-radius: 20px;
        }

        /* subtle floating gradient background (matches image mood) */
        .bg-soft {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 20% 30%, rgba(90, 119, 255, 0.03) 0%, transparent 30%),
                        radial-gradient(circle at 80% 70%, rgba(210, 80, 180, 0.03) 0%, transparent 35%);
            z-index: -2;
        }

        /* dashboard flex */
        .dashboard {
            display: flex;
            min-height: 100vh;
            position: relative;
        }

        /* ===== SIDEBAR (exactly matching attached style: white, smooth) ===== */
        .sidebar {
            width: 280px;
            background: white;
            box-shadow: 6px 0 24px rgba(0, 20, 50, 0.06);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 10;
            border-right: 1px solid #e9edf4;
        }

        .sidebar-header {
            padding: 1.8rem 1.5rem 1.2rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #edf2f7;
        }
        .sidebar-header i {
            font-size: 2.1rem;
            color: #1e3c8f;
            background: linear-gradient(140deg, #2445b0, #b03e9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar-header h3 {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(140deg, #2445b0, #b03e9c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.3px;
        }

        /* user card (exactly like image: Emily Davis) */
        .user-info {
            padding: 1.5rem 1.5rem;
            background: white;
            border-bottom: 1px solid #eef2f6;
        }
        .user-info h4 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0b1b3a;
            margin-bottom: 0.4rem;
        }
        .user-info p {
            font-size: 0.9rem;
            color: #4a5b75;
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0.4rem 0;
        }
        .user-info i {
            color: #4158d0;
            width: 18px;
            font-size: 0.95rem;
        }
        .user-role-badge {
            display: inline-block;
            padding: 0.3rem 1.2rem;
            background: linear-gradient(145deg, #4158D0, #b03e9c);
            color: white;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-top: 0.5rem;
            border: 1px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 10px rgba(65,88,208,0.25);
        }

        /* navigation */
        .sidebar-nav {
            flex: 1;
            padding: 1.2rem 0;
            overflow-y: auto;
        }
        .sidebar-nav ul {
            list-style: none;
        }
        .sidebar-nav li {
            padding: 0.75rem 1.5rem;
            margin: 0.2rem 1rem;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            color: #4a5a72;
            font-weight: 500;
            font-size: 0.95rem;
            position: relative;
        }
        .sidebar-nav li i {
            width: 22px;
            color: #7c8ba0;
            font-size: 1.2rem;
            transition: 0.15s;
        }
        .sidebar-nav li:hover {
            background: #f2f6fd;
            color: #2c3e8f;
            padding-left: 2rem;
        }
        .sidebar-nav li:hover i {
            color: #4158d0;
        }
        .sidebar-nav li.active {
            background: linear-gradient(90deg, #e9edfc, transparent);
            color: #4158d0;
            font-weight: 600;
        }
        .sidebar-nav li.active i {
            color: #4158d0;
        }

        /* logout button */
        .logout-btn {
            margin: 1rem 1.5rem 2rem 1.5rem;
            padding: 0.9rem;
            background: #f2f5fa;
            border: none;
            border-radius: 16px;
            color: #4b5b73;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            border: 1px solid #dde3ec;
        }
        .logout-btn:hover {
            background: #e74c4c;
            color: white;
            border-color: #e74c4c;
            box-shadow: 0 8px 18px #e74c4c40;
        }

        /* main content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 2rem 2.2rem;
        }

        /* top bar */
        .top-bar {
            background: white;
            border-radius: 24px;
            padding: 1.1rem 2rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 6px 22px rgba(0,0,0,0.02);
            border: 1px solid #e3e9f2;
        }
        .page-title h2 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(145deg, #2642b0, #ac3595);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .date-display {
            background: #f2f7ff;
            padding: 0.5rem 2rem;
            border-radius: 40px;
            font-weight: 500;
            color: #2a3f8c;
            border: 1px solid #dbe2f0;
            font-size: 0.95rem;
        }

        /* dashboard grid */
        .dashboard-content {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.8rem;
        }

        /* stat cards */
        .stat-card {
            background: white;
            border-radius: 26px;
            padding: 1.7rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.4rem;
            border: 1px solid #e2eaf1;
            transition: 0.15s;
            box-shadow: 0 10px 18px -12px rgba(60,80,150,0.12);
        }
        .stat-card:hover {
            transform: translateY(-4px);
            border-color: #cbd5f0;
            box-shadow: 0 24px 30px -16px #4158d050;
        }
        .stat-icon {
            width: 64px;
            height: 64px;
            background: #f1f5fe;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            color: #2b48c0;
        }
        .stat-info h3 {
            font-size: 0.95rem;
            color: #566b84;
            margin-bottom: 0.4rem;
            font-weight: 500;
        }
        .stat-info p {
            font-size: 2.2rem;
            font-weight: 700;
            color: #162b5e;
            line-height: 1.2;
        }

        /* table container (multi‑use) */
        .table-container {
            grid-column: span 4;
            background: white;
            border-radius: 28px;
            padding: 1.8rem 1.8rem 2rem;
            border: 1px solid #e2ecf5;
            box-shadow: 0 10px 20px -12px #1e2b4a10;
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }
        .table-header h3 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #11213e;
        }
        .add-btn {
            padding: 0.7rem 1.6rem;
            background: linear-gradient(145deg, #4158D0, #aa3c97);
            color: white;
            border: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: 0.2px;
            box-shadow: 0 8px 16px -6px #4158d090;
        }
        .add-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 22px -4px #4158d0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            text-align: left;
            padding: 0.9rem 0.6rem 0.9rem 0;
            color: #50607c;
            font-weight: 600;
            font-size: 0.85rem;
            border-bottom: 2px solid #e2eaf1;
        }
        td {
            padding: 1rem 0.6rem 1rem 0;
            border-bottom: 1px solid #edf2f8;
            color: #202f4a;
            font-size: 0.95rem;
        }
        .badge {
            padding: 0.3rem 1.1rem;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }
        .badge-success {
            background: #ddf4e4;
            color: #0d5e2e;
        }
        .badge-warning {
            background: #fff1cf;
            color: #8f5700;
        }
        .badge-info {
            background: #e1e9ff;
            color: #1f3f9e;
        }
        .action-icons {
            display: flex;
            gap: 1.2rem;
        }
        .action-icons i {
            cursor: pointer;
            color: #8699bb;
            transition: 0.2s;
            font-size: 1.15rem;
        }
        .action-icons i:hover {
            color: #4158D0;
        }
        .action-icons .delete:hover {
            color: #d14;
        }

        /* modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,10,30,0.5);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            border-radius: 36px;
            padding: 2.4rem;
            width: 90%;
            max-width: 500px;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalPop 0.2s ease;
            border: 1px solid #ffffff50;
        }
        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal h3 {
            font-size: 2rem;
            margin-bottom: 1.8rem;
            background: linear-gradient(145deg, #4158D0, #ba45a6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .modal .form-group {
            margin-bottom: 1.4rem;
        }
        .modal .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: #1e2b45;
            font-weight: 600;
        }
        .modal .form-group input,
        .modal .form-group select {
            width: 100%;
            padding: 0.85rem 1.2rem;
            border: 2px solid #e2e9f2;
            border-radius: 20px;
            font-family: inherit;
            transition: 0.2s;
        }
        .modal .form-group input:focus,
        .modal .form-group select:focus {
            border-color: #4158D0;
            outline: none;
            box-shadow: 0 0 0 4px #4158d020;
        }
        .modal-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }
        .modal-actions button {
            flex: 1;
            padding: 0.9rem;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }
        .save-btn {
            background: linear-gradient(145deg, #4158D0, #ba45a6);
            color: white;
        }
        .cancel-btn {
            background: #f0f4fb;
            color: #41508c;
        }

        /* toast */
        .toast {
            position: fixed;
            bottom: 2rem; right: 2rem;
            background: white;
            padding: 1rem 2.2rem;
            border-radius: 60px;
            box-shadow: 0 16px 40px rgba(0,20,60,0.2);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transform: translateX(400px);
            transition: 0.3s;
            z-index: 1100;
            border-left: 5px solid;
        }
        .toast.show { transform: translateX(0); }
        .toast.success { border-left-color: #12a561; }
        .toast.error { border-left-color: #e44; }
        .toast i { font-size: 1.3rem; }
        .toast.success i { color: #12a561; }
        .toast.error i { color: #e44; }

        /* small tweaks */
        .text-center { text-align: center; }
        @media (max-width: 1000px) {
            .dashboard-content { grid-template-columns: repeat(2,1fr); }
        }
        @media (max-width: 700px) {
            .sidebar { width: 80px; }
            .sidebar-header h3, .user-info p, .user-role-badge, .sidebar-nav li span, .logout-btn span {
                display: none;
            }
            .main-content { margin-left: 80px; }
        }
    </style>
</head>
<body>
<div class="bg-soft"></div>

<div class="dashboard">
    <!-- SIDEBAR exactly matching attached description -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-clinic-medical"></i>
            <h3>ClinicCare Pro</h3>
        </div>

        <!-- user info (exactly as image: Emily Davis) -->
        <div class="user-info">
            <h4>Emily Davis</h4>
            <p><i class="fas fa-envelope"></i> emily.d@example.com</p>
            <p><i class="fas fa-phone-alt"></i> +1 (415) 555-9876</p>
            <span class="user-role-badge">Patient · ID: PT2390</span>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="active" onclick="loadContent('dashboard')"><i class="fas fa-chart-line"></i><span>Dashboard</span></li>
                <li onclick="loadContent('users')"><i class="fas fa-users"></i><span>Users</span></li>
                <li onclick="loadContent('doctors')"><i class="fas fa-user-md"></i><span>Doctors</span></li>
                <li onclick="loadContent('patients')"><i class="fas fa-heartbeat"></i><span>Patients</span></li>
                <li onclick="loadContent('appointments')"><i class="fas fa-calendar-check"></i><span>Appointments</span></li>
                <li onclick="loadContent('departments')"><i class="fas fa-building"></i><span>Departments</span></li>
                <li onclick="loadContent('reports')"><i class="fas fa-chart-pie"></i><span>Reports</span></li>
                <li onclick="loadContent('settings')"><i class="fas fa-cog"></i><span>Settings</span></li>
            </ul>
        </nav>

        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></button>
    </div>

    <!-- MAIN -->
    <div class="main-content">
        <div class="top-bar">
            <div class="page-title"><h2 id="pageTitle">Dashboard</h2></div>
            <div class="date-display" id="currentDate"></div>
        </div>

        <div class="dashboard-content" id="dashboardContent"></div>
    </div>
</div>

<!-- Modal overlay -->
<div id="modalOverlay" class="modal-overlay" style="display: none;"><div class="modal" id="modal"></div></div>

<!-- Toast -->
<div class="toast" id="toast"><i class="fas" id="toastIcon"></i><span id="toastMessage"></span></div>

<script>
    (function() {
        // ---------- localStorage data seeded exactly as in description (Emily Davis etc) ----------
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let appointments = JSON.parse(localStorage.getItem('appointments')) || [];
        let departments = JSON.parse(localStorage.getItem('departments')) || [];

        if (users.length === 0) {
            users = [
                { id: 'PT2390', name: 'Emily Davis', email: 'emily.d@example.com', phone: '+1 (415) 555-9876', role: 'patient', status: 'active', joined: '2024-02-10' },
                { id: 'D1001', name: 'Dr. John Smith', email: 'john.smith@clinic.com', phone: '+1 555-0123', role: 'doctor', specialization: 'Cardiology', status: 'active', joined: '2023-06-01' },
                { id: 'D1002', name: 'Dr. Sarah Wilson', email: 'sarah.wilson@clinic.com', phone: '+1 555-0124', role: 'doctor', specialization: 'Neurology', status: 'active', joined: '2022-09-12' },
                { id: 'D1003', name: 'Dr. Michael Brown', email: 'michael.brown@clinic.com', phone: '+1 555-0125', role: 'doctor', specialization: 'Pediatrics', status: 'active', joined: '2023-11-04' },
                { id: 'PT1290', name: 'Robert Wilson', email: 'r.wilson@email.com', phone: '+1 555-2233', role: 'patient', status: 'active', joined: '2024-01-05' },
                { id: 'ADMIN01', name: 'Admin User', email: 'admin@cliniccare.com', phone: '+1 555-0001', role: 'admin', status: 'active', joined: '2023-01-01' }
            ];
            localStorage.setItem('users', JSON.stringify(users));
        }

        if (appointments.length === 0) {
            appointments = [
                { id: 'A1001', patient: 'Emily Davis', doctor: 'Dr. John Smith', date: '2025-03-20', time: '10:30', status: 'confirmed' },
                { id: 'A1002', patient: 'Emily Davis', doctor: 'Dr. Sarah Wilson', date: '2025-03-22', time: '14:00', status: 'pending' },
                { id: 'A1003', patient: 'Emily Davis', doctor: 'Dr. Michael Brown', date: '2025-03-25', time: '09:15', status: 'confirmed' },
                { id: 'A1004', patient: 'Robert Wilson', doctor: 'Dr. John Smith', date: '2025-03-21', time: '11:00', status: 'confirmed' }
            ];
            localStorage.setItem('appointments', JSON.stringify(appointments));
        }

        if (departments.length === 0) {
            departments = [
                { id: 'D1', name: 'Cardiology', head: 'Dr. John Smith', staff: 8, patients: 1240 },
                { id: 'D2', name: 'Neurology', head: 'Dr. Sarah Wilson', staff: 6, patients: 890 },
                { id: 'D3', name: 'Pediatrics', head: 'Dr. Michael Brown', staff: 7, patients: 1570 }
            ];
            localStorage.setItem('departments', JSON.stringify(departments));
        }

        // ----- current date -----
        function updateDate() {
            const d = new Date();
            document.getElementById('currentDate').innerText = d.toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
        }
        updateDate(); setInterval(updateDate, 60000);

        // ----- toast helper -----
        function showToast(msg, type='success') {
            const toast = document.getElementById('toast');
            document.getElementById('toastIcon').className = `fas ${type==='success'?'fa-check-circle':'fa-exclamation-circle'}`;
            document.getElementById('toastMessage').innerText = msg;
            toast.classList.add('show', type);
            setTimeout(() => toast.classList.remove('show'), 2800);
        }

        // ----- modal -----
        window.showModal = (content) => {
            document.getElementById('modalOverlay').style.display = 'flex';
            document.getElementById('modal').innerHTML = content;
        };
        window.closeModal = () => document.getElementById('modalOverlay').style.display = 'none';

        // ----- add user modal -----
        window.addUser = function() {
            showModal(`
                <h3>➕ Add New User</h3>
                <div class="form-group"><label>Full Name</label><input type="text" id="userName" placeholder="e.g. Emily Davis"></div>
                <div class="form-group"><label>Email</label><input type="email" id="userEmail" placeholder="email@domain.com"></div>
                <div class="form-group"><label>Phone</label><input type="tel" id="userPhone" placeholder="+1 (415) 555-9876"></div>
                <div class="form-group"><label>Role</label>
                    <select id="userRole"><option value="doctor">Doctor</option><option value="patient">Patient</option><option value="admin">Admin</option></select>
                </div>
                <div class="form-group" id="specGroup"><label>Specialization (doctor)</label><input type="text" id="userSpecialization" placeholder="e.g. Cardiology"></div>
                <div class="modal-actions"><button class="save-btn" onclick="saveUser()">Save User</button><button class="cancel-btn" onclick="closeModal()">Cancel</button></div>
            `);
        };

        window.saveUser = function() {
            const users = JSON.parse(localStorage.getItem('users'));
            const newUser = {
                id: 'U' + Math.floor(1000+Math.random()*9000),
                name: document.getElementById('userName')?.value || 'No Name',
                email: document.getElementById('userEmail')?.value || 'no@mail.com',
                phone: document.getElementById('userPhone')?.value || '',
                role: document.getElementById('userRole')?.value || 'patient',
                specialization: document.getElementById('userSpecialization')?.value || '',
                status: 'active',
                joined: new Date().toISOString().slice(0,10)
            };
            users.push(newUser);
            localStorage.setItem('users', JSON.stringify(users));
            closeModal(); showToast('User added');
            loadContent('users');
        };

        window.editUser = function(uid) {
            const users = JSON.parse(localStorage.getItem('users'));
            const u = users.find(x => x.id === uid);
            if (!u) return;
            showModal(`
                <h3>✏️ Edit User</h3>
                <div class="form-group"><label>Name</label><input type="text" id="editName" value="${u.name}"></div>
                <div class="form-group"><label>Email</label><input id="editEmail" value="${u.email}"></div>
                <div class="form-group"><label>Phone</label><input id="editPhone" value="${u.phone}"></div>
                <div class="form-group"><label>Role</label>
                    <select id="editRole"><option value="doctor" ${u.role==='doctor'?'selected':''}>Doctor</option><option value="patient" ${u.role==='patient'?'selected':''}>Patient</option><option value="admin" ${u.role==='admin'?'selected':''}>Admin</option></select>
                </div>
                <div class="form-group"><label>Status</label>
                    <select id="editStatus"><option value="active" ${u.status==='active'?'selected':''}>Active</option><option value="inactive" ${u.status==='inactive'?'selected':''}>Inactive</option></select>
                </div>
                <div class="modal-actions"><button class="save-btn" onclick="updateUser('${uid}')">Update</button><button class="cancel-btn" onclick="closeModal()">Cancel</button></div>
            `);
        };

        window.updateUser = function(uid) {
            const users = JSON.parse(localStorage.getItem('users'));
            const idx = users.findIndex(x => x.id === uid);
            if (idx !== -1) {
                users[idx].name = document.getElementById('editName').value;
                users[idx].email = document.getElementById('editEmail').value;
                users[idx].phone = document.getElementById('editPhone').value;
                users[idx].role = document.getElementById('editRole').value;
                users[idx].status = document.getElementById('editStatus').value;
                localStorage.setItem('users', JSON.stringify(users));
                closeModal(); showToast('User updated');
                loadContent('users');
            }
        };

        window.deleteUser = function(uid) {
            if (!confirm('Delete user?')) return;
            const users = JSON.parse(localStorage.getItem('users')).filter(u => u.id !== uid);
            localStorage.setItem('users', JSON.stringify(users));
            showToast('User deleted', 'error');
            loadContent('users');
        };

        window.viewAppointment = function(aid) {
            const apps = JSON.parse(localStorage.getItem('appointments'));
            const a = apps.find(x => x.id === aid);
            if (!a) return;
            showModal(`
                <h3>📋 Appointment</h3>
                <div class="form-group"><label>Patient</label><input value="${a.patient}" readonly></div>
                <div class="form-group"><label>Doctor</label><input value="${a.doctor}" readonly></div>
                <div class="form-group"><label>Date/Time</label><input value="${a.date} ${a.time}" readonly></div>
                <div class="form-group"><label>Status</label><input value="${a.status}" readonly></div>
                <div class="modal-actions"><button class="cancel-btn" onclick="closeModal()">Close</button></div>
            `);
        };

        // ----- load content (section based) -----
        window.loadContent = function(section) {
            // active class
            document.querySelectorAll('.sidebar-nav li').forEach(li => li.classList.remove('active'));
            event?.currentTarget?.classList.add('active');

            document.getElementById('pageTitle').innerText = section.charAt(0).toUpperCase() + section.slice(1);
            const content = document.getElementById('dashboardContent');
            const users = JSON.parse(localStorage.getItem('users'));
            const apps = JSON.parse(localStorage.getItem('appointments'));
            const depts = JSON.parse(localStorage.getItem('departments'));

            if (section === 'dashboard') {
                content.innerHTML = `
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h3>Total Users</h3><p>${users.length}</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-md"></i></div><div class="stat-info"><h3>Doctors</h3><p>${users.filter(u=>u.role==='doctor').length}</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-heartbeat"></i></div><div class="stat-info"><h3>Patients</h3><p>${users.filter(u=>u.role==='patient').length}</p></div></div>
                    <div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-info"><h3>Appointments</h3><p>${apps.length}</p></div></div>

                    <div class="table-container"><div class="table-header"><h3>Recent Users</h3></div>
                    <table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>
                    ${users.slice(0,5).map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td><span class="badge badge-info">${u.role}</span></td><td><span class="badge badge-success">${u.status}</span></td></tr>`).join('')}
                    </tbody></table></div>

                    <div class="table-container"><div class="table-header"><h3>Department Overview</h3></div>
                    <table><thead><tr><th>Dept</th><th>Head</th><th>Staff</th><th>Patients</th></tr></thead><tbody>
                    ${depts.map(d=>`<tr><td>${d.name}</td><td>${d.head}</td><td>${d.staff}</td><td>${d.patients}</td></tr>`).join('')}
                    </tbody></table></div>
                `;
            }
            else if (section === 'users') {
                content.innerHTML = `<div class="table-container"><div class="table-header"><h3>User Management</h3><button class="add-btn" onclick="addUser()"><i class="fas fa-plus"></i> Add User</button></div>
                <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Role</th><th>Status</th><th>Actions</th></tr></thead><tbody>
                ${users.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td><td>${u.phone}</td><td><span class="badge badge-info">${u.role}</span></td><td><span class="badge badge-success">${u.status}</span></td>
                <td><div class="action-icons"><i class="fas fa-edit" onclick="editUser('${u.id}')"></i><i class="fas fa-trash delete" onclick="deleteUser('${u.id}')"></i></div></td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if (section === 'doctors') {
                const docs = users.filter(u=>u.role==='doctor');
                content.innerHTML = `<div class="table-container"><div class="table-header"><h3>Doctors Directory</h3><button class="add-btn" onclick="addUser()"><i class="fas fa-plus"></i> Add Doctor</button></div>
                <table><thead><tr><th>Name</th><th>Specialty</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead><tbody>
                ${docs.map(d=>`<tr><td>${d.name}</td><td>${d.specialization||'—'}</td><td>${d.email}</td><td>${d.phone}</td><td><span class="badge badge-success">${d.status}</span></td>
                <td><div class="action-icons"><i class="fas fa-edit" onclick="editUser('${d.id}')"></i><i class="fas fa-trash delete" onclick="deleteUser('${d.id}')"></i></div></td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if (section === 'patients') {
                const pts = users.filter(u=>u.role==='patient');
                content.innerHTML = `<div class="table-container"><div class="table-header"><h3>Patients Directory</h3><button class="add-btn" onclick="addUser()"><i class="fas fa-plus"></i> Add Patient</button></div>
                <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Joined</th><th>Status</th><th>Actions</th></tr></thead><tbody>
                ${pts.map(p=>`<tr><td>${p.name}</td><td>${p.email}</td><td>${p.phone}</td><td>${p.joined||''}</td><td><span class="badge badge-success">${p.status}</span></td>
                <td><div class="action-icons"><i class="fas fa-eye" onclick="viewPatient('${p.id}')"></i><i class="fas fa-edit" onclick="editUser('${p.id}')"></i></div></td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else if (section === 'appointments') {
                content.innerHTML = `<div class="table-container"><div class="table-header"><h3>All Appointments</h3></div>
                <table><thead><tr><th>Date</th><th>Doctor</th><th>Patient</th><th>Time</th><th>Status</th><th></th></tr></thead><tbody>
                ${apps.map(a=>`<tr><td>${a.date}</td><td>${a.doctor}</td><td>${a.patient}</td><td>${a.time}</td><td><span class="badge ${a.status==='confirmed'?'badge-success':'badge-warning'}">${a.status}</span></td>
                <td><div class="action-icons"><i class="fas fa-eye" onclick="viewAppointment('${a.id}')"></i></div></td></tr>`).join('')}
                </tbody></table></div>`;
            }
            else {
                content.innerHTML = `<div class="table-container"><div style="padding:3rem;text-align:center"><i class="fas fa-tools" style="font-size:4rem;color:#4158D0;"></i><h3 style="margin-top:1rem">Coming soon</h3></div></div>`;
            }
        };

        window.logout = function() { showToast('Logging out...'); setTimeout(()=>{},800); };

        // initial load
        loadContent('dashboard');
    })();
</script>
<!-- small stub for viewPatient (avoid errors) -->
<script> window.viewPatient = (id) => showToast('Patient view (demo)'); </script>
</body>
</html>
