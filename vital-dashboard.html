<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ClinicCare · Vital Monitoring</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root { --primary: #0ea5e9; --primary-dark: #0284c7; --bg: #f5f9ff; --text: #0a2540; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }
        .dashboard { display: flex; min-height: 100vh; }
        .main-panel { flex: 1; padding: 24px; transition: margin-left 0.3s; }
        @media (max-width: 1024px) { .main-panel { margin-left: 0 !important; padding: 16px; } }

        .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 28px; border-radius: 60px; box-shadow: 0 4px 14px rgba(0,20,50,0.04); margin-bottom: 28px; border: 1px solid #e6edfa; }
        .page-title { font-weight: 700; font-size: 1.6rem; background: linear-gradient(135deg, #075985, #0ea5e9); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .live-clock { background: #e0f2fe; padding: 7px 20px; border-radius: 40px; font-weight: 500; color: #0369a1; font-size: 0.8rem; }
        .menu-toggle { display: none; background: #0ea5e9; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; }
        @media (max-width: 1024px) { .menu-toggle { display: flex; align-items: center; justify-content: center; } .page-title { font-size: 1.2rem; } }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        @media (max-width: 768px) { .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        .stat-block { background: white; padding: 18px 22px; border-radius: 32px; border: 1px solid #e2edfc; box-shadow: 0 8px 18px -10px rgba(0,35,70,0.06); display: flex; align-items: center; gap: 18px; }
        .stat-icon { width: 56px; height: 56px; background: linear-gradient(120deg, #f0f9ff, #e0f2fe); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #0ea5e9; }
        .stat-info h4 { font-weight: 500; color: #64748b; font-size: 0.65rem; letter-spacing: 0.4px; margin-bottom: 4px; text-transform: uppercase; }
        .stat-info .figure { font-weight: 800; font-size: 1.8rem; color: #0f172a; line-height: 1.2; }

        .content-card { background: white; border-radius: 36px; padding: 24px 28px; border: 1px solid #e5edfc; box-shadow: 0 10px 24px -12px rgba(0,30,60,0.06); margin-bottom: 26px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .card-header h3 { font-weight: 700; font-size: 1.3rem; color: #0f172a; }

        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px 8px; font-weight: 600; font-size: 0.7rem; color: #64748b; text-transform: uppercase; border-bottom: 2px solid #e6edfc; }
        td { padding: 12px 8px; border-bottom: 1px solid #f1f5f9; color: #1a3154; font-size: 0.85rem; }
        
        .status-badge { padding: 5px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-normal { background: #f0fdf4; color: #166534; }
        .badge-warning { background: #fffbeb; color: #92400e; }
        .badge-critical { background: #fef2f2; color: #991b1b; }

        .btn-primary { background: linear-gradient(135deg, #0ea5e9, #0284c7); color: white; border: none; padding: 10px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-secondary { background: #f0f9ff; color: #0369a1; border: none; padding: 8px 18px; border-radius: 40px; font-weight: 600; cursor: pointer; }
        .btn-outline { background: transparent; border: 1.5px solid #e2e8f0; padding: 8px 18px; border-radius: 40px; cursor: pointer; }

        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-window { background: white; border-radius: 40px; padding: 32px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.2); }
        .form-field { margin-bottom: 18px; }
        .form-field label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 8px; color: #4b5563; }
        .form-input { width: 100%; padding: 12px 20px; border: 1.5px solid #e5e7eb; border-radius: 16px; font-family: inherit; font-size: 0.9rem; }

        /* Toast */
        .toast-notification { position: fixed; bottom: 30px; right: 30px; background: #1f2937; color: white; padding: 16px 28px; border-radius: 20px; display: flex; align-items: center; gap: 12px; transform: translateY(150%); transition: 0.4s cubic-bezier(0.17, 0.84, 0.44, 1); z-index: 3000; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .toast-notification.show { transform: translateY(0); }
        .toast-success { border-left: 4px solid #10b981; }
        .toast-error { border-left: 4px solid #ef4444; }
    </style>
</head>

<body data-sidebar-role="vital">
    <div class="dashboard">
        <!-- SIDEBAR WILL BE INJECTED HERE -->

        <div class="main-panel">
            <div class="header-bar">
                <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                <div class="page-title" id="headerTitle">Vital Monitoring</div>
                <div class="live-clock" id="desktopClock">--:--</div>
            </div>
            <div id="contentArea"></div>
        </div>
    </div>

    <div id="modalRoot" style="display:none;"></div>
    <div class="toast-notification" id="toastMsg"><i class="fas" id="toastIcon"></i><span id="toastText"></span></div>

    <script src="Frontend/assets/js/api.js"></script>
    <script>
        const app = {
            currentUser: null,
            data: { vitals: [], patients: [] },

            init: async () => {
                app.currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const token = localStorage.getItem('authToken');
                if (!app.currentUser || !token || app.currentUser.role !== 'vital') {
                    window.location.href = 'auth.html';
                    return;
                }
                app.setupSidebar();
                app.startClock();
                await app.loadPage('dashboard');
            },

            setupSidebar: () => {
                fetch('Frontend/components/sidebar.html')
                    .then(r => r.text())
                    .then(html => {
                        const div = document.createElement('div');
                        div.innerHTML = html;
                        const script = div.querySelector('script');
                        if (script) {
                            const newScript = document.createElement('script');
                            newScript.textContent = script.textContent;
                            document.body.appendChild(newScript);
                        }
                    });
            },

            startClock: () => {
                const update = () => {
                    const clock = document.getElementById('desktopClock');
                    if (clock) clock.innerText = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                };
                update(); setInterval(update, 60000);
            },

            showToast: (msg, type = 'success') => {
                const toast = document.getElementById('toastMsg');
                document.getElementById('toastIcon').className = 'fas ' + (type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle');
                document.getElementById('toastText').innerText = msg;
                toast.className = `toast-notification toast-${type} show`;
                setTimeout(() => toast.classList.remove('show'), 3000);
            },

            loadData: async () => {
                try {
                    const [vitals, usersData] = await Promise.all([
                        API.get('vitals'),
                        API.get('users')
                    ]);
                    app.data.vitals = vitals;
                    app.data.patients = usersData.users.filter(u => u.role === 'patient');
                } catch (e) { 
                    console.error('Vitals Load Error:', e);
                    app.data.vitals = [];
                    app.showToast('Data load failed', 'error'); 
                }
            },

            loadPage: async (page) => {
                await app.loadData();
                const container = document.getElementById('contentArea');
                const title = document.getElementById('headerTitle');
                window.currentDashboardPage = page;
                if (window.updateSharedSidebarState) window.updateSharedSidebarState(page);

                if (page === 'dashboard') app.renderDashboard(container, title);
                else if (page === 'vitalHistory') app.renderHistory(container, title);
                else if (page === 'vitals-add') app.renderAddVitals(container, title);
                else if (page === 'patients') app.renderPatients(container, title);
                else if (page === 'patients-add') app.renderAddPatient(container, title);
                else if (page === 'alerts') app.renderAlerts(container, title);
                else if (page === 'trends') app.renderTrends(container, title);
                else if (page === 'devices') app.renderDevices(container, title);
                else if (page === 'settings') app.renderSettings(container, title);
            },

            renderDashboard: (con, title) => {
                title.innerText = 'Monitoring Overview';
                const total = app.data.vitals.length;
                const critical = app.data.vitals.filter(v => v.status === 'Critical').length;
                const warning = app.data.vitals.filter(v => v.status === 'Warning').length;
                const normal = total - critical - warning;

                con.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-heartbeat"></i></div><div class="stat-info"><h4>Readings</h4><div class="figure">${total}</div></div></div>
                    <div class="stat-block"><div class="stat-icon" style="color:#ef4444;"><i class="fas fa-exclamation-circle"></i></div><div class="stat-info"><h4>Critical</h4><div class="figure">${critical}</div></div></div>
                    <div class="stat-block"><div class="stat-icon" style="color:#f59e0b;"><i class="fas fa-exclamation-triangle"></i></div><div class="stat-info"><h4>Warning</h4><div class="figure">${warning}</div></div></div>
                    <div class="stat-block"><div class="stat-icon" style="color:#10b981;"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h4>Normal</h4><div class="figure">${normal}</div></div></div>
                </div>
                <div class="content-card">
                    <div class="card-header"><h3>Latest Readings</h3><button class="btn-primary" onclick="app.loadPage('vitals-add')">Record Vitals</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Patient</th><th>Date</th><th>BP</th><th>Pulse</th><th>Temp</th><th>Status</th></tr></thead>
                        <tbody>${app.data.vitals.slice(0, 5).map(v => `<tr><td>${v.patientName}</td><td>${v.date}</td><td>${v.bpSystolic}/${v.bpDiastolic}</td><td>${v.pulse}</td><td>${v.temperature}°F</td><td><span class="status-badge ${v.status === 'Normal' ? 'badge-normal' : v.status === 'Warning' ? 'badge-warning' : 'badge-critical'}">${v.status}</span></td></tr>`).join('') || '<tr><td colspan="6">No recent readings</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderAddVitals: (container, title) => {
                title.innerText = 'Record Vitals';
                container.innerHTML = `
                    <div class="content-card" style="width: 100%; padding: 32px; border-radius: 24px; box-shadow: var(--shadow);">
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 1.4rem; font-weight: 700; color: #0a2540;">💓 Record Patient Vitals</h3>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Log a new blood pressure, pulse, and temperature reading.</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-field">
                                <label>Patient</label>
                                <select id="vPat" class="form-input">
                                    ${app.data.patients.map(p => `<option value="${p.id}|${p.name}">${p.name}</option>`).join('')}
                                </select>
                            </div>
                            <div class="form-field">
                                <label>BP (Systolic / Diastolic)</label>
                                <div style="display:flex;gap:10px;">
                                    <input id="vBPS" placeholder="120" class="form-input">
                                    <input id="vBPD" placeholder="80" class="form-input">
                                </div>
                            </div>
                            <div class="form-field">
                                <label>Pulse (bpm)</label>
                                <input id="vPulse" placeholder="72" class="form-input">
                            </div>
                            <div class="form-field">
                                <label>Temperature (°F)</label>
                                <input id="vTemp" placeholder="98.6" class="form-input">
                            </div>
                        </div>
                    </div>
                    <div class="content-card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: 24px; position: sticky; bottom: 0; background: white; z-index: 100;">
                        <button class="btn-outline" onclick="app.loadPage('vitalHistory')">Cancel</button>
                        <button class="btn-primary" onclick="app.saveVitals()">Save Reading</button>
                    </div>`;
            },

            saveVitals: async () => {
                const [pId, pName] = document.getElementById('vPat').value.split('|');
                const bps = parseInt(document.getElementById('vBPS').value);
                const bpd = parseInt(document.getElementById('vBPD').value);
                let status = 'Normal';
                if (bps > 140 || bpd > 90) status = 'Critical';
                else if (bps > 130 || bpd > 85) status = 'Warning';

                const data = { patientId: pId, patientName: pName, date: new Date().toISOString().slice(0,10), bpSystolic: bps, bpDiastolic: bpd, pulse: document.getElementById('vPulse').value, temperature: document.getElementById('vTemp').value, status };
                try { await API.post('vitals', data); closeModal(); app.showToast('Vitals recorded'); await app.loadPage('vitalHistory'); }
                catch (e) { app.showToast('Recording failed', 'error'); }
            },

            renderHistory: (con, title) => {
                title.innerText = 'Vital History';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>All Vitals Logged</h3><button class="btn-primary" onclick="app.loadPage('vitals-add')">Record Vitals</button></div>
                    <div class="table-wrapper"><table><thead><tr><th>Date</th><th>Patient</th><th>BP</th><th>Pulse</th><th>Temp</th><th>Status</th></tr></thead>
                    <tbody>${app.data.vitals.map(v => `<tr><td>${v.date}</td><td>${v.patientName}</td><td>${v.bpSystolic}/${v.bpDiastolic}</td><td>${v.pulse}</td><td>${v.temperature}°F</td><td><span class="status-badge ${v.status === 'Normal' ? 'badge-normal' : v.status === 'Warning' ? 'badge-warning' : 'badge-critical'}">${v.status}</span></td></tr>`).join('')}</tbody></table></div></div>`;
            },

            renderPatients: (con, title) => {
                title.innerText = 'Patient List';
                con.innerHTML = `<div class="content-card">
                    <div class="card-header"><h3>Patients Directory</h3><button class="btn-primary" onclick="app.loadPage('patients-add')">Add Patient</button></div>
                    <div class="table-wrapper"><table><thead><tr><th>Name</th><th>Age</th><th>Contact</th></tr></thead>
                    <tbody>${app.data.patients.map(p => `<tr><td>${p.name}</td><td>${p.age || '—'}</td><td>${p.phone || '—'}</td></tr>`).join('')}</tbody></table></div></div>`;
            },

            renderAddPatient: (container, title) => {
                title.innerText = 'Add Patient';
                container.innerHTML = `
                    <div class="content-card" style="width: 100%; padding: 32px; border-radius: 24px; box-shadow: var(--shadow);">
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 1.4rem; font-weight: 700; color: #0a2540;">➕ Register New Patient</h3>
                            <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Fill in the profile details to add a patient to the directory.</p>
                        </div>
                        <div style="display: flex; flex-direction: column; gap: 16px;">
                            <div class="form-field">
                                <label>Full Name</label>
                                <input id="pName" class="form-input" placeholder="e.g. John Doe">
                            </div>
                            <div class="form-field">
                                <label>Email Address</label>
                                <input id="pEmail" type="email" class="form-input" placeholder="e.g. john@example.com">
                            </div>
                            <div class="form-field">
                                <label>Phone Number</label>
                                <input id="pPhone" class="form-input" placeholder="e.g. +91 9876543210">
                            </div>
                        </div>
                    </div>
                    <div class="content-card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: 24px; position: sticky; bottom: 0; background: white; z-index: 100;">
                        <button class="btn-outline" onclick="app.loadPage('patients')">Cancel</button>
                        <button class="btn-primary" onclick="app.savePatient()">Register</button>
                    </div>`;
            },

            savePatient: async () => {
                const data = { name: document.getElementById('pName').value, email: document.getElementById('pEmail').value, phone: document.getElementById('pPhone').value, role: 'patient', password: 'password123' };
                try { 
                    await API.post('signup', data); 
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Registered new patient: ${data.name}` });
                    app.showToast('Patient registered'); await app.loadPage('patients'); 
                }
                catch (e) { app.showToast('Registration failed', 'error'); }
            },

            renderAlerts: (con, title) => {
                title.innerText = 'System Alerts';
                const criticalReadings = app.data.vitals.filter(v => v.status === 'Critical');
                con.innerHTML = `
                    <div class="content-card">
                        <h3>⚠️ Critical Health Alerts</h3>
                        <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 12px;">
                            ${criticalReadings.map(v => `
                                <div style="padding: 16px; border-radius: 16px; background: #fef2f2; border: 1.5px solid #fee2e2; display: flex; align-items: center; justify-content: space-between;">
                                    <div>
                                        <h4 style="color:#991b1b; font-weight:600;">Critical Vitals detected: ${v.patientName}</h4>
                                        <p style="font-size:0.8rem; color:#b91c1c; margin-top:4px;">BP: ${v.bpSystolic}/${v.bpDiastolic} | Pulse: ${v.pulse} bpm | Temp: ${v.temperature}°F</p>
                                    </div>
                                    <span class="status-badge badge-critical">Active Alert</span>
                                </div>
                            `).join('') || '<div style="color: #64748b; text-align: center; padding: 24px;">No critical active alerts.</div>'}
                        </div>
                    </div>`;
            },

            renderTrends: (con, title) => {
                title.innerText = 'Vitals Insights & Trends';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>📈 Vital Signs Trends</h3>
                        <div style="height: 300px; margin-top: 24px; display: flex; align-items: center; justify-content: center; background: #fafafa; border-radius: 16px; border: 1px dashed #e2e8f0; color: #64748b;">
                            <i class="fas fa-chart-line" style="font-size: 2rem; margin-right: 12px;"></i> Visual Analytics and charts will populate automatically as readings grow.
                        </div>
                    </div>`;
            },

            renderDevices: (con, title) => {
                title.innerText = 'Connected Monitoring Devices';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>📟 Device Directory</h3>
                        <table class="responsive-table" style="margin-top: 16px;">
                            <thead><tr><th>Device ID</th><th>Model</th><th>Location</th><th>Status</th></tr></thead>
                            <tbody>
                                <tr><td>CC-BP-09</td><td>Omron Telehealth Pro</td><td>Ward A - Bed 3</td><td><span class="status-badge badge-normal">Online</span></td></tr>
                                <tr><td>CC-TEMP-12</td><td>WelchAllyn CareTemp</td><td>Ward B - Room 102</td><td><span class="status-badge badge-normal">Online</span></td></tr>
                            </tbody>
                        </table>
                    </div>`;
            },

            renderSettings: (con, title) => {
                title.innerText = 'Vitals Preferences';
                con.innerHTML = `
                    <div class="content-card">
                        <h3>⚙️ Vitals Monitor Settings</h3>
                        <div class="form-field" style="margin-top: 16px;"><label>Default Unit</label><select class="form-input"><option>Fahrenheit (°F)</option><option>Celsius (°C)</option></select></div>
                        <div class="form-field"><label>Critical Alert Threshold (BP Systolic)</label><input class="form-input" type="number" value="140"></div>
                        <button class="btn-primary" onclick="app.showToast('Vitals thresholds updated!', 'success')">Save Settings</button>
                    </div>`;
            },

            openModal: (html) => {
                const root = document.getElementById('modalRoot');
                root.innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal-window" onclick="event.stopPropagation()">${html}</div></div>`;
                root.style.display = 'flex';
            }
        };

        window.loadPage = app.loadPage;
        window.closeModal = () => document.getElementById('modalRoot').style.display = 'none';
        window.addEventListener('DOMContentLoaded', app.init);

    </script>
</body>
</html>
