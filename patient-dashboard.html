<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>ClinicCare Pro | Patient Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- ORIGINAL UI STYLES (PRESERVED) --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5f9ff; color: #0a2540; overflow-x: hidden; }
        .dashboard { display: flex; min-height: 100vh; position: relative; }
        .main-panel { flex: 1; margin-left: 280px; padding: 24px 32px; transition: margin-left 0.3s ease; }
        @media (max-width: 1024px) { .main-panel { margin-left: 0; padding: 16px; } }
        .header-bar { display: flex; justify-content: space-between; align-items: center; background: white; padding: 12px 28px; border-radius: 60px; box-shadow: 0 4px 14px rgba(0,20,50,0.04); margin-bottom: 28px; border: 1px solid #e6edfa; }
        .page-title { font-weight: 700; font-size: 1.6rem; background: linear-gradient(135deg, #142b54, #1f46b0); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        .live-clock { background: #eef3ff; padding: 7px 20px; border-radius: 40px; font-weight: 500; color: #1e4480; font-size: 0.8rem; }
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 28px; }
        @media (max-width: 768px) { .stat-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; } }
        .stat-block { background: white; padding: 18px 22px; border-radius: 32px; border: 1px solid #e2edfc; box-shadow: 0 8px 18px -10px rgba(0,35,70,0.06); display: flex; align-items: center; gap: 18px; }
        .stat-icon { width: 56px; height: 56px; background: linear-gradient(120deg, #eef4ff, #e9e4ff); border-radius: 22px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; color: #2b5fd9; }
        .stat-info h4 { font-weight: 500; color: #667f9e; font-size: 0.75rem; letter-spacing: 0.4px; margin-bottom: 4px; }
        .stat-info .figure { font-weight: 800; font-size: 1.8rem; color: #0a2540; line-height: 1.2; }
        .content-card { background: white; border-radius: 36px; padding: 24px 28px; border: 1px solid #e5edfc; box-shadow: 0 10px 24px -12px rgba(0,30,60,0.06); margin-bottom: 26px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .card-header h3 { font-weight: 700; font-size: 1.3rem; color: #0f2c4e; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { text-align: left; padding: 12px 8px; font-weight: 600; font-size: 0.7rem; color: #5b7295; text-transform: uppercase; border-bottom: 2px solid #e6edfc; }
        td { padding: 12px 8px; border-bottom: 1px solid #f0f4fe; color: #1a3154; font-size: 0.85rem; }
        .status-badge { padding: 5px 14px; border-radius: 50px; font-size: 0.7rem; font-weight: 600; display: inline-block; }
        .badge-active { background: #e1f7ea; color: #0b6e41; }
        .badge-confirmed { background: #e1f7ea; color: #0b6e41; }
        .badge-checkedin { background: #e0f2fe; color: #0369a1; }
        .badge-pending { background: #fff0df; color: #b15500; }
        .badge-progress { background: #e0f2fe; color: #0369a1; }
        .badge-completed { background: #f3f4f6; color: #374151; }
        .badge-blocked { background: #fee2e2; color: #dc2626; }
        .btn-primary { background: linear-gradient(105deg, #2563eb, #4f46e5); color: white; border: none; padding: 10px 24px; border-radius: 36px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .btn-secondary { background: #eef3ff; color: #2563eb; border: 1px solid #cde0ff; padding: 10px 24px; border-radius: 36px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .btn-outline { background: white; border: 1px solid #cde0ff; color: #1e4796; padding: 10px 24px; border-radius: 30px; font-weight: 500; font-size: 0.85rem; cursor: pointer; }
        .btn-danger { background: #fee2e2; color: #dc2626; border: none; padding: 10px 24px; border-radius: 36px; font-weight: 600; font-size: 0.85rem; cursor: pointer; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; z-index: 2000; }
        .modal-window { background: white; border-radius: 48px; padding: 32px 36px; max-width: 500px; width: 90%; box-shadow: 0 35px 70px rgba(0,15,40,0.3); }
        .form-field { margin-bottom: 18px; }
        .form-field label { font-weight: 600; font-size: 0.8rem; display: block; margin-bottom: 6px; color: #2b4570; }
        .form-input { width: 100%; padding: 12px 20px; border: 1.5px solid #e2edfc; border-radius: 36px; font-family: 'Inter', sans-serif; font-size: 0.9rem; }
        .row-fields { display: flex; gap: 16px; }
        .modal-actions { display: flex; gap: 16px; margin-top: 28px; justify-content: flex-end; }
        .toast-notification { position: fixed; bottom: 25px; right: 25px; background: white; border-radius: 60px; padding: 14px 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.12); display: flex; align-items: center; gap: 12px; transform: translateX(450px); transition: transform 0.25s; z-index: 1200; border-left: 4px solid; font-size: 0.85rem; }
        .toast-notification.show { transform: translateX(0); }
        .toast-success { border-left-color: #10b981; }
        .toast-error { border-left-color: #ef4444; }
        .toast-info { border-left-color: #3b82f6; }


    </style>
</head>
<body data-sidebar-role="patient">

    <div class="dashboard">
        <!-- SIDEBAR WILL BE INJECTED HERE -->


        <!-- MAIN PANEL (From Original) -->
        <div class="main-panel">
            <div class="header-bar">
                <div style="display:flex; align-items:center;">
                    <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
                    <span class="page-title" id="headerTitle">Dashboard</span>
                </div>
                <span class="live-clock" id="desktopClock"></span>
            </div>
            <div id="contentArea"></div>
        </div>
    </div>

    <div id="modalRoot" style="display:none;"></div>
    <div class="toast-notification" id="toastMsg"><i class="fas" id="toastIcon"></i><span id="toastText"></span></div>

    <script src="Frontend/assets/js/api.js"></script>
    <script>
        const app = {
            currentUser: null,
            data: { appointments: [], records: [], prescriptions: [], billing: [], doctors: [] },

            init: async () => {
                app.currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const token = localStorage.getItem('authToken');
                if (!app.currentUser || !token || app.currentUser.role !== 'patient') {
                    window.location.href = 'auth.html';
                    return;
                }
                app.setupSidebar();
                app.setupEvents();
                app.startClock();
                await app.loadPage('dashboard');
            },

            setupSidebar: () => {
                fetch('Frontend/components/sidebar.html')
                    .then(r => r.text())
                    .then(html => {
                        const div = document.createElement('div');
                        div.innerHTML = html;
                        const script = div.querySelector('script');
                        if (script) {
                            const newScript = document.createElement('script');
                            newScript.textContent = script.textContent;
                            document.body.appendChild(newScript);
                        }
                    });
            },

            setupEvents: () => {
                // Modal Close
                window.closeModal = () => document.getElementById('modalRoot').style.display = 'none';
            },


            startClock: () => {
                const update = () => {
                    const d = new Date();
                    const timeStr = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    const clock = document.getElementById('desktopClock');
                    if(clock) clock.innerText = timeStr;
                };
                update();
                setInterval(update, 1000);
            },

            showToast: (msg, type = 'success') => {
                const toast = document.getElementById('toastMsg');
                const iconMap = { success: 'fa-check-circle', error: 'fa-exclamation-triangle', info: 'fa-info-circle' };
                document.getElementById('toastIcon').className = 'fas ' + (iconMap[type] || 'fa-info-circle');
                document.getElementById('toastText').innerText = msg;
                toast.className = `toast-notification toast-${type}`;
                toast.classList.add('show');
                setTimeout(() => toast.classList.remove('show'), 2800);
            },

            loadData: async () => {
                try {
                    const [apps, records, rxs, bills, docsData] = await Promise.all([
                        API.get('appointments'),
                        API.get('medical-records'),
                        API.get('prescriptions'),
                        API.get('billing'),
                        API.get('doctors')
                    ]);
                    app.data.appointments = apps;
                    app.data.records = records;
                    app.data.prescriptions = rxs;
                    app.data.billing = bills;
                    app.data.doctors = docsData.doctors || [];
                } catch (e) { 
                    console.error('Load Data Error:', e);
                    app.showToast('Failed to load data', 'error'); 
                }
            },

            openModal: (html) => {
                const root = document.getElementById('modalRoot');
                root.innerHTML = `<div class="modal-overlay" onclick="closeModal()"><div class="modal-window" onclick="event.stopPropagation()">${html}</div></div>`;
                root.style.display = 'flex';
            },

            loadPage: async (page) => {
                await app.loadData();
                const container = document.getElementById('contentArea');
                const title = document.getElementById('headerTitle');
                window.currentDashboardPage = page;
                
                if (window.updateSharedSidebarState) window.updateSharedSidebarState(page);

                if (page === 'dashboard') app.renderDashboard(container, title);
                else if (page === 'appointments') app.renderAppointments(container, title);
                else if (page === 'appointments-add') app.renderBookAppointment(container, title);
                else if (page === 'records') app.renderRecords(container, title);
                else if (page === 'prescriptions') app.renderPrescriptions(container, title);
                else if (page === 'billing') app.renderBilling(container, title);
                else if (page === 'profile') app.renderProfile(container, title);
            },

            renderDashboard: (con, title) => {
                title.innerText = 'Dashboard';
                const today = new Date().toISOString().slice(0,10);
                const upcoming = app.data.appointments.filter(a => a.date >= today && a.status !== 'cancelled').length;
                const pending = app.data.appointments.filter(a => a.status === 'pending').length;
                const completed = app.data.appointments.filter(a => a.status === 'completed').length;
                const due = app.data.billing.filter(b => b.status === 'pending').reduce((sum, b) => sum + Number(b.amount), 0);
                
                const next = app.data.appointments
                    .filter(a => a.date >= today && a.status !== 'cancelled')
                    .sort((a,b) => (a.date + a.time).localeCompare(b.date + b.time))[0];

                con.innerHTML = `
                <div class="stat-grid">
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-info"><h4>UPCOMING</h4><div class="figure">${upcoming}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><h4>PENDING</h4><div class="figure">${pending}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-check-circle"></i></div><div class="stat-info"><h4>COMPLETED</h4><div class="figure">${completed}</div></div></div>
                    <div class="stat-block"><div class="stat-icon"><i class="fas fa-dollar-sign"></i></div><div class="stat-info"><h4>DUE</h4><div class="figure">₹${due}</div></div></div>
                </div>
                <div class="content-card">
                    <div class="card-header"><h3>Next appointment</h3><button class="btn-primary" onclick="app.loadPage('appointments')">View all</button></div>
                    ${next ? `
                        <div class="table-wrapper">
                            <table><tbody>
                                <tr><th>Date</th><td>${next.date}</td></tr>
                                <tr><th>Time</th><td>${next.time}</td></tr>
                                <tr><th>Doctor</th><td>${next.doctor}</td></tr>
                                <tr><th>Reason</th><td>${next.reason || '—'}</td></tr>
                                <tr><th>Status</th><td><span class="status-badge ${
                                    next.status === 'confirmed' ? 'badge-confirmed' : 
                                    next.status === 'checked-in' ? 'badge-checkedin' : 
                                    next.status === 'in-progress' ? 'badge-progress' : 
                                    next.status === 'completed' ? 'badge-completed' : 
                                    'badge-pending'
                                }">${next.status}</span></td></tr>
                            </tbody></table>
                        </div>
                    ` : `<p>No upcoming appointments. <button class="btn-primary" onclick="app.loadPage('appointments-add')">Book now</button></p>`}
                </div>
                <div class="content-card">
                    <div class="card-header"><h3>Active prescriptions</h3><button class="btn-secondary" onclick="app.loadPage('prescriptions')">View all</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Medication</th><th>Instructions</th><th>Refills</th></tr></thead>
                        <tbody>${app.data.prescriptions.slice(0, 2).map(p => `<tr><td>${p.medication}</td><td>${p.instructions}</td><td>${p.refills}</td></tr>`).join('') || '<tr><td colspan="3">No active prescriptions</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderAppointments: (con, title) => {
                title.innerText = 'My Appointments';
                con.innerHTML = `
                <div class="content-card">
                    <div class="card-header"><h3>My Appointments</h3><button class="btn-primary" onclick="app.loadPage('appointments-add')">Book New</button></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Date</th><th>Time</th><th>Doctor</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${app.data.appointments.map(a => `<tr><td>${a.date}</td><td>${a.time}</td><td>${a.doctor}</td><td>${a.reason || '—'}</td><td><span class="status-badge ${
                            a.status === 'confirmed' ? 'badge-confirmed' : 
                            a.status === 'checked-in' ? 'badge-checkedin' : 
                            a.status === 'in-progress' ? 'badge-progress' : 
                            a.status === 'completed' ? 'badge-completed' : 
                            a.status === 'cancelled' ? 'badge-blocked' : 
                            'badge-pending'
                        }">${a.status}</span></td><td>${a.status === 'pending' ? `<button class="btn-danger" onclick="app.cancelAppt('${a.id}')">Cancel</button>` : '—'}</td></tr>`).join('') || '<tr><td colspan="6">No appointments found</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            cancelAppt: async (id) => {
                if (!confirm('Cancel this appointment?')) return;
                try {
                    await API.delete(`appointments/${id}`);
                    app.showToast('Appointment cancelled', 'info');
                    await app.loadPage('appointments');
                } catch (e) { app.showToast('Failed to cancel appointment', 'error'); }
            },

            renderBookAppointment: (con, title) => {
                title.innerText = 'Book Appointment';
                const docs = app.data.doctors;
                con.innerHTML = `
                <div class="content-card" style="width: 100%; padding: 32px; border-radius: 36px; box-shadow: var(--shadow);">
                    <div style="margin-bottom: 24px;">
                        <h3 style="font-size: 1.4rem; font-weight: 700; color: #0a2540;">📅 Book Appointment</h3>
                        <p style="font-size: 0.85rem; color: #64748b; margin-top: 4px;">Schedule an appointment with one of our specialized doctors.</p>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 16px;">
                        <div class="form-field">
                            <label>Doctor</label>
                            <select id="appDoc" class="form-input">
                                ${docs.map(d=>`<option value="${d.id}|${d.name}">${d.name} (${d.specialization})</option>`).join('')}
                            </select>
                        </div>
                        <div class="row-fields">
                            <div class="form-field" style="flex:1;">
                                <label>Date</label>
                                <input type="date" id="appDate" class="form-input" value="${new Date().toISOString().slice(0, 10)}">
                            </div>
                            <div class="form-field" style="flex:1;">
                                <label>Time</label>
                                <input type="time" id="appTime" class="form-input" value="10:00">
                            </div>
                        </div>
                        <div class="form-field">
                            <label>Reason</label>
                            <input type="text" id="appReason" class="form-input" placeholder="e.g. Regular checkup">
                        </div>
                    </div>
                </div>
                <div class="content-card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: 36px; position: sticky; bottom: 0; background: white; z-index: 100;">
                    <button class="btn-outline" onclick="app.loadPage('appointments')">Cancel</button>
                    <button class="btn-primary" onclick="app.saveAppt()">Book Now</button>
                </div>`;
            },

            saveAppt: async () => {
                const docVal = document.getElementById('appDoc').value;
                if (!docVal) { app.showToast('Please select a doctor', 'error'); return; }

                const [dId, dName] = docVal.split('|');
                const newAppt = {
                    patientId: app.currentUser.id,
                    patient: app.currentUser.name,
                    doctorId: dId,
                    doctor: dName,
                    date: document.getElementById('appDate').value,
                    time: document.getElementById('appTime').value,
                    reason: document.getElementById('appReason').value,
                    status: 'pending'
                };
                if(!newAppt.date || !newAppt.time) { app.showToast('Please select date and time', 'error'); return; }
                
                try {
                    await API.post('appointments', newAppt);
                    await API.post('audit-logs', { user: app.currentUser.name, action: `Booked appointment with Dr. ${dName} for ${newAppt.date}` });
                    if (window.closeModal) window.closeModal();
                    app.showToast('Appointment booked successfully', 'success');
                    await app.loadPage('appointments');
                } catch (e) { 
                    console.error('Save Appt Error:', e);
                    app.showToast('Failed to book appointment', 'error'); 
                }
            },

            renderRecords: (con, title) => {
                title.innerText = 'Medical Records';
                con.innerHTML = `
                <div class="content-card">
                    <div class="card-header"><h3>Medical Records</h3></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Date</th><th>Doctor</th><th>Diagnosis</th><th>Action</th></tr></thead>
                        <tbody>${app.data.records.map(r => `<tr><td>${r.date}</td><td>${r.doctor}</td><td>${r.diagnosis}</td><td><button class="btn-secondary" onclick="app.viewRecord('${r.id}')">View</button></td></tr>`).join('') || '<tr><td colspan="4">No records found</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            viewRecord: (id) => {
                const r = app.data.records.find(x => x.id === id);
                if (!r) return;
                app.openModal(`<h3>📄 Medical Record Details</h3>
                    <div class="form-field"><label>Doctor</label><p>${r.doctor}</p></div>
                    <div class="form-field"><label>Diagnosis</label><p>${r.diagnosis}</p></div>
                    <div class="form-field"><label>Prescription</label><p>${r.prescription || 'None'}</p></div>
                    <div class="form-field"><label>Notes</label><p>${r.notes || 'No additional notes.'}</p></div>
                    <div class="modal-actions"><button class="btn-primary" onclick="closeModal()">Close</button></div>`);
            },

            renderPrescriptions: (con, title) => {
                title.innerText = 'My Prescriptions';
                con.innerHTML = `
                <div class="content-card">
                    <div class="card-header"><h3>My Prescriptions</h3></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Date</th><th>Medication</th><th>Dosage/Instructions</th></tr></thead>
                        <tbody>${app.data.prescriptions.map(p => `<tr><td>${p.date}</td><td>${p.medication}</td><td>${p.dosage || p.instructions || '—'}</td></tr>`).join('') || '<tr><td colspan="3">No prescriptions found</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            renderBilling: (con, title) => {
                title.innerText = 'Billing & Invoices';
                con.innerHTML = `
                <div class="content-card">
                    <div class="card-header"><h3>Billing & Invoices</h3></div>
                    <div class="table-wrapper">
                        <table><thead><tr><th>Date</th><th>Description</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>${app.data.billing.map(b => `<tr><td>${b.date}</td><td>${b.description}</td><td>$${b.amount}</td><td><span class="status-badge ${b.status === 'paid' ? 'badge-active' : 'badge-pending'}">${b.status}</span></td><td>${b.status === 'pending' ? `<button class="btn-primary" onclick="app.payBill('${b.id}')">Pay</button>` : '—'}</td></tr>`).join('') || '<tr><td colspan="5">No billing history found</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>`;
            },

            payBill: async (id) => {
                if(!confirm('Confirm payment?')) return;
                try {
                    await API.put(`billing/${id}`, { status: 'paid' });
                    app.showToast('Payment successful', 'success');
                    await app.loadPage('billing');
                } catch (e) { app.showToast('Payment failed', 'error'); }
            },

            renderProfile: (con, title) => {
                title.innerText = 'My Profile';
                con.innerHTML = `
                <div class="content-card">
                    <div class="card-header"><h3>My Profile</h3></div>
                    <div class="profile-info-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
                        <div class="form-field"><label>Full Name</label><input type="text" value="${app.currentUser.name}" class="form-input" disabled></div>
                        <div class="form-field"><label>Email</label><input type="text" value="${app.currentUser.email}" class="form-input" disabled></div>
                    </div>
                </div>`;
            }
        };

        window.loadPage = app.loadPage;
        // Initialize App
        window.addEventListener('DOMContentLoaded', app.init);
    </script>
</body>
</html>
