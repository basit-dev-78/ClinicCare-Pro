<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ClinicCare · Pro Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS VARIABLES (THEMING) --- */
        :root {
            /* Light Theme */
            --primary: #2563eb;
            --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            --primary-glow: rgba(37, 99, 235, 0.2);

            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --bg-sidebar: #ffffff;
            --bg-input: #f8fafc;

            --text-main: #0f172a;
            --text-muted: #64748b;
            --text-inverse: #ffffff;

            --border: #e2e8f0;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);

            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --info: #0ea5e9;

            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --radius: 20px;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --bg-sidebar: #1e293b;
            --bg-input: #334155;

            --text-main: #f8fafc;
            --text-muted: #94a3b8;

            --border: #334155;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        /* --- RESET & BASE --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            transition: background-color 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* --- SIDEBAR --- */


        /* --- MAIN PANEL --- */
        .main-panel {
            flex: 1;
            margin-left: 280px;
            padding: 30px 40px;
            height: 100vh;
            overflow-y: auto;
            transition: var(--transition);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .header-actions {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            transition: var(--transition);
            position: relative;
        }

        .icon-btn:hover {
            color: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
            background: var(--danger);
            border-radius: 50%;
            border: 2px solid var(--bg-card);
        }

        /* --- COMPONENTS --- */
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 30px;
        }

        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }

        .card:hover {
            box-shadow: var(--shadow-lg);
            border-color: var(--primary);
        }

        .stat-card {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            border-radius: 18px;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-blue {
            background: rgba(59, 130, 246, 0.1);
            color: #3b82f6;
        }

        .icon-green {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .icon-purple {
            background: rgba(139, 92, 246, 0.1);
            color: #8b5cf6;
        }

        .icon-orange {
            background: rgba(249, 115, 22, 0.1);
            color: #f97316;
        }

        .stat-data h3 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }

        .stat-data p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 16px;
            color: var(--text-muted);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
        }

        td {
            padding: 16px;
            color: var(--text-main);
            font-size: 0.9rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: var(--bg-input);
        }

        .status-pill {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: capitalize;
        }

        .pill-success {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .pill-warning {
            background: rgba(245, 158, 11, 0.1);
            color: #f59e0b;
        }

        .pill-danger {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
        }

        .pill-info {
            background: rgba(14, 165, 233, 0.1);
            color: #0ea5e9;
        }

        /* Buttons */
        .btn {
            padding: 10px 20px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 10px var(--primary-glow);
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-main);
        }

        .btn-outline:hover {
            border-color: var(--text-main);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.8rem;
            border-radius: 8px;
        }

        /* --- CHARTS (CSS ONLY) --- */
        .chart-bars {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            height: 200px;
            padding-top: 20px;
            gap: 10px;
        }

        .bar-wrap {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .bar-bg {
            width: 100%;
            background: var(--bg-input);
            border-radius: 8px;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .bar-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--primary-gradient);
            border-radius: 8px;
            transition: height 1s ease;
        }

        .bar-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* --- MESSAGES STYLE --- */
        .message-item {
            display: flex;
            gap: 16px;
            padding: 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: var(--transition);
            border-radius: 12px;
        }

        .message-item:hover {
            background: var(--bg-input);
        }

        .msg-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
        }

        .msg-content {
            flex: 1;
        }

        .msg-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .msg-name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .msg-time {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .msg-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* --- MODAL & TOAST --- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--bg-card);
            width: 100%;
            max-width: 500px;
            padding: 32px;
            border-radius: 24px;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: var(--transition);
        }

        .modal-overlay.open .modal {
            transform: translateY(0);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--text-main);
            color: var(--text-inverse);
            padding: 16px 24px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow-lg);
            transform: translateY(100px);
            opacity: 0;
            transition: var(--transition);
            z-index: 200;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* --- RESPONSIVE --- */
        .menu-toggle {
            display: none;
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-main);
        }

        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
                width: 260px;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .main-panel {
                margin-left: 0;
                padding: 20px;
            }

            .menu-toggle {
                display: block;
            }

            .grid-4,
            .grid-2 {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body data-sidebar-role="doctor">
    <div class="dashboard">


        <!-- SIDEBAR WILL BE INJECTED HERE -->

    <!-- Main Content -->
    <main class="main-panel">
        <header class="header">
            <div style="display:flex; align-items:center; gap:16px;">
                <button class="menu-toggle">
                    <i class="fas fa-bars"></i>
                </button>
                <div class="page-title" id="headerTitle">Dashboard</div>
            </div>
            <div class="header-actions">
                <div class="icon-btn" onclick="App.navigate('messages')">
                    <i class="far fa-envelope"></i>
                    <span class="badge-dot"></span>
                </div>
                <div class="icon-btn">
                    <i class="far fa-bell"></i>
                </div>
            </div>
        </header>

        <div id="contentArea" style="opacity: 1; transition: opacity 0.3s;"></div>
    </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) App.closeModal()">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastText">Success</span>
    </div>

    <script src="Frontend/assets/js/api.js"></script>
    <script>
        // --- APPLICATION LOGIC ---
        const App = {
            currentUser: null,
            data: { appointments: [], prescriptions: [], messages: [], patients: 0 },
            currentPage: 'dashboard',

            init: async () => {
                App.currentUser = JSON.parse(localStorage.getItem('currentUser'));
                const token = localStorage.getItem('authToken');
                if (!App.currentUser || !token || App.currentUser.role !== 'doctor') {
                    window.location.href = 'auth.html';
                    return;
                }
                App.setupSidebar();
                App.setupTheme();
                await App.navigate('dashboard');
            },

            setupSidebar: () => {
                fetch('Frontend/components/sidebar.html')
                    .then(r => r.text())
                    .then(html => {
                        const div = document.createElement('div');
                        div.innerHTML = html;
                        const script = div.querySelector('script');
                        if (script) {
                            const newScript = document.createElement('script');
                            newScript.textContent = script.textContent;
                            document.body.appendChild(newScript);
                        }
                    });
            },


            setupTheme: () => {
                const saved = localStorage.getItem('theme') || 'light';
                document.documentElement.setAttribute('data-theme', saved);
            },

            toggleTheme: () => {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem('theme', next);
            },



            loadData: async () => {
                try {
                    const [apps, rxs, usersData] = await Promise.all([
                        API.get('appointments'),
                        API.get('prescriptions'),
                        API.get('users')
                    ]);
                    App.data.appointments = apps;
                    App.data.prescriptions = rxs;
                    App.data.patientsList = usersData.users.filter(u => u.role === 'patient');
                    App.data.patientsCount = App.data.patientsList.length;
                    
                    // Mock messages for now
                    App.data.messages = [
                        { id: 1, from: 'System', text: 'Welcome to ClinicCare Pro', time: 'Just now', read: false }
                    ];
                } catch (e) { App.showToast('Failed to load data'); }
            },

            navigate: async (page) => {
                await App.loadData();
                const container = document.getElementById('contentArea');
                container.style.opacity = '0';
                
                if (window.updateSharedSidebarState) window.updateSharedSidebarState(page);

                setTimeout(() => {
                    if (page === 'dashboard') App.renderDashboard(container);
                    else if (page === 'schedule') App.renderSchedule(container);
                    else if (page === 'patients') App.renderPatients(container);
                    else if (page === 'prescriptions') App.renderPrescriptions(container);
                    else if (page === 'prescriptions-add') App.renderWritePrescription(container);
                    else if (page === 'analytics') App.renderAnalytics(container);
                    else if (page === 'messages') App.renderMessages(container);
                    else if (page === 'settings') App.renderSettings(container);

                    container.style.opacity = '1';
                }, 200);
            },

            // --- RENDERERS ---

            renderDashboard: (con) => {
                const today = new Date().toISOString().slice(0, 10);
                const todayApps = App.data.appointments.filter(a => a.date === today);
                
                con.innerHTML = `
                    <div class="grid-4">
                        <div class="card stat-card">
                            <div class="stat-icon icon-blue"><i class="fas fa-user-md"></i></div>
                            <div class="stat-data"><h3>${App.data.patientsCount}</h3><p>Total Patients</p></div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon icon-green"><i class="fas fa-calendar-check"></i></div>
                            <div class="stat-data"><h3>${todayApps.length}</h3><p>Appointments Today</p></div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon icon-purple"><i class="fas fa-procedures"></i></div>
                            <div class="stat-data"><h3>${App.data.prescriptions.length}</h3><p>Prescriptions</p></div>
                        </div>
                        <div class="card stat-card">
                            <div class="stat-icon icon-orange"><i class="fas fa-dollar-sign"></i></div>
                            <div class="stat-data"><h3>₹${App.data.appointments.filter(a => a.status === 'completed').length * 500}</h3><p>Earnings (Mtd)</p></div>
                        </div>
                    </div>

                    <div class="grid-2">
                        <div class="card">
                            <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                                <h3 style="font-size:1.1rem; font-weight:700;">Upcoming Appointments</h3>
                                <button class="btn btn-sm btn-outline" onclick="App.navigate('schedule')">View All</button>
                            </div>
                            ${App.data.appointments.filter(a => a.status !== 'completed').slice(0, 4).map(app => `
                                <div style="display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--border);">
                                    <div style="display:flex; gap:12px; align-items:center;">
                                        <div style="width:40px; height:40px; background:var(--bg-input); border-radius:10px; display:flex; align-items:center; justify-content:center; color:var(--text-muted);">
                                            <i class="far fa-clock"></i>
                                        </div>
                                        <div>
                                            <div style="font-weight:600;">${app.patient}</div>
                                            <div style="font-size:0.8rem; color:var(--text-muted);">${app.time || ''} - ${app.reason || 'Checkup'}</div>
                                        </div>
                                    </div>
                                    <div style="display:flex; align-items:center; gap:10px;">
                                        <span class="status-pill ${app.status === 'confirmed' ? 'pill-success' : app.status === 'in-progress' ? 'pill-orange' : 'pill-warning'}">${app.status}</span>
                                        ${app.status === 'confirmed' ? `<button class="btn btn-sm btn-primary" onclick="App.startCheckup('${app.id}', '${app.patientId}', '${app.patient}')">Start</button>` : ''}
                                    </div>
                                </div>
                            `).join('') || '<p>No upcoming appointments</p>'}
                        </div>
                        <div class="card">
                            <h3 style="font-size:1.1rem; font-weight:700; margin-bottom:20px;">Patient Activity</h3>
                            <div class="chart-bars">
                                ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map((day, i) => `
                                    <div class="bar-wrap">
                                        <div class="bar-bg"><div class="bar-fill" style="height: ${10 + Math.random() * 40}%"></div></div>
                                        <div class="bar-label">${day}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            },

            renderMessages: (con) => {
                con.innerHTML = `
                    <div class="card" style="min-height: 60vh;">
                        <div class="table-container">
                            <table>
                                <thead><tr><th>From</th><th>Message</th><th>Time</th><th>Action</th></tr></thead>
                                <tbody>
                                    ${App.data.messages.map(msg => `
                                        <tr style="cursor:pointer;" onclick="App.openMessage('${msg.from}')">
                                            <td>
                                                <div style="font-weight:600;">${msg.from}</div>
                                                ${!msg.read ? '<span class="badge-dot" style="position:static; display:inline-block; margin-left:5px; border-color:var(--bg-card);"></span>' : ''}
                                            </td>
                                            <td>${msg.text}</td>
                                            <td>${msg.time}</td>
                                            <td><button class="btn btn-sm btn-outline"><i class="fas fa-reply"></i></button></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderPrescriptions: (con) => {
                con.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                            <h3>Active Prescriptions</h3>
                            <button class="btn btn-primary" onclick="App.navigate('prescriptions-add')"><i class="fas fa-plus"></i> New Rx</button>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead><tr><th>Patient</th><th>Medication</th><th>Dosage</th><th>Status</th><th>Action</th></tr></thead>
                                <tbody>
                                    ${App.data.prescriptions.map(rx => `
                                        <tr>
                                            <td style="font-weight:600;">${rx.patient || 'Patient'}</td>
                                            <td>${rx.medication || rx.med}</td>
                                            <td>${rx.dosage}</td>
                                            <td><span class="status-pill pill-success">Active</span></td>
                                            <td><button class="btn btn-sm btn-primary">Refill</button></td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="5">No active prescriptions</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderWritePrescription: (container) => {
                const patients = App.data.patientsList;
                container.innerHTML = `
                    <div class="card" style="width: 100%; padding: 32px; border-radius: var(--radius); box-shadow: var(--shadow);">
                        <div style="margin-bottom: 24px;">
                            <h3 style="font-size: 1.4rem; font-weight: 700; color: var(--text-main);"><i class="fas fa-pills" style="color:var(--primary); margin-right:8px;"></i> Write Prescription</h3>
                            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 4px;">Log a prescription that will immediately sync with the patient directory and pharmacy inventory.</p>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:16px;">
                            <div>
                                <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:6px;">Patient</label>
                                <select id="rx_pat" class="btn btn-outline" style="width:100%; text-align:left; padding:12px 20px;">
                                    ${patients.map(p => `<option value="${p.id}|${p.name}">${p.name}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:6px;">Medication</label>
                                <input type="text" id="rx_med" class="btn btn-outline" style="width:100%; text-align:left; padding:12px 20px;" placeholder="e.g. Amoxicillin">
                            </div>
                            <div>
                                <label style="display:block; font-weight:600; font-size:0.85rem; margin-bottom:6px;">Dosage & Instructions</label>
                                <input type="text" id="rx_dose" class="btn btn-outline" style="width:100%; text-align:left; padding:12px 20px;" placeholder="e.g. 500mg, twice daily">
                            </div>
                        </div>
                    </div>
                    <div class="card" style="width: 100%; padding: 24px 32px; display: flex; justify-content: flex-end; gap: 16px; margin-top: 30px; box-shadow: var(--shadow); border-radius: var(--radius); position: sticky; bottom: 0; background: white; z-index: 100;">
                        <button class="btn btn-outline" onclick="App.navigate('prescriptions')">Cancel</button>
                        <button class="btn btn-primary" onclick="App.savePrescription()">Create Prescription</button>
                    </div>`;
            },

            renderAnalytics: (con) => {
                con.innerHTML = `
                    <div class="grid-2">
                        <div class="card">
                            <h3 style="margin-bottom:20px;">Revenue Trends</h3>
                            <div class="chart-bars">
                                ${['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'].map((m, i) => `
                                    <div class="bar-wrap">
                                        <div class="bar-bg"><div class="bar-fill" style="height: ${40 + Math.random() * 50}%; background: linear-gradient(to top, #f59e0b, #fbbf24);"></div></div>
                                        <div class="bar-label">${m}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        <div class="card">
                            <h3 style="margin-bottom:20px;">Department Demographics</h3>
                            <div style="display:flex; justify-content:center; align-items:center; height:200px; position:relative;">
                                <!-- CSS Conic Gradient Pie Chart -->
                                <div style="
                                    width:160px; height:160px; border-radius:50%;
                                    background: conic-gradient(
                                        #3b82f6 0% 40%, 
                                        #10b981 40% 70%, 
                                        #f59e0b 70% 90%, 
                                        #6366f1 90% 100%
                                    );
                                "></div>
                                <div style="position:absolute; width:100px; height:100px; background:var(--bg-card); border-radius:50%;"></div>
                            </div>
                            <div style="display:flex; justify-content:space-around; margin-top:20px; font-size:0.8rem;">
                                <div style="display:flex; gap:8px; align-items:center;"><span style="width:10px; height:10px; background:#3b82f6; border-radius:50%;"></span> Cardio</div>
                                <div style="display:flex; gap:8px; align-items:center;"><span style="width:10px; height:10px; background:#10b981; border-radius:50%;"></span> Neuro</div>
                                <div style="display:flex; gap:8px; align-items:center;"><span style="width:10px; height:10px; background:#f59e0b; border-radius:50%;"></span> Ortho</div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderPatients: (con) => {
                con.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                            <h3>Patient Directory</h3>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody>
                                    ${App.data.patientsList.map(p => `
                                        <tr>
                                            <td style="font-weight:600;">${p.name}</td>
                                            <td>${p.email}</td>
                                            <td>${p.phone || '—'}</td>
                                            <td><span class="status-pill pill-success">Active</span></td>
                                            <td>
                                                <button class="btn btn-sm btn-outline" onclick="App.addMedicalRecordModal('${p.id}', '${p.name}')" title="Add Medical Record"><i class="fas fa-notes-medical"></i></button>
                                                <button class="btn btn-sm btn-primary" onclick="App.addPrescriptionModal('${p.id}', '${p.name}')" title="Write Prescription"><i class="fas fa-pills"></i></button>
                                            </td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="5">No patients found</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderSchedule: (con) => {
                con.innerHTML = `
                    <div class="card">
                        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
                            <h3>Appointment Schedule</h3>
                        </div>
                        <div class="table-container">
                            <table>
                                <thead><tr><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead>
                                <tbody>
                                    ${App.data.appointments.sort((a,b) => (a.date+a.time).localeCompare(b.date+b.time)).map(app => `
                                        <tr>
                                            <td style="font-weight:600;">${app.date} ${app.time || ''}</td>
                                            <td>${app.patient}</td>
                                            <td>${app.reason || 'Checkup'}</td>
                                            <td><span class="status-pill ${app.status === 'confirmed' || app.status === 'checked-in' ? 'pill-success' : app.status === 'in-progress' ? 'pill-orange' : app.status === 'pending' ? 'pill-warning' : 'pill-muted'}">${app.status}</span></td>
                                            <td>
                                                ${app.status === 'pending' ? `<button class="btn btn-sm btn-success" onclick="App.confirmAppointment('${app.id}')">Confirm</button>` : 
                                                  (app.status === 'confirmed' || app.status === 'checked-in') ? `<button class="btn btn-sm btn-primary" onclick="App.startCheckup('${app.id}', '${app.patientId}', '${app.patient}')">Start Checkup</button>` : 
                                                  app.status === 'in-progress' ? `<button class="btn btn-sm btn-orange" onclick="App.startCheckup('${app.id}', '${app.patientId}', '${app.patient}')">Resume</button>` : '—'}
                                            </td>
                                        </tr>
                                    `).join('') || '<tr><td colspan="5">No appointments scheduled</td></tr>'}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
            },

            renderSettings: (con) => {
                con.innerHTML = `
                    <div class="card" style="max-width: 600px; margin: 0 auto;">
                        <h3 style="margin-bottom:24px;">Account Settings</h3>
                        <div style="display:flex; flex-direction:column; gap:20px;">
                            <div>
                                <label style="display:block; margin-bottom:8px; font-weight:600; font-size:0.9rem;">Display Name</label>
                                <input type="text" id="set_name" class="btn btn-outline" style="width:100%; text-align:left;" value="${App.currentUser.name}">
                            </div>
                            <div>
                                <label style="display:block; margin-bottom:8px; font-weight:600; font-size:0.9rem;">Email</label>
                                <input type="email" id="set_email" class="btn btn-outline" style="width:100%; text-align:left;" value="${App.currentUser.email}">
                            </div>
                            <div>
                                <label style="display:block; margin-bottom:8px; font-weight:600; font-size:0.9rem;">Specialty</label>
                                <input type="text" class="btn btn-outline" style="width:100%; text-align:left;" value="${App.currentUser.role.toUpperCase()}" disabled>
                            </div>
                            <button class="btn btn-primary" onclick="App.saveSettings()">Save Changes</button>
                        </div>
                    </div>
                `;
            },

            // --- UTILS ---
            // --- ACTIONS ---
            addPrescriptionModal: (pId, pName) => {
                const patients = App.data.patientsList;
                App.showModal(`
                    <h3 style="margin-bottom:20px;">💊 New Prescription</h3>
                    <div style="display:flex; flex-direction:column; gap:16px;">
                        <div>
                            <label style="display:block; font-size:0.8rem; margin-bottom:4px;">Patient</label>
                            <select id="rx_pat" class="btn btn-outline" style="width:100%; text-align:left;">
                                ${patients.map(p => `<option value="${p.id}|${p.name}" ${pId === p.id ? 'selected' : ''}>${p.name}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label style="display:block; font-size:0.8rem; margin-bottom:4px;">Medication</label>
                            <input type="text" id="rx_med" class="btn btn-outline" style="width:100%; text-align:left;" placeholder="e.g. Amoxicillin">
                        </div>
                        <div>
                            <label style="display:block; font-size:0.8rem; margin-bottom:4px;">Dosage & Instructions</label>
                            <input type="text" id="rx_dose" class="btn btn-outline" style="width:100%; text-align:left;" placeholder="e.g. 500mg, twice daily">
                        </div>
                        <div style="display:flex; gap:12px; margin-top:10px;">
                            <button class="btn btn-primary" style="flex:1" onclick="App.savePrescription()">Create Prescription</button>
                            <button class="btn btn-outline" onclick="App.closeModal()">Cancel</button>
                        </div>
                    </div>
                `);
            },

            savePrescription: async () => {
                const [pId, pName] = document.getElementById('rx_pat').value.split('|');
                const rx = {
                    patientId: pId,
                    patient: pName,
                    doctorId: App.currentUser.id,
                    medication: document.getElementById('rx_med').value,
                    dosage: document.getElementById('rx_dose').value,
                    instructions: document.getElementById('rx_dose').value,
                    date: new Date().toISOString().slice(0,10)
                };
                if(!rx.medication) return App.showToast('Medication name required');
                try {
                    await API.post('prescriptions', rx);
                    await API.post('audit-logs', { user: App.currentUser.name, action: `Wrote prescription for ${rx.patient}: ${rx.medication}` });
                    App.showToast('Prescription Created');
                    App.closeModal();
                    App.navigate('prescriptions');
                } catch(e) { App.showToast('Save failed'); }
            },

            addMedicalRecordModal: (pId, pName) => {
                App.showModal(`
                    <h3 style="margin-bottom:20px;">📝 Add Medical Record</h3>
                    <div style="display:flex; flex-direction:column; gap:16px;">
                        <div class="btn btn-outline" style="width:100%; text-align:left; background:var(--bg-input);">Patient: <b>${pName}</b></div>
                        <input type="hidden" id="mr_patId" value="${pId}">
                        <input type="hidden" id="mr_patName" value="${pName}">
                        <div>
                            <label style="display:block; font-size:0.8rem; margin-bottom:4px;">Diagnosis</label>
                            <input type="text" id="mr_diag" class="btn btn-outline" style="width:100%; text-align:left;" placeholder="e.g. Hypertension">
                        </div>
                        <div>
                            <label style="display:block; font-size:0.8rem; margin-bottom:4px;">Clinical Notes</label>
                            <textarea id="mr_notes" class="btn btn-outline" style="width:100%; height:100px; text-align:left; padding:12px;" placeholder="Detailed notes..."></textarea>
                        </div>
                        <div style="display:flex; gap:12px; margin-top:10px;">
                            <button class="btn btn-primary" style="flex:1" onclick="App.saveMedicalRecord()">Save Record</button>
                            <button class="btn btn-outline" onclick="App.closeModal()">Cancel</button>
                        </div>
                    </div>
                `);
            },

            saveMedicalRecord: async () => {
                const record = {
                    patientId: document.getElementById('mr_patId').value,
                    patient: document.getElementById('mr_patName').value,
                    doctorId: App.currentUser.id,
                    doctor: App.currentUser.name,
                    diagnosis: document.getElementById('mr_diag').value,
                    notes: document.getElementById('mr_notes').value,
                    date: new Date().toISOString().slice(0,10)
                };
                if(!record.diagnosis) return App.showToast('Diagnosis required');
                try {
                    await API.post('medical-records', record);
                    await API.post('audit-logs', { user: App.currentUser.name, action: `Added medical record for ${record.patient}` });
                    App.showToast('Medical Record Saved');
                    if (window.activeCheckup) {
                        // If in checkup flow, don't close modal yet or navigate
                        return true;
                    }
                    App.closeModal();
                    App.navigate('patients');
                } catch(e) { App.showToast('Save failed'); throw e; }
            },

            startCheckup: async (apptId, pId, pName) => {
                window.activeCheckup = { apptId, pId, pName };
                try {
                    await API.put(`appointments/${apptId}`, { status: 'in-progress' });
                    App.showModal(`
                        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                            <h3>🩺 Active Checkup: ${pName}</h3>
                            <span class="status-pill pill-orange">In Progress</span>
                        </div>
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                            <div class="card" style="padding:15px; background:var(--bg-input);">
                                <h4 style="margin-bottom:10px;"><i class="fas fa-notes-medical"></i> Medical Record</h4>
                                <input type="hidden" id="mr_patId" value="${pId}">
                                <input type="hidden" id="mr_patName" value="${pName}">
                                <div style="margin-bottom:10px;">
                                    <label style="display:block; font-size:0.75rem;">Diagnosis</label>
                                    <input type="text" id="mr_diag" class="btn btn-outline" style="width:100%; text-align:left;" placeholder="Enter diagnosis">
                                </div>
                                <div>
                                    <label style="display:block; font-size:0.75rem;">Clinical Notes</label>
                                    <textarea id="mr_notes" class="btn btn-outline" style="width:100%; height:120px; text-align:left; padding:10px;" placeholder="Observation, symptoms, etc."></textarea>
                                </div>
                            </div>
                            <div class="card" style="padding:15px; background:var(--bg-input);">
                                <h4 style="margin-bottom:10px;"><i class="fas fa-pills"></i> Prescription</h4>
                                <div style="margin-bottom:10px;">
                                    <label style="display:block; font-size:0.75rem;">Medication</label>
                                    <input type="text" id="rx_med" class="btn btn-outline" style="width:100%; text-align:left;" placeholder="e.g. Paracetamol">
                                </div>
                                <div>
                                    <label style="display:block; font-size:0.75rem;">Dosage & Duration</label>
                                    <input type="text" id="rx_dose" class="btn btn-outline" style="width:100%; text-align:left;" placeholder="e.g. 500mg, 1-0-1 for 5 days">
                                </div>
                                <div style="margin-top:15px; font-size:0.8rem; color:var(--text-muted);">
                                    <i class="fas fa-info-circle"></i> This will be visible to the patient instantly.
                                </div>
                            </div>
                        </div>
                        <div style="display:flex; gap:12px; margin-top:20px; justify-content:flex-end;">
                            <button class="btn btn-outline" onclick="App.closeModal(); App.navigate('schedule');">Save Draft & Close</button>
                            <button class="btn btn-primary" style="padding:10px 30px;" onclick="App.finishCheckup()">Finish Checkup & Save All</button>
                        </div>
                    `);
                } catch(e) { App.showToast('Failed to start checkup'); }
            },

            finishCheckup: async () => {
                const { apptId, pId, pName } = window.activeCheckup;
                try {
                    // 1. Save Medical Record
                    const hasDiag = document.getElementById('mr_diag').value;
                    if (hasDiag) {
                        await App.saveMedicalRecord();
                    }

                    // 2. Save Prescription (if medication is entered)
                    const med = document.getElementById('rx_med').value;
                    if (med) {
                        const rx = {
                            patientId: pId,
                            patient: pName,
                            doctorId: App.currentUser.id,
                            medication: med,
                            dosage: document.getElementById('rx_dose').value,
                            instructions: document.getElementById('rx_dose').value,
                            date: new Date().toISOString().slice(0,10)
                        };
                        await API.post('prescriptions', rx);
                        await API.post('audit-logs', { user: App.currentUser.name, action: `Completed checkup and issued Rx for ${pName}` });
                    }

                    // 3. Complete Appointment
                    await API.put(`appointments/${apptId}`, { status: 'completed' });
                    
                    App.showToast('Checkup Finished Successfully');
                    window.activeCheckup = null;
                    App.closeModal();
                    App.navigate('schedule');
                } catch(e) { App.showToast('Failed to finish checkup'); }
            },

            confirmAppointment: async (id) => {
                try {
                    await API.put(`appointments/${id}`, { status: 'confirmed' });
                    await API.post('audit-logs', { user: App.currentUser.name, action: `Confirmed appointment ID ${id}` });
                    App.showToast('Appointment Confirmed');
                    App.navigate('schedule');
                } catch(e) { App.showToast('Action failed'); }
            },

            completeAppointment: async (id) => {
                try {
                    await API.put(`appointments/${id}`, { status: 'completed' });
                    App.showToast('Appointment Completed');
                    App.navigate('schedule');
                } catch(e) { App.showToast('Action failed'); }
            },

            saveSettings: async () => {
                const name = document.getElementById('set_name').value;
                const email = document.getElementById('set_email').value;
                try {
                    await API.put(`users/${App.currentUser.id}`, { name, email });
                    App.currentUser.name = name;
                    App.currentUser.email = email;
                    localStorage.setItem('currentUser', JSON.stringify(App.currentUser));
                    App.showToast('Settings Saved');
                    location.reload();
                } catch(e) { App.showToast('Update failed'); }
            },

            openMessage: (from) => {
                App.showModal(`
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                        <h3>Message from ${from}</h3>
                        <button class="btn btn-sm btn-outline" onclick="App.closeModal()">Close</button>
                    </div>
                    <div style="background:var(--bg-input); padding:16px; border-radius:12px; margin-bottom:20px;">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit. Please let me know when we can reschedule.
                    </div>
                    <textarea class="btn btn-outline" style="width:100%; height:100px; padding:12px;" placeholder="Type your reply..."></textarea>
                    <button class="btn btn-primary" style="margin-top:16px;" onclick="App.closeModal(); App.showToast('Reply Sent')">Send Reply</button>
                `);
            },

            showModal: (html) => {
                const overlay = document.getElementById('modalOverlay');
                document.getElementById('modalContent').innerHTML = html;
                overlay.classList.add('open');
            },

            closeModal: () => {
                document.getElementById('modalOverlay').classList.remove('open');
            },

            showToast: (msg) => {
                const t = document.getElementById('toast');
                t.querySelector('span').innerText = msg;
                t.classList.add('show');
                setTimeout(() => t.classList.remove('show'), 3000);
            }
        };

        window.loadPage = App.navigate;


        // Initialize
        window.addEventListener('DOMContentLoaded', App.init);
    </script>
</body>

</html>
