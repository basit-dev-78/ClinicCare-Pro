<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>ClinicCare · doctor panel (responsive)</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #f2f7ff; color: #0a1e3c; overflow-x: hidden;
            font-size: 15px;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #eef4fe; }
        ::-webkit-scrollbar-thumb { background: #2563eb; border-radius: 20px; }

        .dashboard { display: flex; min-height: 100vh; width: 100%; }

        /* ===== SIDEBAR (fully responsive) ===== */
        .sidebar {
            width: 240px; background: #0a1a33; border-right: 1px solid rgba(255,255,255,0.05);
            box-shadow: 15px 0 25px -15px rgba(0,0,0,0.3);
            display: flex; flex-direction: column; position: fixed; height: 100vh;
            color: white; z-index: 100; transition: width 0.25s ease;
        }
        .sidebar-header {
            padding: 20px 16px 12px; display: flex; align-items: center; gap: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .brand-icon {
            width: 38px; height: 38px; background: linear-gradient(145deg,#2b6c8f,#1e4a6b);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 20px; box-shadow: 0 8px 14px -6px #1e4a6b; flex-shrink: 0;
        }
        .sidebar-header h2 {
            font-weight: 700; font-size: 1.1rem; background: linear-gradient(to right,#fff,#b3d9ff);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .profile-card {
            background: rgba(255,255,255,0.02); margin: 12px 12px 14px; padding: 14px;
            border-radius: 20px; border: 1px solid #ffffff0a; font-size: 0.8rem;
        }
        .profile-name {
            font-weight: 600; display: flex; align-items: center; gap: 6px;
            margin-bottom: 6px; font-size: 0.85rem; white-space: nowrap;
        }
        .profile-name i { color: #5aa9d9; background: #ffffff0a; padding: 5px; border-radius: 10px; }
        .profile-detail {
            display: flex; align-items: center; gap: 8px; margin: 4px 0;
            color: #b1c9f0; font-size: 0.7rem; white-space: nowrap;
        }
        .profile-detail i { width: 16px; flex-shrink: 0; }
        .profile-detail span { overflow: hidden; text-overflow: ellipsis; }
        .role-tag {
            background: linear-gradient(145deg,#2b6c8f,#1e4a6b); padding: 3px 12px;
            border-radius: 40px; font-size: 0.6rem; font-weight: 600; display: inline-block;
        }

        .nav-menu { flex: 1; padding: 0 6px; overflow-y: auto; }
        .nav-item {
            display: flex; align-items: center; gap: 12px; padding: 8px 14px;
            margin: 3px 0; border-radius: 14px; color: #b0c7f0; font-weight: 500;
            font-size: 0.8rem; transition: 0.2s; cursor: pointer; white-space: nowrap;
        }
        .nav-item i { width: 18px; font-size: 0.95rem; color: #7b98cf; flex-shrink: 0; }
        .nav-item span { overflow: hidden; text-overflow: ellipsis; }
        .nav-item:hover { background: #1e3a8a30; color: white; transform: translateX(3px); }
        .nav-item.active {
            background: linear-gradient(95deg,#2b6c8f,#1e4a6b); color: white;
            box-shadow: 0 5px 12px -4px #1e4a6b; border-left: 3px solid #ffb347;
        }
        .nav-item.active i { color: white; }

        .logout-button {
            margin: 8px 12px 18px; padding: 10px 16px; background: #ef444415;
            border: 1px solid #ef444430; border-radius: 28px; color: #ffb3b3;
            font-weight: 600; display: flex; align-items: center; gap: 12px;
            cursor: pointer; font-size: 0.8rem; white-space: nowrap;
        }
        .logout-button i { flex-shrink: 0; }
        .logout-button:hover { background: #ef4444; color: white; }

        /* ===== MAIN PANEL (fluid) ===== */
        .main-panel {
            flex: 1; margin-left: 240px; padding: 16px 20px; background: #f5f9ff;
            width: calc(100% - 240px); transition: margin-left 0.25s ease, width 0.25s ease;
        }
        .header-bar {
            background: white; padding: 10px 20px; border-radius: 50px;
            box-shadow: 0 4px 12px rgba(0,20,50,0.02); margin-bottom: 20px;
            border: 1px solid #e2edff; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .page-title {
            font-weight: 700; font-size: 1.3rem; background: linear-gradient(145deg,#142b54,#1e40af);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .live-clock {
            background: #ecf2ff; padding: 5px 18px; border-radius: 40px;
            font-weight: 500; font-size: 0.75rem; color: #1e3a8a; white-space: nowrap;
        }

        /* responsive grid */
        .stat-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px;
        }
        .stat-block {
            background: white; padding: 12px 14px; border-radius: 28px; border: 1px solid #e2edff;
            display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 16px -12px #1e40af20;
            min-width: 0;
        }
        .stat-icon {
            width: 46px; height: 46px; background: linear-gradient(145deg,#dbeafe,#ede9fe);
            border-radius: 20px; display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem; color: #2563eb; flex-shrink: 0;
        }
        .stat-info { overflow: hidden; }
        .stat-info h4 { font-weight: 500; color: #61758f; font-size: 0.7rem; white-space: nowrap; }
        .stat-info .figure {
            font-weight: 800; font-size: 1.6rem; color: #0a2540; line-height: 1.2;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .content-card {
            background: white; border-radius: 32px; padding: 18px 22px; border: 1px solid #e2edff;
            box-shadow: 0 12px 24px -16px rgba(0,30,70,0.06); margin-bottom: 20px;
            overflow-x: auto;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 14px; flex-wrap: wrap; gap: 10px;
        }
        .card-header h3 { font-weight: 700; font-size: 1.1rem; color: #0a2540; }

        /* table responsive */
        .table-responsive { overflow-x: auto; margin: 0 -2px; }
        table {
            width: 100%; border-collapse: collapse; font-size: 0.75rem;
            min-width: 600px;
        }
        th {
            text-align: left; padding: 8px 5px; font-weight: 600; color: #5f7396;
            text-transform: uppercase; font-size: 0.6rem; border-bottom: 2px solid #e2edff;
        }
        td { padding: 10px 5px; border-bottom: 1px solid #eef4ff; color: #1a2f52; }

        .status-badge {
            padding: 3px 12px; border-radius: 30px; font-size: 0.6rem;
            font-weight: 600; display: inline-block; white-space: nowrap;
        }
        .badge-active { background: #e2f7e7; color: #0b6e41; }
        .badge-pending { background: #fff2d8; color: #a76000; }
        .badge-cancelled { background: #ffe2e2; color: #b91c1c; }
        .badge-role { background: #e5eeff; color: #1d4ed8; }

        .btn-primary {
            background: linear-gradient(145deg,#2563eb,#4f46e5); color: white; border: none;
            padding: 6px 16px; border-radius: 26px; font-weight: 600; font-size: 0.7rem;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 5px 14px -4px #2563eb; white-space: nowrap;
        }
        .btn-primary:hover { transform: scale(1.02); }
        .btn-secondary {
            background: white; border: 1px solid #c7dfff; color: #1e3a8a;
            padding: 6px 14px; border-radius: 24px; font-size: 0.7rem; cursor: pointer;
            white-space: nowrap;
        }
        .btn-secondary:hover { background: #ecf2ff; }
        .btn-danger {
            background: #ef4444; color: white; padding: 4px 12px;
            border-radius: 20px; font-size: 0.65rem; cursor: pointer; white-space: nowrap;
        }
        .icon-action {
            background: transparent; border: none; font-size: 0.8rem;
            color: #6e85b0; padding: 4px 6px; border-radius: 8px; cursor: pointer;
        }
        .icon-action:hover { background: #e5eeff; color: #2563eb; }

        .row-fields { display: flex; gap: 12px; flex-wrap: wrap; }

        /* modal responsive */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(6px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
            padding: 16px;
        }
        .modal-window {
            background: white; border-radius: 44px; padding: 24px; max-width: 500px;
            width: 100%; max-height: 85vh; overflow-y: auto;
        }
        .form-field { margin-bottom: 14px; }
        .form-field label {
            font-weight: 600; font-size: 0.75rem; margin-bottom: 4px; display: block;
        }
        .form-input, .form-textarea {
            width: 100%; padding: 10px 16px; border: 2px solid #e2edff;
            border-radius: 36px; font-size: 0.8rem; font-family: 'Inter', sans-serif;
        }
        .form-textarea { border-radius: 24px; min-height: 80px; }
        .form-input:focus, .form-textarea:focus { border-color: #2563eb; outline: none; }
        .modal-actions {
            display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;
        }

        .toast-notification {
            position: fixed; bottom: 20px; right: 20px; background: white;
            border-radius: 40px; padding: 10px 22px; box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            display: flex; align-items: center; gap: 10px; transform: translateX(420px);
            transition: transform 0.3s; z-index: 1200; border-left: 4px solid;
            font-size: 0.8rem; max-width: 90vw;
        }
        .toast-notification.show { transform: translateX(0); }
        .toast-success { border-left-color: #10b981; }
        .toast-error { border-left-color: #ef4444; }

        /* ===== RESPONSIVE BREAKPOINTS ===== */
        @media screen and (max-width: 1000px) {
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media screen and (max-width: 768px) {
            .sidebar { width: 70px; }
            .sidebar-header h2, .profile-detail span, .nav-item span,
            .logout-button span { display: none; }
            .profile-name { justify-content: center; }
            .profile-name i { margin-right: 0; }
            .profile-detail { justify-content: center; }
            .role-tag { display: none; }
            .nav-item { justify-content: center; padding: 8px 0; }
            .nav-item i { margin: 0; }
            .logout-button { justify-content: center; padding: 10px 0; }
            .logout-button i { margin: 0; }
            .main-panel { margin-left: 70px; width: calc(100% - 70px); }
        }
        @media screen and (max-width: 600px) {
            .stat-grid { grid-template-columns: 1fr; }
            .header-bar { flex-direction: column; align-items: flex-start; }
            .live-clock { align-self: flex-end; }
            .card-header { flex-direction: column; align-items: flex-start; }
        }
        @media screen and (max-width: 480px) {
            .main-panel { padding: 12px; }
            .content-card { padding: 16px; }
            .modal-window { padding: 18px; }
        }
    </style>
</head>
<body>
<div class="dashboard">
    <!-- SIDEBAR doctor version -->
    <div class="sidebar">
        <div class="sidebar-header">
            <div class="brand-icon"><i class="fas fa-stethoscope"></i></div>
            <h2>ClinicCare · doctor</h2>
        </div>
        <div class="profile-card" id="profileCard"></div>
        <nav class="nav-menu">
            <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></div>
            <div class="nav-item" data-page="appointments"><i class="fas fa-calendar-check"></i> <span>My appointments</span></div>
            <div class="nav-item" data-page="patients"><i class="fas fa-users"></i> <span>My patients</span></div>
            <div class="nav-item" data-page="records"><i class="fas fa-notes-medical"></i> <span>Medical records</span></div>
            <div class="nav-item" data-page="prescriptions"><i class="fas fa-prescription"></i> <span>Prescriptions</span></div>
            <div class="nav-item" data-page="schedule"><i class="fas fa-clock"></i> <span>Today's schedule</span></div>
        </nav>
        <div class="logout-button" id="logoutBtn">
            <i class="fas fa-sign-out-alt"></i> <span>Logout</span>
        </div>
    </div>

    <!-- MAIN PANEL -->
    <div class="main-panel">
        <div class="header-bar">
            <span class="page-title" id="headerTitle">Doctor Dashboard</span>
            <span class="live-clock" id="liveTime"></span>
        </div>
        <div class="content-area" id="contentArea"></div>
    </div>
</div>

<!-- modal root -->
<div id="modalRoot" style="display:none;"></div>
<div class="toast-notification" id="toastMsg"><i class="fas" id="toastIcon"></i><span id="toastText"></span></div>

<script>
(function(){
    // ---------- CURRENT USER (doctor) ----------
    let currentUser = {
        id:'D1', name:'Dr. Sarah Chen', email:'sarah.chen@clinic.com', phone:'555-8234', role:'doctor', specialization:'Cardiology'
    };
    localStorage.setItem('currentUser', JSON.stringify(currentUser));

    // ---------- TOAST ----------
    function showToast(msg, type='success'){
        const t=document.getElementById('toastMsg');
        document.getElementById('toastIcon').className='fas '+(type==='success'?'fa-check-circle':type==='error'?'fa-exclamation-circle':'fa-info-circle');
        document.getElementById('toastText').innerText=msg;
        t.className='toast-notification toast-'+type;
        t.classList.add('show');
        setTimeout(()=>t.classList.remove('show'),3200);
    }
    window.showToast=showToast;

    // ---------- INIT STORAGE (with doctor-relevant data) ----------
    if(!localStorage.getItem('users')){
        localStorage.setItem('users',JSON.stringify([
            {id:'P1',name:'John Doe',email:'john@ex.com',phone:'555-2301',role:'patient',status:'active',dob:'1985-06-15',gender:'Male'},
            {id:'P2',name:'Jane Smith',email:'jane@ex.com',phone:'555-6712',role:'patient',status:'active',dob:'1990-09-22',gender:'Female'},
            {id:'P3',name:'Emily Davis',email:'emily@ex.com',phone:'555-1122',role:'patient',status:'active',dob:'1978-03-10',gender:'Female'},
            {id:'P4',name:'Michael Brown',email:'michael@ex.com',phone:'555-3344',role:'patient',status:'active',dob:'1965-12-02',gender:'Male'},
            {id:'D1',name:'Dr. Sarah Chen',email:'sarah.chen@clinic.com',phone:'555-8234',role:'doctor',specialization:'Cardiology',status:'active'},
            {id:'D2',name:'Dr. James Wilson',email:'wilson@clinic.com',phone:'555-9845',role:'doctor',specialization:'Neurology',status:'active'},
            {id:'D3',name:'Dr. Lisa Ray',email:'lisa.ray@clinic.com',phone:'555-7766',role:'doctor',specialization:'Dermatology',status:'active'}
        ]));
    }
    if(!localStorage.getItem('appointments')){
        localStorage.setItem('appointments',JSON.stringify([
            {id:'A101',patient:'John Doe',doctor:'Dr. Sarah Chen',date:'2025-04-10',time:'09:00',status:'confirmed',reason:'Chest pain',notes:''},
            {id:'A102',patient:'Jane Smith',doctor:'Dr. Sarah Chen',date:'2025-04-10',time:'10:30',status:'checked-in',reason:'Heart palpitations',notes:''},
            {id:'A103',patient:'Emily Davis',doctor:'Dr. Lisa Ray',date:'2025-04-10',time:'11:45',status:'confirmed',reason:'Skin rash',notes:''},
            {id:'A104',patient:'Michael Brown',doctor:'Dr. Sarah Chen',date:'2025-04-10',time:'14:15',status:'pending',reason:'Follow-up',notes:''},
            {id:'A105',patient:'John Doe',doctor:'Dr. Sarah Chen',date:'2025-04-11',time:'09:30',status:'confirmed',reason:'ECG review',notes:''},
            {id:'A106',patient:'Emily Davis',doctor:'Dr. Sarah Chen',date:'2025-04-11',time:'15:00',status:'pending',reason:'Chest discomfort',notes:''}
        ]));
    }
    if(!localStorage.getItem('medicalRecords')){
        localStorage.setItem('medicalRecords',JSON.stringify([
            {id:'M1',patient:'John Doe',doctor:'Dr. Sarah Chen',date:'2025-03-15',diagnosis:'Hypertension',prescription:'Lisinopril 10mg',notes:'BP 140/90, follow up in 1 month'},
            {id:'M2',patient:'Jane Smith',doctor:'Dr. Sarah Chen',date:'2025-03-20',diagnosis:'Arrhythmia',prescription:'Metoprolol 25mg',notes:'Holter monitor scheduled'},
            {id:'M3',patient:'Michael Brown',doctor:'Dr. Sarah Chen',date:'2025-03-28',diagnosis:'High cholesterol',prescription:'Atorvastatin 20mg',notes:'Lipid panel ordered'}
        ]));
    }
    if(!localStorage.getItem('prescriptions')){
        localStorage.setItem('prescriptions',JSON.stringify([
            {id:'R1',patient:'John Doe',doctor:'Dr. Sarah Chen',date:'2025-03-15',medication:'Lisinopril 10mg',instructions:'Once daily',refills:2},
            {id:'R2',patient:'Jane Smith',doctor:'Dr. Sarah Chen',date:'2025-03-20',medication:'Metoprolol 25mg',instructions:'Twice daily',refills:1},
            {id:'R3',patient:'Michael Brown',doctor:'Dr. Sarah Chen',date:'2025-03-28',medication:'Atorvastatin 20mg',instructions:'At bedtime',refills:3}
        ]));
    }

    // profile render
    function renderProfile(){
        const u=currentUser;
        document.getElementById('profileCard').innerHTML=`
            <div class="profile-name"><i class="fas fa-user-md"></i> <span>Dr. ${u.name.split(' ')[1] || 'Chen'}</span></div>
            <div class="profile-detail"><i class="fas fa-envelope"></i> <span>${u.email}</span></div>
            <div class="profile-detail"><i class="fas fa-stethoscope"></i> <span>${u.specialization}</span></div>
            <div><span class="role-tag"><i class="fas fa-id-badge"></i> Cardiologist</span></div>
        `;
    }
    renderProfile();

    // clock
    function tick(){ 
        let d=new Date(); 
        document.getElementById('liveTime').innerText=d.toLocaleString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'}); 
    }
    tick(); setInterval(tick,1000);

    // modal helpers
    function openModal(html){
        document.getElementById('modalRoot').style.display='flex';
        document.getElementById('modalRoot').innerHTML=`<div class="modal-overlay" onclick="closeModal()"><div class="modal-window" onclick="event.stopPropagation()">${html}</div></div>`;
    }
    window.closeModal=function(){ document.getElementById('modalRoot').style.display='none'; };

    // navigation
    const navItems=document.querySelectorAll('.nav-item');
    navItems.forEach(item=>{
        item.addEventListener('click',(e)=>{
            navItems.forEach(n=>n.classList.remove('active'));
            item.classList.add('active');
            let page=item.dataset.page;
            loadPage(page);
            document.getElementById('headerTitle').innerText=item.querySelector('span').innerText;
        });
    });

    window.loadPage=function(page){
        const c=document.getElementById('contentArea');
        if(page==='dashboard') renderDashboard(c);
        else if(page==='appointments') renderAppointments(c);
        else if(page==='patients') renderPatients(c);
        else if(page==='records') renderRecords(c);
        else if(page==='prescriptions') renderPrescriptions(c);
        else if(page==='schedule') renderSchedule(c);
    };

    // ---------- DASHBOARD (doctor overview) ----------
    function renderDashboard(con){
        const apps=JSON.parse(localStorage.getItem('appointments'))||[];
        const doctorName=currentUser.name;
        const myApps=apps.filter(a=>a.doctor===doctorName);
        const today=new Date().toISOString().slice(0,10);
        const todayApps=myApps.filter(a=>a.date===today).length;
        const pendingApps=myApps.filter(a=>a.status==='pending').length;
        const totalPatients=[...new Set(myApps.map(a=>a.patient))].length;
        const upcomingApps=myApps.filter(a=>a.date>=today && a.status!=='cancelled').length;
        
        con.innerHTML=`
            <div class="stat-grid">
                <div class="stat-block"><div class="stat-icon"><i class="fas fa-calendar-day"></i></div><div class="stat-info"><h4>Today's apps</h4><div class="figure">${todayApps}</div></div></div>
                <div class="stat-block"><div class="stat-icon"><i class="fas fa-clock"></i></div><div class="stat-info"><h4>Pending</h4><div class="figure">${pendingApps}</div></div></div>
                <div class="stat-block"><div class="stat-icon"><i class="fas fa-users"></i></div><div class="stat-info"><h4>My patients</h4><div class="figure">${totalPatients}</div></div></div>
                <div class="stat-block"><div class="stat-icon"><i class="fas fa-calendar-week"></i></div><div class="stat-info"><h4>Upcoming</h4><div class="figure">${upcomingApps}</div></div></div>
            </div>
            <div class="content-card">
                <div class="card-header"><h3>Today's appointments</h3><button class="btn-primary" onclick="loadPage('schedule')">View schedule</button></div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Action</th></tr></thead>
                        <tbody>
                            ${myApps.filter(a=>a.date===today).sort((a,b)=>a.time.localeCompare(b.time)).map(a=>`
                            <tr>
                                <td>${a.time}</td><td>${a.patient}</td><td>${a.reason||'—'}</td>
                                <td><span class="status-badge ${a.status==='confirmed'||a.status==='checked-in'?'badge-active':'badge-pending'}">${a.status}</span></td>
                                <td><button class="btn-secondary" onclick="startConsultation('${a.id}')">Consult</button></td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    // ---------- MY APPOINTMENTS ----------
    function renderAppointments(con){
        const apps=JSON.parse(localStorage.getItem('appointments'))||[];
        const doctorName=currentUser.name;
        const myApps=apps.filter(a=>a.doctor===doctorName).sort((a,b)=>a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
        con.innerHTML=`
            <div class="content-card">
                <div class="card-header"><h3>My appointments</h3></div>
                <div class="table-responsive">
                    <table>
                        <thead><tr><th>Date</th><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${myApps.map(a=>`
                            <tr>
                                <td>${a.date}</td><td>${a.time}</td><td>${a.patient}</td><td>${a.reason||'—'}</td>
                                <td><span class="status-badge ${a.status==='confirmed'||a.status==='checked-in'?'badge-active':a.status==='pending'?'badge-pending':'badge-cancelled'}">${a.status}</span></td>
                                <td>
                                    <button class="icon-action" onclick="startConsultation('${a.id}')"><i class="fas fa-notes-medical"></i></button>
                                    <button class="icon-action" onclick="editApptNotes('${a.id}')"><i class="fas fa-edit"></i></button>
                                </td>
                            </tr>`).join('')}
                        </tbody>
                    </table>
                </div>
            </div>
        `;
    }

    // ---------- MY PATIENTS ----------
    function renderPatients(con){
        const users=JSON.parse(localStorage.getItem('users'))||[];
        const patients=users.filter(u=>u.role==='patient');
        const apps=JSON.parse(localStorage.getItem('appointments'))||[];
        const doctorName=currentUser.name;
        const myPatientNames=[...new Set(apps.filter(a=>a.doctor===doctorName).map(a=>a.patient))];
        const myPatients=patients.filter(p=>myPatientNames.includes(p.name));
        
        con.innerHTML=`
            <div class="content-card">
                <div class="card-header"><h3>My patients</h3></div>
                <div class="table-responsive">
                    <table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Last visit</th><th>Action</th></tr></thead>
                    <tbody>${myPatients.map(p=>{
                        const lastVisit=apps.filter(a=>a.patient===p.name && a.doctor===doctorName).sort((a,b)=>b.date.localeCompare(a.date))[0];
                        return `<tr><td>${p.name}</td><td>${p.email}</td><td>${p.phone}</td>
                        <td>${lastVisit?lastVisit.date:'—'}</td>
                        <td><button class="btn-secondary" onclick="viewPatientRecords('${p.name}')">Records</button></td></tr>`;
                    }).join('')}</tbody></table>
                </div>
            </div>
        `;
    }

    // ---------- MEDICAL RECORDS ----------
    function renderRecords(con){
        const records=JSON.parse(localStorage.getItem('medicalRecords'))||[];
        const doctorName=currentUser.name;
        const myRecords=records.filter(r=>r.doctor===doctorName);
        con.innerHTML=`
            <div class="content-card">
                <div class="card-header"><h3>Medical records</h3><button class="btn-primary" onclick="addRecordModal()"><i class="fas fa-plus"></i> New record</button></div>
                <div class="table-responsive">
                    <table><thead><tr><th>Date</th><th>Patient</th><th>Diagnosis</th><th>Prescription</th><th>Actions</th></tr></thead>
                    <tbody>${myRecords.map(r=>`
                        <tr><td>${r.date}</td><td>${r.patient}</td><td>${r.diagnosis}</td><td>${r.prescription}</td>
                        <td><button class="icon-action" onclick="editRecord('${r.id}')"><i class="fas fa-edit"></i></button></td></tr>
                    `).join('')}</tbody></table>
                </div>
            </div>
        `;
    }

    // ---------- PRESCRIPTIONS ----------
    function renderPrescriptions(con){
        const rx=JSON.parse(localStorage.getItem('prescriptions'))||[];
        const doctorName=currentUser.name;
        const myRx=rx.filter(r=>r.doctor===doctorName);
        con.innerHTML=`
            <div class="content-card">
                <div class="card-header"><h3>Prescriptions</h3><button class="btn-primary" onclick="addPrescriptionModal()"><i class="fas fa-plus"></i> New prescription</button></div>
                <div class="table-responsive">
                    <table><thead><tr><th>Date</th><th>Patient</th><th>Medication</th><th>Instructions</th><th>Refills</th></tr></thead>
                    <tbody>${myRx.map(r=>`
                        <tr><td>${r.date}</td><td>${r.patient}</td><td>${r.medication}</td><td>${r.instructions}</td><td>${r.refills}</td></tr>
                    `).join('')}</tbody></table>
                </div>
            </div>
        `;
    }

    // ---------- TODAY'S SCHEDULE ----------
    function renderSchedule(con){
        const apps=JSON.parse(localStorage.getItem('appointments'))||[];
        const doctorName=currentUser.name;
        const today=new Date().toISOString().slice(0,10);
        const todayApps=apps.filter(a=>a.doctor===doctorName && a.date===today).sort((a,b)=>a.time.localeCompare(b.time));
        con.innerHTML=`
            <div class="content-card">
                <div class="card-header"><h3>Schedule for ${today}</h3></div>
                <div class="table-responsive">
                    <table><thead><tr><th>Time</th><th>Patient</th><th>Reason</th><th>Status</th><th>Consult</th></tr></thead>
                    <tbody>${todayApps.map(a=>`
                        <tr><td>${a.time}</td><td>${a.patient}</td><td>${a.reason||'—'}</td>
                        <td><span class="status-badge ${a.status==='confirmed'||a.status==='checked-in'?'badge-active':'badge-pending'}">${a.status}</span></td>
                        <td><button class="btn-primary" onclick="startConsultation('${a.id}')">Start</button></td></tr>
                    `).join('')}</tbody></table>
                </div>
            </div>
        `;
    }

    // ========== MODAL FUNCTIONS (fully working) ==========
    window.startConsultation=function(apptId){
        const apps=JSON.parse(localStorage.getItem('appointments'));
        const appt=apps.find(a=>a.id===apptId);
        if(!appt) return;
        openModal(`
            <h3 style="margin-bottom:16px;">Consultation: ${appt.patient}</h3>
            <p><strong>Date:</strong> ${appt.date} ${appt.time} | <strong>Reason:</strong> ${appt.reason||'—'}</p>
            <div class="form-field"><label>Diagnosis / Notes</label><textarea class="form-textarea" id="consultNotes" placeholder="Examination findings, diagnosis...">${appt.notes||''}</textarea></div>
            <div class="form-field"><label>Prescription</label><input class="form-input" id="consultRx" placeholder="e.g., Lisinopril 10mg"></div>
            <div class="form-field"><label>Instructions</label><input class="form-input" id="consultInstr" placeholder="Once daily"></div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="saveConsultation('${apptId}')">Complete & Save</button>
                <button class="btn-secondary" onclick="closeModal()">Close</button>
            </div>
        `);
    };

    window.saveConsultation=function(apptId){
        const apps=JSON.parse(localStorage.getItem('appointments'));
        const appt=apps.find(a=>a.id===apptId);
        if(!appt) return;
        const notes=document.getElementById('consultNotes')?.value||'';
        const rx=document.getElementById('consultRx')?.value||'';
        const instr=document.getElementById('consultInstr')?.value||'';
        appt.notes=notes;
        appt.status='completed'; // mark as done
        
        // create medical record
        const records=JSON.parse(localStorage.getItem('medicalRecords'))||[];
        const newRecord={
            id:'M'+Math.floor(Math.random()*900+100),
            patient:appt.patient,
            doctor:currentUser.name,
            date:new Date().toISOString().slice(0,10),
            diagnosis:notes.substring(0,50)+'...',
            prescription:rx,
            notes:notes
        };
        records.push(newRecord);
        localStorage.setItem('medicalRecords',JSON.stringify(records));
        
        // create prescription if provided
        if(rx.trim()!==''){
            const rxList=JSON.parse(localStorage.getItem('prescriptions'))||[];
            const newRx={
                id:'R'+Math.floor(Math.random()*900+100),
                patient:appt.patient,
                doctor:currentUser.name,
                date:new Date().toISOString().slice(0,10),
                medication:rx,
                instructions:instr||'As directed',
                refills:0
            };
            rxList.push(newRx);
            localStorage.setItem('prescriptions',JSON.stringify(rxList));
        }
        
        localStorage.setItem('appointments',JSON.stringify(apps));
        closeModal();
        showToast('Consultation saved','success');
        loadPage('dashboard');
    };

    window.editApptNotes=function(apptId){
        const apps=JSON.parse(localStorage.getItem('appointments'));
        const appt=apps.find(a=>a.id===apptId);
        if(!appt) return;
        openModal(`
            <h3 style="margin-bottom:16px;">Edit appointment notes</h3>
            <div class="form-field"><label>Notes</label><textarea class="form-textarea" id="editNotes">${appt.notes||''}</textarea></div>
            <div class="form-field"><label>Status</label><select class="form-input" id="editStatus">
                <option value="pending" ${appt.status==='pending'?'selected':''}>pending</option>
                <option value="confirmed" ${appt.status==='confirmed'?'selected':''}>confirmed</option>
                <option value="checked-in" ${appt.status==='checked-in'?'selected':''}>checked-in</option>
                <option value="completed" ${appt.status==='completed'?'selected':''}>completed</option>
            </select></div>
            <div class="modal-actions">
                <button class="btn-primary" onclick="updateApptNotes('${apptId}')">Update</button>
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
            </div>
        `);
    };

    window.updateApptNotes=function(apptId){
        const apps=JSON.parse(localStorage.getItem('appointments'));
        const appt=apps.find(a=>a.id===apptId);
        if(appt){
            appt.notes=document.getElementById('editNotes')?.value||appt.notes;
            appt.status=document.getElementById('editStatus')?.value||appt.status;
        }
        localStorage.setItem('appointments',JSON.stringify(apps));
        closeModal();
        showToast('Updated','success');
        loadPage('appointments');
    };

    window.viewPatientRecords=function(patientName){
        const records=JSON.parse(localStorage.getItem('medicalRecords'))||[];
        const patientRecords=records.filter(r=>r.patient===patientName);
        openModal(`
            <h3 style="margin-bottom:16px;">Medical records: ${patientName}</h3>
            ${patientRecords.length===0?'<p>No records found</p>':patientRecords.map(r=>`
                <div style="background:#f5f9ff; padding:12px; border-radius:16px; margin-bottom:10px;">
                    <strong>${r.date}</strong> - ${r.diagnosis}<br>
                    <small>${r.notes}</small><br>
                    <em>Rx: ${r.prescription}</em>
                </div>
            `).join('')}
            <div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Close</button></div>
        `);
    };

    window.addRecordModal=function(){
        const patients=JSON.parse(localStorage.getItem('users')).filter(u=>u.role==='patient');
        openModal(`
            <h3 style="margin-bottom:16px;">New medical record</h3>
            <div class="form-field"><label>Patient</label><select class="form-input" id="recPatient">${patients.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}</select></div>
            <div class="form-field"><label>Diagnosis</label><input class="form-input" id="recDiagnosis"></div>
            <div class="form-field"><label>Prescription</label><input class="form-input" id="recRx"></div>
            <div class="form-field"><label>Notes</label><textarea class="form-textarea" id="recNotes"></textarea></div>
            <div class="modal-actions"><button class="btn-primary" onclick="saveRecord()">Save</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>
        `);
    };
    window.saveRecord=function(){
        const records=JSON.parse(localStorage.getItem('medicalRecords'))||[];
        const newRec={
            id:'M'+Math.floor(Math.random()*900+100),
            patient:document.getElementById('recPatient')?.value,
            doctor:currentUser.name,
            date:new Date().toISOString().slice(0,10),
            diagnosis:document.getElementById('recDiagnosis')?.value||'',
            prescription:document.getElementById('recRx')?.value||'',
            notes:document.getElementById('recNotes')?.value||''
        };
        records.push(newRec);
        localStorage.setItem('medicalRecords',JSON.stringify(records));
        closeModal(); showToast('Record added','success'); loadPage('records');
    };

    window.addPrescriptionModal=function(){
        const patients=JSON.parse(localStorage.getItem('users')).filter(u=>u.role==='patient');
        openModal(`
            <h3 style="margin-bottom:16px;">New prescription</h3>
            <div class="form-field"><label>Patient</label><select class="form-input" id="rxPatient">${patients.map(p=>`<option value="${p.name}">${p.name}</option>`).join('')}</select></div>
            <div class="form-field"><label>Medication</label><input class="form-input" id="rxMed"></div>
            <div class="form-field"><label>Instructions</label><input class="form-input" id="rxInstr" value="Once daily"></div>
            <div class="form-field"><label>Refills</label><input class="form-input" type="number" id="rxRefills" value="0"></div>
            <div class="modal-actions"><button class="btn-primary" onclick="savePrescription()">Save</button><button class="btn-secondary" onclick="closeModal()">Cancel</button></div>
        `);
    };
    window.savePrescription=function(){
        const rx=JSON.parse(localStorage.getItem('prescriptions'))||[];
        const newRx={
            id:'R'+Math.floor(Math.random()*900+100),
            patient:document.getElementById('rxPatient')?.value,
            doctor:currentUser.name,
            date:new Date().toISOString().slice(0,10),
            medication:document.getElementById('rxMed')?.value||'',
            instructions:document.getElementById('rxInstr')?.value||'',
            refills:parseInt(document.getElementById('rxRefills')?.value)||0
        };
        rx.push(newRx);
        localStorage.setItem('prescriptions',JSON.stringify(rx));
        closeModal(); showToast('Prescription added','success'); loadPage('prescriptions');
    };

    // logout
    document.getElementById('logoutBtn').addEventListener('click',()=>{
        showToast('Logging out...','info');
        setTimeout(()=>{localStorage.removeItem('currentUser'); window.location.href='index.html';},1000);
    });

    // start
    loadPage('dashboard');
})();
</script>
</body>
</html>
